# KIN 리버스 프록시 — 한 출처(https://localhost:8443)로 전부 모은다
#
#   /api/       → kin-api:3000        판독 상태·판독문·기관 경계
#   /auth/      → kin-keycloak:8080   OIDC (KC_HTTP_RELATIVE_PATH=/auth)
#   /worklist/  → kin-orthanc:8042    HPACS-lite 화면 (ServeFolders)
#   /ohif/      → kin-orthanc:8042    뷰어
#   /dicom-web/ → kin-orthanc:8042    QIDO-RS / WADO-RS
#   그 밖의 Orthanc 경로는 **막는다** — 아래 "무엇을 열어주는가" 참고.

# http로 들어오면 https로 보낸다.
# 출처가 둘이면 토큰의 iss도 둘이 되고, 쿠키도 둘로 갈린다. 출처는 하나여야 한다.
server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/kin.crt;
    ssl_certificate_key /etc/nginx/certs/kin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # **리다이렉트는 상대 경로로 보낸다.**
    #
    # nginx는 기본적으로 `return 302 /path`를 절대 URL로 바꾸면서 **자기가 듣고 있는
    # 포트**를 쓴다. 컨테이너 안에서는 443이지만 밖에서는 8443이라,
    # `https://localhost/worklist/...`(포트 443)로 보내 버린다 — 아무도 안 듣는 포트다.
    # 프록시 뒤에서 포트를 갈아 끼우는 한, 절대 URL을 스스로 만들게 두면 안 된다.
    # 상대 경로로 보내면 브라우저가 지금 보고 있는 출처(포트 포함)에 이어 붙인다.
    absolute_redirect off;

    # DICOM은 크다. nginx 기본 1MB면 업로드가 막히고, 큰 시리즈는 읽다가 끊긴다.
    client_max_body_size 0;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    proxy_http_version 1.1;
    # $http_host는 브라우저가 보낸 Host를 포트까지 그대로 넘긴다.
    # 뒷단이 절대 URL을 만들 때(특히 Keycloak) 이게 맞아야 한다.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Port  8443;

    # 자체 서명 인증서를 쓰는 개발 환경에서 HSTS를 켜면, 브라우저가 이 호스트를
    # https로 기억해 버려서 나중에 http로 돌아갈 수 없다. 배포 때 켠다.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location = / { return 302 /worklist/hpacs-lite/index.html; }

    # ── KIN API ──
    location /api/ { proxy_pass http://api:3000; }

    # ── Keycloak ──
    # 토큰과 쿠키가 커서 기본 프록시 버퍼로는 "upstream sent too big header"가 난다.
    location /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_buffer_size       16k;
        proxy_buffers        8  16k;
        proxy_busy_buffers_size 32k;
    }

    # ══════════ Orthanc ══════════
    #
    # **자격증명을 프록시가 넣는다.**
    #
    # orthanc.json은 AuthenticationEnabled(admin/admin)인데 프론트는 썸네일·통계·
    # DICOMweb을 아무 헤더 없이 부른다. 지금 그게 되는 건 개발자 브라우저에
    # 8042 관리 UI 로그인의 basic auth가 캐시돼 있기 때문이다 — 시크릿 창이나
    # 남의 PC에서는 전부 401이고 **썸네일이 통째로 깨진다.**
    # 브라우저가 PACS 비밀번호를 알아야 하는 구조 자체가 틀렸다. 여기서 끊는다.
    #
    # 무엇을 열어주는가: 화면이 실제로 쓰는 것만. Orthanc 관리 UI(/app/),
    # 환자 삭제, /tools/execute-script 같은 것은 이 출처로 못 온다.
    # 운영자는 localhost:8042로 직접 들어간다.
    #
    # 남은 구멍(6단계): 여기까지 온 사람은 우리 토큰이 없어도 영상을 본다.
    # 썸네일은 <img src>라 Authorization 헤더를 못 붙이기 때문에, 진짜 해결은
    # **토큰을 HttpOnly 쿠키로 옮기고** nginx auth_request로 검사하는 것이다.
    # 한 출처로 모은 것이 그 전제였다.

    location /worklist/ {
        proxy_pass http://orthanc:8042;
        proxy_set_header Authorization "Basic YWRtaW46YWRtaW4=";
    }

    location /ohif/ {
        proxy_pass http://orthanc:8042;
        proxy_set_header Authorization "Basic YWRtaW46YWRtaW4=";
    }

    location /dicom-web/ {
        proxy_pass http://orthanc:8042;
        proxy_set_header Authorization "Basic YWRtaW46YWRtaW4=";
    }

    # 썸네일. 읽기만 — DELETE /instances/{id}는 영상을 지운다.
    location /instances/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://orthanc:8042;
        proxy_set_header Authorization "Basic YWRtaW46YWRtaW4=";
    }

    # SOP Instance UID → Orthanc 내부 ID. 정확히 이 경로만 연다.
    # /tools 아래에는 execute-script처럼 열어주면 안 되는 것들이 있다.
    location = /tools/lookup {
        proxy_pass http://orthanc:8042;
        proxy_set_header Authorization "Basic YWRtaW46YWRtaW4=";
    }

    location = /statistics {
        limit_except GET HEAD { deny all; }
        proxy_pass http://orthanc:8042;
        proxy_set_header Authorization "Basic YWRtaW46YWRtaW4=";
    }

    location = /system {
        limit_except GET HEAD { deny all; }
        proxy_pass http://orthanc:8042;
        proxy_set_header Authorization "Basic YWRtaW46YWRtaW4=";
    }

    # 목록에 없는 것은 여기로 떨어진다. 조용히 뒷단에 넘기지 않는다.
    location / { return 404 "not exposed\n"; }
}
