# R1: TARGET-shaped synthetic stack. Identical to baseline-compose.yml except for the two
# drift facts the Stage-2 target introduces on disk: the proxy references a top-level,
# non-external, internal network, and mounts the host route directory read-only. Every command
# under test is issued against THIS file, exactly as rollout.compose() builds its argv.
# Synthetic only: no product image, no clinical data, no secret.
# The `image:` keys keep ${REHEARSAL_IMAGE} on purpose: HB8 - child_env() strips the job's
# variables, so Compose must read the reference from the project .env the harness writes.
# That reference is digest-pinned exactly once, in the workflow's env block (I9), and is
# deliberately not repeated here so the two cannot drift apart.
services:
  api:
    image: ${REHEARSAL_IMAGE}
    container_name: kin-api
    command: ["sh", "-c", "while true; do sleep 3600; done"]

  orthanc:
    image: ${REHEARSAL_IMAGE}
    container_name: kin-orthanc
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    volumes:
      - ./config/ohif.js:/etc/orthanc/ohif.js:ro
      - ./worklist-v0:/worklist:ro

  proxy:
    image: ${REHEARSAL_IMAGE}
    container_name: kin-proxy
    command: ["nginx", "-g", "daemon off;"]
    networks:
      default: {}
      workflow: {}
    volumes:
      - ./kin-workflow-nginx:/etc/nginx/workflow:ro

# The question under test: with only api and orthanc named explicitly, does this installed
# Compose create this unreferenced network anyway?
networks:
  workflow:
    name: kin-workflow
    internal: true
