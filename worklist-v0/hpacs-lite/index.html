<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>KIN PACS — 로그인</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #10141b; font-family: "Malgun Gothic", "Segoe UI", sans-serif; }
    .box { width: 340px; background: #1b212c; border: 1px solid #2c3444; border-top: 3px solid #2196f3;
           padding: 28px 30px 22px; }
    .logo { color: #fff; font-size: 26px; font-weight: bold; letter-spacing: 1px; margin-bottom: 8px; }
    .logo span { color: #21c7b7; }
    .sub { color: #667; font-size: 11px; margin-bottom: 26px; }
    button { width: 100%; background: #2196f3; color: #fff; border: none; padding: 10px 0; border-radius: 3px;
             font-size: 14px; cursor: pointer; }
    button:hover { background: #1976d2; }
    button:disabled { background: #2c3444; color: #667; cursor: default; }
    button.ghost { background: none; border: 1px solid #3a4356; color: #8892a4; margin-top: 10px; font-size: 12px; padding: 8px 0; }
    button.ghost:hover { background: #232936; color: #aab2c0; }
    #msg { color: #ff8080; font-size: 12px; min-height: 16px; margin-top: 12px; line-height: 1.5; }
    .hint { color: #556; font-size: 11px; margin-top: 20px; line-height: 1.7; border-top: 1px solid #2c3444; padding-top: 14px; }
    .hint b { color: #7f8899; font-weight: normal; }
    .stat { font-size: 11px; color: #667; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">kin <span>KIN PACS</span></div>
    <div class="sub">Korea Imaging Network</div>

    <button id="signin" disabled>확인 중…</button>
    <button class="ghost" id="demo">데모 모드로 둘러보기 (서버 없이)</button>

    <div id="msg"></div>

    <div class="hint" id="hint" style="display:none">
      개발용 계정 — <b>jmryu</b> / <b>doctor</b> / <b>tech</b>, 비밀번호는 모두 <b>kin1234</b><br>
      jmryu는 판독의·방사선사 권한을 모두 가집니다.
    </div>
    <div class="stat" id="stat"></div>
  </div>

  <script src="auth.js"></script>
  <script>
    const $ = s => document.querySelector(s);

    async function boot() {
      // 1) Keycloak에서 돌아온 경우 — ?code= 를 토큰으로 바꾸고 바로 입장
      try {
        if (await KinAuth.handleRedirect()) { location.replace('main.html'); return; }
      } catch (e) {
        $("#msg").textContent = '로그인 실패: ' + e.message;
      }

      // 2) 이미 로그인돼 있으면 통과
      if (await KinAuth.token()) { location.replace('main.html'); return; }

      // 3) Keycloak이 살아 있는지 확인해서 버튼 상태를 정한다
      try {
        const res = await fetch(`${KinAuth.KC}/realms/kin/.well-known/openid-configuration`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        $("#signin").disabled = false;
        $("#signin").textContent = 'KIN 계정으로 로그인';
        $("#hint").style.display = 'block';
        $("#stat").innerHTML = '<span style="color:#4ac06a">●</span> 인증 서버 연결됨';
      } catch (e) {
        $("#signin").textContent = '인증 서버 없음';
        $("#stat").innerHTML = '<span style="color:#d8b24a">●</span> Keycloak 미연결 — <code>docker compose up -d</code> 후 새로고침';
      }
    }

    $("#signin").addEventListener('click', () => KinAuth.login().catch(e => $("#msg").textContent = e.message));
    $("#demo").addEventListener('click', () => { KinAuth.demo(); location.href = 'main.html'; });

    boot();
  </script>
</body>
</html>
