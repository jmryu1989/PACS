<!DOCTYPE html>
<html class="auto-entry">
<head>
  <meta charset="utf-8">
  <title>로그인 — KOREA IMAGING NETWORK</title>
  <link rel="icon" type="image/svg+xml" href="/kin-brand/kin-emblem-j1.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/kin-brand/kin-favicon-32.png">
  <script>
    const KIN_PRODUCTION = location.protocol === 'https:' && location.hostname === 'pacs.koreaimagingnetwork.com';
  </script>
  <style>
    :root {
      --kin-bg: #0B1220;
      --kin-panel: #0E1728;
      --kin-panel2: #111C31;
      --kin-line: rgba(130,160,210,.14);
      --kin-line2: rgba(130,160,210,.22);
      --kin-text: #F2F6FD;
      --kin-muted: #A7B8D6;
      --kin-dim: #5E7396;
      --kin-accent: #4F8EF7;
      --kin-highlight: #9CC3FF;
      --kin-focus-ring: rgba(79,142,247,.14);
      --kin-btn: linear-gradient(180deg,#2E63C8,#1D4794);
      --kin-btn-shadow: 0 12px 26px rgba(8,20,48,.55), inset 0 1px 0 rgba(190,215,255,.22);
      --kin-card-bar: linear-gradient(90deg,#2F6EE0,#4F8EF7 55%,#9CC3FF);
      --kin-gate-glow: rgba(79,142,247,.12);
      --kin-card-shadow: 0 30px 80px rgba(0,2,8,.66), inset 0 1px 0 rgba(190,215,255,.1);
      --kin-error: #F5D5D5;
    }
    * { box-sizing: border-box; }
    html.auto-entry body { visibility: hidden; }
    body {
      min-width: 320px;
      min-height: 620px;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--kin-text);
      background:
        radial-gradient(800px 480px at 50% 28%, var(--kin-gate-glow), transparent 64%),
        var(--kin-bg);
      font-family: Pretendard, "Noto Sans KR", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    }
    .box {
      position: relative;
      width: min(380px, calc(100vw - 36px));
      padding: 36px 36px 30px;
      overflow: hidden;
      background: var(--kin-panel);
      border: 1px solid var(--kin-line2);
      border-radius: 10px;
      box-shadow: var(--kin-card-shadow);
    }
    .box::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 3px;
      content: "";
      background: var(--kin-card-bar);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand img { width: 34px; height: 34px; flex: none; }
    .wordmark { color: var(--kin-muted); font-size: 10.5px; font-weight: 600; letter-spacing: .28em; white-space: nowrap; }
    .brand-title { margin-top: 7px; color: var(--kin-text); font-size: 19px; font-weight: 700; letter-spacing: .1em; }
    .sub { margin: -8px 0 24px; color: var(--kin-muted); font-size: 12.5px; line-height: 1.65; }
    button {
      width: 100%;
      height: 48px;
      padding: 0 15px;
      color: var(--kin-text);
      background: var(--kin-btn);
      border: 1px solid var(--kin-accent);
      border-radius: 8px;
      box-shadow: var(--kin-btn-shadow);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
      cursor: pointer;
      transition: transform .06s, filter .1s, border-color .12s, box-shadow .12s;
    }
    button:hover { filter: brightness(1.08); }
    button:focus-visible { outline: 0; box-shadow: var(--kin-btn-shadow), 0 0 0 3px var(--kin-focus-ring); }
    button:not(:disabled):active { transform: translateY(1px) scale(.99); filter: brightness(1.25); }
    button:disabled {
      color: var(--kin-dim);
      background: var(--kin-panel2);
      border-color: var(--kin-line);
      box-shadow: none;
      cursor: default;
    }
    button.ghost {
      margin-top: 10px;
      color: var(--kin-muted);
      background: var(--kin-panel2);
      border-color: var(--kin-line2);
      box-shadow: none;
      font-size: 12.5px;
      font-weight: 600;
    }
    button.ghost:hover { color: var(--kin-text); border-color: var(--kin-accent); background: var(--kin-panel2); }
    #msg { min-height: 18px; margin-top: 14px; color: var(--kin-error); font-size: 12px; line-height: 1.5; }
    .hint { margin-top: 18px; padding-top: 16px; color: var(--kin-muted); border-top: 1px solid var(--kin-line); font-size: 11.5px; line-height: 1.7; }
    .hint b { color: var(--kin-muted); font-weight: normal; }
    .stat { margin-top: 14px; color: var(--kin-dim); font-size: 11.5px; }
    .stat-dot { margin-right: 5px; }
    .stat-dot.online { color: var(--kin-accent); }
    .stat-dot.offline { color: var(--kin-muted); }
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">
      <img src="kin-emblem-j1.svg" alt="">
      <div>
        <div class="wordmark">KOREA IMAGING NETWORK</div>
        <div class="brand-title">시스템 접속</div>
      </div>
    </div>
    <div class="sub">인증 서버 연결 상태를 확인합니다.</div>

    <button id="signin" disabled>확인 중…</button>
    <button class="ghost" id="register">가입 신청</button>
    <button class="ghost" id="switch" style="display:none">다른 계정으로 로그인</button>
    <button class="ghost" id="demo">데모 모드로 둘러보기 (서버 없이)</button>

    <div id="msg"></div>

    <div class="hint" id="hint" style="display:none">
      로그인 계정은 관리자에게 문의하세요.<br>
      기관이 다르면 서로의 검사가 보이지 않습니다. 원격판독으로 의뢰한 검사만 넘어갑니다.
    </div>
    <div class="stat" id="stat"></div>
  </div>

  <script src="auth.js"></script>
  <script>
    const $ = s => document.querySelector(s);
    const revealLanding = () => document.documentElement.classList.remove('auto-entry');

    // 서버 없는 데모와 연결 진단은 로컬 개발에만 남긴다. 운영에서는 DOM에서도 제거한다.
    if (KIN_PRODUCTION) $("#demo").remove();

    async function boot() {
      const params = new URLSearchParams(location.search);
      const authError = params.get('auth_error');
      if (authError) history.replaceState({}, '', location.pathname + location.hash);

      let initError = null;
      try {
        await KinAuth.init();
      } catch (e) {
        initError = e;
      }

      const session = KinAuth.session();
      if (session) {
        location.replace('main.html');
        return;
      }

      // 정상 첫 진입은 로컬과 운영 모두 바로 로그인으로 보낸다. stale/실패 콜백은
      // 사용자가 원인을 읽고 다시 누를 수 있어야 하므로 자동 재시도로 루프를 만들지 않는다.
      if (!authError && !initError) {
        try {
          await KinAuth.login();
          return;
        } catch (e) {
          initError = e;
        }
      }

      if (authError === 'stale')
        $("#msg").textContent = '만료되었거나 이미 사용한 로그인 링크입니다. 다시 로그인해 주세요.';
      else if (authError)
        $("#msg").textContent = '로그인 실패: ' + authError;
      else if (initError)
        $("#msg").textContent = '로그인 실패: ' + initError.message;

      // 로그인 오류나 인증 서버 장애 때만 랜딩을 보여 주어 재시도할 수 있게 한다.
      revealLanding();

      // Keycloak이 살아 있는지 확인해서 버튼 상태를 정한다
      try {
        const res = await fetch(`${KinAuth.KC}/realms/kin/.well-known/openid-configuration`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        $("#signin").disabled = false;
        $("#signin").textContent = 'KIN 계정으로 로그인';
        $("#switch").style.display = 'block';
        $("#hint").style.display = 'block';
        $("#stat").innerHTML = '<span class="stat-dot online">●</span> 인증 서버 연결됨';
      } catch (e) {
        $("#signin").textContent = '인증 서버 없음';
        $("#stat").innerHTML = '<span class="stat-dot offline">●</span> Keycloak 미연결 — <code>docker compose up -d</code> 후 새로고침';
      }
    }

    $("#signin").addEventListener('click', () => KinAuth.login().catch(e => $("#msg").textContent = e.message));
    $("#register").addEventListener('click', () => KinAuth.register().catch(e => $("#msg").textContent = e.message));
    // 이미 로그인된 세션이 있어도 아이디를 다시 묻는다 (공용 판독 PC / 두 계정 동시 테스트)
    $("#switch").addEventListener('click', () => KinAuth.login({ prompt: 'login' }).catch(e => $("#msg").textContent = e.message));
    $("#demo")?.addEventListener('click', () => { KinAuth.demo(); location.href = 'main.html'; });

    boot();
  </script>
</body>
</html>
