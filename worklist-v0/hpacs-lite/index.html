<!DOCTYPE html>
<html class="auto-entry">
<head>
  <meta charset="utf-8">
  <title>로그인 — KOREA IMAGING NETWORK</title>
  <link rel="icon" type="image/svg+xml" href="/kin-brand/kin-emblem-j1.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/kin-brand/kin-favicon-32.png">
  <script>
    const KIN_PRODUCTION = location.protocol === 'https:' && location.hostname === 'pacs.koreaimagingnetwork.com';
  </script>
  <style>
    :root {
      --kin-bg: #0B1220;
      --kin-panel: #0E1728;
      --kin-panel2: #111C31;
      --kin-line: rgba(130,160,210,.14);
      --kin-line2: rgba(130,160,210,.22);
      --kin-text: #F2F6FD;
      --kin-muted: #A7B8D6;
      --kin-dim: #5E7396;
      --kin-accent: #4F8EF7;
      --kin-highlight: #9CC3FF;
      --kin-focus-ring: rgba(79,142,247,.14);
      --kin-btn: linear-gradient(180deg,#2E63C8,#1D4794);
      --kin-btn-shadow: 0 12px 26px rgba(8,20,48,.55), inset 0 1px 0 rgba(190,215,255,.22);
      --kin-card-bar: linear-gradient(90deg,#2F6EE0,#4F8EF7 55%,#9CC3FF);
      --kin-gate-glow: rgba(79,142,247,.12);
      --kin-card-shadow: 0 30px 80px rgba(0,2,8,.66), inset 0 1px 0 rgba(190,215,255,.1);
      --kin-error: #F5D5D5;
    }
    * { box-sizing: border-box; }
    html.auto-entry body { visibility: hidden; }
    body {
      min-width: 320px;
      min-height: 620px;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--kin-text);
      background:
        radial-gradient(800px 480px at 50% 28%, var(--kin-gate-glow), transparent 64%),
        var(--kin-bg);
      font-family: Pretendard, "Noto Sans KR", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    }
    .box {
      position: relative;
      width: min(380px, calc(100vw - 36px));
      padding: 36px 36px 30px;
      overflow: hidden;
      background: var(--kin-panel);
      border: 1px solid var(--kin-line2);
      border-radius: 10px;
      box-shadow: var(--kin-card-shadow);
    }
    .box::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 3px;
      content: "";
      background: var(--kin-card-bar);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand img { width: 34px; height: 34px; flex: none; }
    .wordmark { color: var(--kin-muted); font-size: 10.5px; font-weight: 600; letter-spacing: .28em; white-space: nowrap; }
    .brand-title { margin-top: 7px; color: var(--kin-text); font-size: 19px; font-weight: 700; letter-spacing: .1em; }
    .sub { margin: -8px 0 24px; color: var(--kin-muted); font-size: 12.5px; line-height: 1.65; }
    button {
      width: 100%;
      height: 48px;
      padding: 0 15px;
      color: var(--kin-text);
      background: var(--kin-btn);
      border: 1px solid var(--kin-accent);
      border-radius: 8px;
      box-shadow: var(--kin-btn-shadow);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
      cursor: pointer;
      transition: transform .06s, filter .1s, border-color .12s, box-shadow .12s;
    }
    button:hover { filter: brightness(1.08); }
    button:focus-visible { outline: 0; box-shadow: var(--kin-btn-shadow), 0 0 0 3px var(--kin-focus-ring); }
    button:not(:disabled):active { transform: translateY(1px) scale(.99); filter: brightness(1.25); }
    button:disabled {
      color: var(--kin-dim);
      background: var(--kin-panel2);
      border-color: var(--kin-line);
      box-shadow: none;
      cursor: default;
    }
    button.ghost {
      margin-top: 10px;
      color: var(--kin-muted);
      background: var(--kin-panel2);
      border-color: var(--kin-line2);
      box-shadow: none;
      font-size: 12.5px;
      font-weight: 600;
    }
    button.ghost:hover { color: var(--kin-text); border-color: var(--kin-accent); background: var(--kin-panel2); }
    #msg { min-height: 18px; margin-top: 14px; color: var(--kin-error); font-size: 12px; line-height: 1.5; }
    #msg.ended { color: var(--kin-muted); }
    .hint { margin-top: 18px; padding-top: 16px; color: var(--kin-muted); border-top: 1px solid var(--kin-line); font-size: 11.5px; line-height: 1.7; }
    .hint b { color: var(--kin-muted); font-weight: normal; }
    .stat { margin-top: 14px; color: var(--kin-dim); font-size: 11.5px; }
    .stat-dot { margin-right: 5px; }
    .stat-dot.online { color: var(--kin-accent); }
    .stat-dot.offline { color: var(--kin-muted); }
    /* S5-UI4: 뷰어 톱니 메뉴에서 뺀 오픈소스 표기. body 기준으로 두어 짧은 창에서도 로그인 카드와 겹치지 않는다. */
    body { position: relative; }
    .oss-notice {
      position: absolute;
      right: 0;
      bottom: 14px;
      left: 0;
      padding: 0 16px;
      color: var(--kin-muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">
      <img src="kin-emblem-j1.svg" alt="">
      <div>
        <div class="wordmark">KOREA IMAGING NETWORK</div>
        <div class="brand-title">시스템 접속</div>
      </div>
    </div>
    <div class="sub">인증 서버 연결 상태를 확인합니다.</div>

    <button id="signin">KIN 계정으로 로그인</button>
    <button class="ghost" id="register">가입 신청</button>
    <button class="ghost" id="switch">다른 계정으로 로그인</button>
    <button class="ghost" id="demo">데모 모드로 둘러보기 (서버 없이)</button>
    <button class="ghost" id="retry-logout" style="display:none">Retry Log Out</button>

    <div id="msg"></div>

    <div class="hint" id="hint">
      로그인 계정은 관리자에게 문의하세요.<br>
      기관이 다르면 서로의 검사가 보이지 않습니다. 원격판독으로 의뢰한 검사만 넘어갑니다.
    </div>
    <div class="stat" id="stat"></div>
  </div>
  <footer class="oss-notice" id="oss-notice">이 뷰어는 오픈소스 OHIF Viewer(MIT 라이선스)를 기반으로 합니다.</footer>

  <script src="auth.js"></script>
  <script src="work-context.js"></script>
  <script>
    const $ = s => document.querySelector(s);
    const revealLanding = () => document.documentElement.classList.remove('auto-entry');
    // 이 문서의 관문은 auth.js의 세션 상태를 따른다. 업무 화면으로의 이동은 그 관문이 업무를 받아들일 때만 한다.
    KinWorkContext.follow(KinAuth);

    // 서버 없는 데모와 연결 진단은 로컬 개발에만 남긴다. 운영에서는 DOM에서도 제거한다.
    if (KIN_PRODUCTION) $("#demo").remove();

    // S7-U5 닫힘 상태(auth.js endState). 서버가 종료를 확인하지 못한 동안에는 남은 세션으로 업무에 들어가지 않고 다시
    // 보내는 것은 사용자의 Retry Log Out뿐이다. 종료 확인은 이 브라우저의 KIN 로그인 세션만 말한다(Keycloak 전체가 아니다).
    // 안내는 실패의 구분만 말하고 서버의 기술 오류 원문은 보이지 않는다.
    const END_NOTICES = {
      replaced: '이 브라우저에서 다른 로그인이 시작되어 이 화면의 로그인 세션은 더 쓸 수 없습니다. 업무 화면은 닫혔습니다. 다시 사용하려면 로그인해 주세요.',
      conflict: '다른 요청과 겹쳐 서버의 로그인 세션을 끝내지 못했습니다. 업무 화면은 닫혔습니다. Retry Log Out을 눌러 다시 시도해 주세요.',
      storage: '서버 저장소 문제로 로그인 세션 종료를 확인하지 못했습니다. 업무 화면은 닫혔습니다. 잠시 뒤 Retry Log Out을 눌러 주세요.',
      network: '서버에 연결하지 못해 로그인 세션 종료를 확인하지 못했습니다. 업무 화면은 닫혔습니다. Retry Log Out을 눌러 다시 시도해 주세요.',
      timeout: '서버가 제한 시간 안에 답하지 않아 로그인 세션 종료를 확인하지 못했습니다. 업무 화면은 닫혔습니다. Retry Log Out을 눌러 다시 시도해 주세요.',
      refused: '서버가 로그아웃 요청을 받아들이지 않아 종료를 확인하지 못했습니다. 업무 화면은 닫혔습니다. Retry Log Out을 눌러 다시 시도해 주세요.',
      credentials: '로그아웃 요청에 이 브라우저의 로그인 세션 정보가 없어 서버가 세션 종료를 확인하지 못했습니다. 업무 화면은 닫혔습니다. Retry Log Out을 누르거나 다시 로그인해 주세요.',
      // Log out을 누른 창이 저장을 기다리는 사이 닫혔다: 로그아웃 요청은 나가지 않았고 세션은 남아 있을 수 있다.
      abandoned: '로그아웃을 시작한 창이 닫혀 로그인 세션 종료를 확인하지 못했습니다. Retry Log Out을 눌러 종료하거나, 로그인 버튼을 눌러 다시 로그인해 주세요.',
      ending: '로그아웃 요청의 결과를 아직 확인하지 못했습니다. 업무 화면은 닫혔습니다. 결과가 바뀌지 않으면 Retry Log Out을 눌러 다시 시도해 주세요.',
    };

    /**
     * 주소에 실려 온 알림(auth_error)은 한 번 읽고 주소에서 지운다(A012) — 새로고침·뒤로 가기가 지난 알림을 되살리지 않는다.
     * 알림은 상태가 아니다: 실제 닫힘 상태(종료 기록, 미확인 로그아웃)가 있으면 그 안내와 Retry Log Out이 먼저이고, 살아 있는
     * 세션이 확인되면 알림 없이 들어간다. 알림이 있는 도착에서는 로그인을 스스로 다시 시작하지 않는다(되돌이 고리를 만들지 않는다).
     */
    const authError = new URLSearchParams(location.search).get('auth_error');
    if (authError) history.replaceState({}, '', location.pathname + location.hash);
    const ARRIVAL_NOTICES = {
      stale: '만료되었거나 이미 사용한 로그인 링크입니다. 다시 로그인해 주세요.',
      session_active: '이 브라우저에 로그인된 세션이 있어 로그인을 시작하지 않았습니다. 로그인 버튼을 다시 눌러 주세요.',
      entry_unconfirmed: '로그인 세션을 확인하지 못해 업무 화면을 열지 않았습니다. 로그인 버튼을 누르면 다시 확인합니다.',
      // 종료 요청의 답을 잃었으면 시간이 지나도, 다시 눌러도 확인되지 않는다(S7-U5 D600) — 다시 누르기를 해결책으로 약속하지
      // 않고 관리자에게 넘긴다. 다시 누를 길은 막지 않는다(답이 정해지면 그때는 들어간다).
      end_unconfirmed: '이전 로그인 종료를 확인하지 못했습니다. 이 상태는 기다려도 풀리지 않을 수 있으니 관리자에게 문의하세요. Login을 다시 누를 수는 있습니다.',
      login_failed: '로그인을 마치지 못했습니다. 잠시 뒤 로그인 버튼을 다시 눌러 주세요.',
      // 재인증의 확인 단계에 인증 서버가 두 번 모두 "지금 처리할 수 없음"으로 답했다. 들어가지도 끝내지도 않았다.
      sso_unidentified: '인증 서버에서 이 브라우저의 이전 로그인을 확인하지 못했습니다. 잠시 뒤 Login을 다시 누르세요.',
    };

    let shownEnd = false;
    function showEnd(end) {
      shownEnd = true;
      const retry = $("#retry-logout");
      const message = $("#msg");
      message.classList.toggle('ended', end.state === 'confirmed');
      if (end.state === 'confirmed') {
        retry.style.display = 'none';
        message.textContent = '이 브라우저의 KIN 로그인 세션을 끝냈습니다. 다시 사용하려면 로그인해 주세요.';
      } else if (end.state === 'unknown') {
        retry.style.display = 'none';
        // 로그인 뒤의 진입 확인이 거절됐을 때(만료·이미 사용·다른 세션)와 저장소를 믿을 수 없을 때는 사정이 다르다.
        message.textContent = end.reason === 'entry'
          ? '로그인 확인이 만료되었거나 이미 사용되어 업무 화면을 열지 않았습니다. 로그인 버튼을 눌러 다시 로그인해 주세요.'
          : '로그아웃 상태를 확인할 수 없어 자동으로 로그인하지 않습니다. 로그인 버튼을 눌러 주세요.';
      } else {
        // 쿠키가 다른 로그인의 것이면 다시 보낼 종료 요청이 없다 — 그 요청은 그 로그인을 겨눌 뿐이다.
        retry.style.display = end.reason === 'replaced' && end.state !== 'ending' ? 'none' : 'block';
        message.textContent = END_NOTICES[end.state === 'ending' ? 'ending' : end.reason] || END_NOTICES.ending;
      }
    }

    let retrying = false;
    // 이 문서가 업무 화면으로 이동을 시작했다. 그 뒤에는 랜딩을 다시 그리지 않는다.
    let leaving = false;
    // 다른 문서가 종료를 시작했거나 그 결과를 기록하면 그 상태를 보인다. 상태가 지워진 것(다른 탭의 명시적 로그인)은 자동
    // 진입의 근거가 아니라서 보이던 안내를 그대로 둔다. 종료 기록이 localStorage에 남지 못했으면 storage 알림이 오지 않으므로
    // auth.js의 종료 통지와 이 창으로 돌아온 순간에도 같은 상태를 다시 읽는다(Astra S7-U5-R-001-F01). 어느 세션의 기록을
    // 따를지는 auth.js가 정한다 — 여기는 그 결과를 보일 뿐이다.
    function followEnd() {
      if (retrying || leaving) return;
      const end = KinAuth.endState();
      if (!end) return;
      const first = !shownEnd;
      showEnd(end);
      if (first) {
        revealLanding();
        probe();
      }
    }
    addEventListener('storage', followEnd);
    addEventListener('focus', followEnd);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) followEnd(); });
    KinAuth.onEndedElsewhere(followEnd);

    $("#retry-logout").addEventListener('click', async () => {
      if (retrying) return;
      retrying = true;
      $("#retry-logout").disabled = true;
      try { await KinAuth.retryLogout(); }
      finally {
        retrying = false;
        $("#retry-logout").disabled = false;
        showEnd(KinAuth.endState() || { state: 'unknown' });
      }
    });

    async function boot() {
      // 종료 상태(명시적 로그아웃·미확인 종료·믿을 수 없는 저장소)가 일반 자동 진입보다 먼저다: 기존 세션이 있어도 업무
      // 화면으로 옮기지 않고 자동 로그인·자동 재시도도 하지 않는다.
      const end = KinAuth.endState();
      if (end) {
        showEnd(end);
        revealLanding();
        probe();
        return;
      }

      let initError = null;
      // 다른 창의 로그아웃 준비를 기다리는 동안의 문장(A017). 그 준비가 끝나면 지우고, 결과(진입·닫힘)는 아래가 정한다.
      let held = null;
      try {
        await KinAuth.init({ retry: true, onRetry: () => {
          if (shownEnd || leaving) return;
          $("#msg").textContent = '세션을 다시 확인하고 있습니다. 확인되면 자동으로 들어갑니다…';
          revealLanding();
          probe();
        }, onHold: text => {
          if (shownEnd || leaving) return;
          if (text) {
            held = $("#msg").textContent = text;
            revealLanding();
            probe();
          } else if (held !== null && $("#msg").textContent === held) {
            $("#msg").textContent = '';
          }
        } });
      } catch (e) {
        initError = e;
      }

      // 답을 기다리는 사이 다른 문서가 종료를 시작했으면 그 안내(storage 처리)가 이 화면의 것이다.
      if (shownEnd) return;
      const session = KinAuth.session();
      // 서버가 방금 확인한 세션이 있고 이 문서의 관문이 지금 업무를 받아들일 때만 업무 화면으로 간다 — 확인을 기다리는 사이
      // 닫힌 문서는 그 답으로 들어가지 않는다. S5-U2a: clinician-only는 clinician.html, 그 밖(혼합·판독의·기사·관리자·승인
      // 대기)은 예전처럼 main.html. 알림(auth_error)을 달고 온 문서도 같다: 살아 있는 세션이 확인되면 클릭 없이 들어간다.
      if (session && KinWorkContext.commit(KinWorkContext.capture('document'), () => {
        leaving = true;
        location.replace(KinAuth.home(session));
      })) return;

      // 평소의 첫 진입(저장소를 믿을 수 있고 종료 기록이 없는데 서버가 세션이 없다고 답했다)은 로그인 단추를 누르게 하지
      // 않고 바로 로그인 화면으로 보낸다. 알림을 달고 돌아온 문서, 확인이 실패한 문서, 닫힌 문서는 보내지 않는다 — 사람이
      // 원인을 읽고 누를 수 있어야 하고, 자동 재시도가 되돌이 고리를 만들지 않아야 한다. 종료 기록을 지우거나 업무를 여는
      // 것은 어느 쪽이든 그 로그인이 성공한 뒤의 진입 확인이다.
      if (!session && !authError && !initError && KinAuth.autoLogin()) {
        leaving = true;
        return;
      }

      // 실제 닫힘 상태가 알림보다 먼저다: 끝내지 못한 로그아웃의 사유와 Retry Log Out이 일회성 알림에 가려지지 않는다.
      const closed = KinAuth.endState();
      if (closed)
        showEnd(closed);
      else if (authError)
        $("#msg").textContent = ARRIVAL_NOTICES[authError] || '로그인 실패: ' + authError;
      else if (initError)
        $("#msg").textContent = '세션을 확인하지 못했습니다. 로그인 버튼을 누르면 다시 확인합니다. ' + initError.message;

      revealLanding();
      probe();
    }

    /**
     * 인증 서버의 연결 상태 줄(A011). 알림일 뿐이고 로그인 버튼을 막지 않는다: 살아 있는 세션으로 들어가는 Login은 인증
     * 서버 없이 간다. 확인에는 한도가 있고(auth.js), 닿지 않았던 확인은 사람이 이 창으로 돌아오거나 버튼을 눌렀을 때 다시
     * 한다 — 장애가 지나간 뒤에도 "연결 안 됨"이 남지 않고, 스스로 끝없이 묻지도 않는다.
     */
    let probing = false, probedAt = 0, reachable = null, reprobeTimer = null;
    const REPROBE_GAP_MS = 3000;
    async function probe() {
      if (probing || leaving) return;
      probing = true;
      probedAt = Date.now();
      const ok = await KinAuth.idpReachable();
      probing = false;
      reachable = ok;
      if (leaving) return;
      $("#stat").innerHTML = ok
        ? '<span class="stat-dot online">●</span> 인증 서버 연결됨'
        : '<span class="stat-dot offline">●</span> 인증 서버에 연결하지 못했습니다. 이 창으로 돌아오거나 버튼을 누르면 다시 확인합니다.';
    }
    /**
     * 닿지 않았던 확인을 다시 한다(창 초점·탭 표시·버튼 실패 뒤). 직전 확인에서 3초가 지나지 않았으면 버리지 않고 그 3초가
     * 끝나는 때로 한 번 미룬다(SEB-F07: 돌아온 사람이 보는 "연결 안 됨"이 남지 않게). 타이머는 하나뿐이고, 스스로 다시
     * 걸지 않는다 — 끝없이 묻지 않는다. 닿았으면 아무것도 하지 않는다(인증 서버로 스스로 이동하지도 않는다).
     */
    function reprobe() {
      if (reachable === true || leaving || reprobeTimer) return;
      const wait = REPROBE_GAP_MS - (Date.now() - probedAt);
      if (wait <= 0) { probe(); return; }
      reprobeTimer = setTimeout(() => { reprobeTimer = null; if (reachable !== true) probe(); }, wait);
    }
    addEventListener('focus', reprobe);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reprobe(); });

    // 버튼의 일이 실패하면 그 사유를 보이고(같은 버튼으로 다시 할 수 있다), 인증 서버의 상태도 다시 확인한다.
    const press = action => action().catch(e => { $("#msg").textContent = e.message; probedAt = 0; reprobe(); });
    $("#signin").addEventListener('click', () => press(() => KinAuth.login()));
    $("#register").addEventListener('click', () => press(() => KinAuth.register()));
    // 이미 로그인된 세션이 있어도 아이디를 다시 묻는다 (공용 판독 PC / 두 계정 동시 테스트)
    $("#switch").addEventListener('click', () => press(() => KinAuth.switchAccount()));
    $("#demo")?.addEventListener('click', () => { KinAuth.demo(); location.href = 'main.html'; });

    boot();
  </script>
</body>
</html>
