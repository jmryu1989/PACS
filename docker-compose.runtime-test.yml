# Use the production API image with the existing local test ports/Keycloak realm.
# This file does not contain production hosts, TLS paths or credentials.
services:
  api:
    image: ${KIN_TEST_API_IMAGE:-kin-api:c1-candidate}
    build:
      target: production
      args:
        VCS_REF: ${KIN_REVISION:-unknown}
    environment:
      DEPLOYMENT_MODE: production
    volumes: !reset []
