name: Validate production image — hanging-protocols

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Public PR code runs without production credentials or a persisted Git token.
permissions:
  contents: read

concurrency:
  group: validate-hanging-protocols-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hanging-protocols:
    # A separate job, not extra suites inside measurements: the four hanging-protocol
    # suites must not consume that job's budget, and each profile needs its own fresh
    # runner with an empty Docker daemon. The same 40-minute job policy and 28-minute
    # live step as the existing e2e jobs. The profile's own per-suite budgets
    # (400/240/120/300 plus four 35s margins = 1200s) fit measurement_ci.py's
    # 25-minute deadline, so the trailing hanging-protocol flows keep their slice
    # even if the shared invariants and worklist suites run to their caps.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Hanging protocol profile isolation, bounded budget and artifact policy
        run: python3 scripts/record-run.py --run-dir tmp/hp-ci/measurement-ci --cwd . --file tests/measurement_ci.py --file tests/measurement_ci_test.py --file .github/workflows/validate.yml --file .github/workflows/output-integration.yml --file tests/e2e/test_critical_result.py --file tests/e2e/test_prior_selection.py --file .github/workflows/gateway-e2e.yml --file tests/e2e/test_related_filter.py --file tests/e2e/test_favorites.py --file tests/e2e/test_source_keys.py --file tests/e2e/test_study_access.py --file tests/e2e/test_study_access_refs.py --file tests/e2e/test_study_tags.py -- python3 -B tests/measurement_ci_test.py
      - name: Keep pinned browser dependencies independent of unused Chrome APT repository
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Cache pinned Python downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/e2e/requirements.txt', 'gateway/agent/requirements.txt') }}
      - name: Install synthetic DICOM and pinned browser test dependencies
        timeout-minutes: 15
        run: |
          python3 -m venv "$RUNNER_TEMP/hp-python"
          # invariants_live.py runs gateway/agent/test_agent.py with sys.executable, so this
          # interpreter also needs the gateway agent's own pinned dependency. No other
          # profile selects invariants_live, so no existing job had to install it.
          "$RUNNER_TEMP/hp-python/bin/python" -m pip install -r tests/e2e/requirements.txt -r gateway/agent/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/hp-python/bin/python" -m playwright install --with-deps chromium
      - name: Confirm exact declared invariants, worklist and hanging protocol selection
        run: python3 scripts/record-run.py --run-dir tmp/hp-ci/execution-selection --cwd . --file tests/measurement_ci.py --file tests/execution_selection_test.py --file tests/invariants_live.py --file tests/e2e/test_worklist.py --file worklist-v0/hpacs-lite/main.html --file api/src/pacs.service.ts --file api/src/study-identity.ts --file tests/hanging_protocol_api_live.py --file tests/e2e/test_hanging_protocol.py --file tests/e2e/test_prior_selection.py --file tests/e2e/test_related_filter.py --file tests/finding_api_test.py --file tests/e2e/test_critical_result.py --file worklist-v0/hpacs-lite/main-split.bundle.js --file scripts/main-split-order.json --file scripts/build-main-split-bundle.py --file .gitattributes --file api/src/pacs/values.ts --file api/src/pacs/access.ts --file api/src/pacs/institutions.ts --file api/src/pacs/worklist.ts --file api/src/pacs/dicom-gateway.ts --file api/src/pacs/preferences.ts --file api/src/pacs/filters.ts --file api/src/pacs/study-state.ts --file api/src/pacs/tech-note.ts --file api/src/pacs/report-draft.ts --file api/src/pacs/report-evidence.ts --file api/src/pacs/report-commit.ts --file api/src/pacs/hold.ts --file api/src/pacs/clinician.ts --file api/src/pacs/audit.ts --file api/src/pacs/metrics.ts --file worklist-v0/hpacs-lite/page-core.js --file worklist-v0/hpacs-lite/study-state.js --file worklist-v0/hpacs-lite/order-list-store.js --file worklist-v0/hpacs-lite/report-templates.js --file worklist-v0/hpacs-lite/report-dictation.js --file worklist-v0/hpacs-lite/report-templates-ui.js --file worklist-v0/hpacs-lite/worklist-columns-view.js --file worklist-v0/hpacs-lite/worklist-state.js --file worklist-v0/hpacs-lite/worklist-data.js --file worklist-v0/hpacs-lite/worklist-view.js --file worklist-v0/hpacs-lite/sr-reader.js --file worklist-v0/hpacs-lite/current-study.js --file worklist-v0/hpacs-lite/study-info-panel.js --file worklist-v0/hpacs-lite/related-studies.js --file worklist-v0/hpacs-lite/study-thumbnails.js --file worklist-v0/hpacs-lite/order-list.js --file worklist-v0/hpacs-lite/study-image-requests.js --file worklist-v0/hpacs-lite/study-corrections.js --file worklist-v0/hpacs-lite/related-report.js --file worklist-v0/hpacs-lite/report-editor.js --file worklist-v0/hpacs-lite/report-draft-sync.js --file worklist-v0/hpacs-lite/report-structure-pane.js --file worklist-v0/hpacs-lite/report-citation-pane.js --file worklist-v0/hpacs-lite/report-draft-save.js --file worklist-v0/hpacs-lite/report-commit.js --file worklist-v0/hpacs-lite/report-hold.js --file worklist-v0/hpacs-lite/work-exit.js --file worklist-v0/hpacs-lite/worklist-polling.js --file worklist-v0/hpacs-lite/report-history.js --file worklist-v0/hpacs-lite/report-toolbar.js --file worklist-v0/hpacs-lite/viewer-placement.js --file worklist-v0/hpacs-lite/viewer-launch.js --file worklist-v0/hpacs-lite/feature-mounts.js --file worklist-v0/hpacs-lite/clinical-context-panel.js --file worklist-v0/hpacs-lite/critical-result-mounts.js --file worklist-v0/hpacs-lite/study-questions.js --file worklist-v0/hpacs-lite/workspace-panels.js --file worklist-v0/hpacs-lite/worklist-controls.js --file worklist-v0/hpacs-lite/saved-filters.js --file worklist-v0/hpacs-lite/worklist-row-events.js --file worklist-v0/hpacs-lite/telerad-request.js --file worklist-v0/hpacs-lite/context-menu.js --file worklist-v0/hpacs-lite/related-controls.js --file worklist-v0/hpacs-lite/session-end.js --file worklist-v0/hpacs-lite/page-boot.js --file worklist-v0/hpacs-lite/worklist-folder-tree.js --file worklist-v0/hpacs-lite/worklist-folder-tree.css --file tests/page_source.py --file tests/page_source.cjs --file tests/main_split_harness.cjs --file tests/main_move_contract.cjs --file tests/dictation_refusal_oracle.py --file tests/live_admin_credential.py --file tests/live_test_gate.py -- "$RUNNER_TEMP/hp-python/bin/python" -B tests/execution_selection_test.py
      - name: Dictation refusal oracle behavior, vectors and tagged mutants (S3-ASR-U5)
        # The judge of the live U5 cases, proven before they run; it never imports invariants_live.py (.env).
        # Round 11 added `npm ci` + Prisma generate in front of the oracle (behaviour cases run the real controller),
        # so the budget matches the measurements job's own npm ci step (5 min) plus the oracle itself.
        timeout-minutes: 10
        run: |
          npm ci --prefix api --ignore-scripts
          node api/node_modules/prisma/build/index.js generate --schema api/prisma/schema.prisma
          python3 scripts/record-run.py --run-dir tmp/hp-ci/dictation-refusal-oracle --cwd . --file tests/dictation_refusal_oracle.py --file tests/dictation_refusal_oracle_test.py --file tests/dictation_api_test.cjs --file tests/service_test_loader.cjs --file tests/invariants_live.py --file api/src/asr.service.ts --file api/src/asr-destination.ts --file api/src/auth.guard.ts --file api/src/auth.service.ts --file api/src/pacs.service.ts --file api/src/pacs/values.ts --file api/src/pacs/access.ts --file api/src/pacs/institutions.ts --file api/src/pacs/worklist.ts --file api/src/pacs/dicom-gateway.ts --file api/src/pacs/preferences.ts --file api/src/pacs/filters.ts --file api/src/pacs/study-state.ts --file api/src/pacs/tech-note.ts --file api/src/pacs/report-draft.ts --file api/src/pacs/report-evidence.ts --file api/src/pacs/report-commit.ts --file api/src/pacs/hold.ts --file api/src/pacs/clinician.ts --file api/src/pacs/audit.ts --file api/src/pacs/metrics.ts --file api/src/dictation.controller.ts --file api/src/dictation-parser.ts --file api/src/dictation-audio.ts -- python3 -B tests/dictation_refusal_oracle_test.py
      - name: Isolated declared invariants, worklist and hanging protocol tests
        timeout-minutes: 28
        run: |
          "$RUNNER_TEMP/hp-python/bin/python" tests/measurement_ci.py --profile hanging-protocols
      - name: Sanitized synthetic hanging protocol evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-hanging-protocols-results
          path: |
            tests/e2e/artifacts/hanging-protocols-ci/
            tests/e2e/artifacts/HP-*.png
            tmp/hp-ci/
          if-no-files-found: error
          retention-days: 7
