name: EMR-D clinical attached-record contracts

# Unit D: round 1's pure/contract cases and mutants of api/src/emr-clinical; the server cases (tests/emr/d/server_test.cjs)
# and the live suite tests/emr/d/live.py (EmrDLive: TEST-D-01..04 server halves, the write/amend/reopen flow, the live
# mutants M-D-01..05) on the production API image of this commit, one disposable database, through scripts/run-tests.py.
# Nothing here is added to the candidate selection (tests/candidate_ci.py) or a shared profile; that is integration's.
# One source for everything (DR2-07): TARGET_SHA is checked out, labelled into the image and names its tag, the live run
# uses exactly that tag, and the last step proves that every record and the image name that same SHA - for a pull request
# (its head, not the merge ref), a push and a dispatch of another candidate_sha alike. Each record hashes what its command
# consumes (DR3-05): the step `id` names its declared inputs in emr/units/d.json ci.recorded_inputs - the compiler
# configuration and lock, the Prisma schema and migrations, the declaration, driver, gate and image. The last step
# (tests/emr/d/same_source.py, R5-21) compares every record with TARGET_SHA's own git objects: an input missing, without a
# valid hash, changed while its command ran, added, removed or different from TARGET_SHA, a log changed afterwards, a
# non-zero exit, collected cases (node's junit report, the mutant summaries, the runner's lines) other than the declared
# ones, an unrun step or an image identity of another revision fails the run. The node test steps report as junit so that
# the collected cases are read by an installed XML parser, skips kept apart from passes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full lowercase 40-character commit SHA to validate (default: the dispatched ref)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: emr-d-${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  emr-d:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Requested source is a full commit SHA
        id: target-sha
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "TARGET_SHA must be a full lowercase 40-character SHA"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Checked-out source is the requested SHA
        id: checkout-identity
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: TypeScript, Nest and Prisma pinned by api/package-lock.json (no lifecycle scripts)
        timeout-minutes: 5
        run: |
          node --version
          npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Generate the Prisma client for the API typecheck
        working-directory: api
        run: ./node_modules/.bin/prisma generate
      - name: API typecheck including api/src/emr-clinical
        id: typecheck
        run: python3 scripts/record-run.py --run-dir tmp/emr-d-ci/typecheck --cwd . --tree api/src --file api/tsconfig.json --file api/package-lock.json --file api/prisma/schema.prisma -- node api/node_modules/typescript/bin/tsc --noEmit --incremental false --listFiles --extendedDiagnostics --pretty false -p api
      - name: D contracts and C01-C56 model selection (C52 explicitly deferred to R2 DOM)
        id: contract
        if: ${{ !cancelled() }}
        run: python3 scripts/record-run.py --run-dir tmp/emr-d-ci/contract --cwd . --tree api/src/emr-clinical --tree api/src/emr-contract --file tests/emr/d/contract_test.cjs --file api/tsconfig.json --file api/package-lock.json -- docker run --rm --network none --read-only --tmpfs /tmp -v "$PWD:/src:ro" -w /src node:22-alpine node --test --test-reporter=junit tests/emr/d/contract_test.cjs
      - name: Retained 14 and invariant 12 mutants (contract models distinguished; M-D-06 is round 2)
        id: mutants
        if: ${{ !cancelled() }}
        run: python3 scripts/record-run.py --run-dir tmp/emr-d-ci/mutants --cwd . --tree api/src/emr-clinical --tree api/src/emr-contract --file tests/emr/d/mutants.py --file tests/emr/d/same_source.py --file scripts/record-run.py --file tests/emr/d/contract_test.cjs --file api/tsconfig.json --file api/package-lock.json -- python3 -B tests/emr/d/mutants.py
      - name: D server cases and the d.json declaration (TEST-D-01..04 pure halves, this workflow's source binding)
        id: server
        if: ${{ !cancelled() }}
        run: python3 scripts/record-run.py --run-dir tmp/emr-d-ci/server --cwd . --tree api/src --tree api/prisma --tree tests/emr/d --file emr/units/d.json --file api/tsconfig.json --file api/nest-cli.json --file api/package.json --file api/package-lock.json --file api/start-production.sh --file api/.dockerignore --file api/Dockerfile --file .github/workflows/emr-d.yml --file scripts/record-run.py --file scripts/emr-compose.py --file scripts/run-tests.py --file tests/live_test_gate.py -- node --test --test-reporter=junit tests/emr/d/server_test.cjs
      - name: Production API image of this commit
        id: image
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: python3 scripts/record-run.py --run-dir tmp/emr-d-ci/image --cwd . --tree api/src --tree api/prisma --file api/Dockerfile --file api/.dockerignore --file api/start-production.sh --file api/package.json --file api/package-lock.json --file api/tsconfig.json --file api/nest-cli.json -- docker build --target production --build-arg "VCS_REF=${{ env.TARGET_SHA }}" -t "kin-emrd-ci:${{ env.TARGET_SHA }}" api
      - name: The image is of the requested source (its revision label is TARGET_SHA)
        id: image-identity
        if: ${{ !cancelled() }}
        run: |
          revision="$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "kin-emrd-ci:$TARGET_SHA")"
          test "$revision" = "$TARGET_SHA" || { echo "image revision '$revision' is not $TARGET_SHA"; exit 1; }
          mkdir -p tmp/emr-d-ci
          docker image inspect -f '{{ .Id }} {{ index .Config.Labels "org.opencontainers.image.revision" }}' "kin-emrd-ci:$TARGET_SHA" > tmp/emr-d-ci/image-identity.txt
      - name: EMR-D live (EmrDLive) on an empty hosted daemon through scripts/run-tests.py
        id: live
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        env:
          KIN_EMR_D_IMAGE_IDENTITY: tmp/emr-d-ci/image-identity.txt
          KIN_TEST_API_IMAGE: kin-emrd-ci:${{ env.TARGET_SHA }}
        run: python3 scripts/record-run.py --run-dir tmp/emr-d-ci/live --cwd . --tree tests/emr/d --tree api/prisma/migrations --file emr/units/d.json --file scripts/emr-compose.py --file scripts/run-tests.py --file tests/live_test_gate.py --file tmp/emr-d-ci/image-identity.txt -- python3 -B scripts/run-tests.py --module tests/emr/d/live.py --unit emr-d-ci-live --mode live --timeout 2700
      - name: Verify main records and final producer checkout
        id: producer-source
        if: ${{ !cancelled() }}
        run: python3 -B tests/emr/d/same_source.py --producer main
      - name: EMR-D evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emr-d-main-records
          path: tmp/emr-d-ci/
          if-no-files-found: error
          retention-days: 7

  emr-d-server-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    env:
      TARGET_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify source and install the pinned compiler
        timeout-minutes: 5
        run: |
          [ "$(git rev-parse HEAD)" = "$TARGET_SHA" ]
          npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Generate the Prisma client for the server imports
        working-directory: api
        run: ./node_modules/.bin/prisma generate
      - name: Server mutants (each fix of DR2-01..08 and DR3-01..05 reverted, Astra's AM10; the DR3-06 notation equivalents)
        id: server-mutants
        if: ${{ !cancelled() }}
        run: python3 scripts/record-run.py --run-dir tmp/emr-d-ci/server-mutants --cwd . --tree api/src --tree api/prisma --tree tests/emr/d --file emr/units/d.json --file api/tsconfig.json --file api/nest-cli.json --file api/package.json --file api/package-lock.json --file api/start-production.sh --file api/.dockerignore --file api/Dockerfile --file .github/workflows/emr-d.yml --file scripts/record-run.py --file scripts/emr-compose.py --file scripts/run-tests.py --file tests/live_test_gate.py -- python3 -B tests/emr/d/server_mutants.py
      - name: Verify server-mutants records and final producer checkout
        id: producer-source
        if: ${{ !cancelled() }}
        run: python3 -B tests/emr/d/same_source.py --producer server-mutants
      - name: Preserve every mutant execution including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emr-d-server-mutants
          path: tmp/emr-d-ci/
          if-no-files-found: error
          retention-days: 7

  emr-d-gate:
    needs: [emr-d, emr-d-server-mutants]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Collect the main recorder from the same workflow run
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: emr-d-main-records
          path: tmp/emr-d-ci/
      - name: Collect the server mutant recorder from the same workflow run
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: emr-d-server-mutants
          path: tmp/emr-d-ci/
      - name: Every record and the image are of TARGET_SHA, and each record hashed what its command consumes (source = image = evidence)
        id: same-source
        if: ${{ !cancelled() }}
        run: python3 -B tests/emr/d/same_source.py
      - name: Preserve the combined gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emr-d-results
          path: tmp/emr-d-ci/
          if-no-files-found: error
          retention-days: 7
