name: Validate immutable deployment candidate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full lowercase 40-character commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
    steps:
      - name: Checkout reviewed runner tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
      - name: Validate immutable candidate input
        run: python3 -B tools/tests/candidate_ci.py --check-sha "$CANDIDATE_SHA"
      - name: Checkout immutable candidate separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: target
          persist-credentials: false
      - name: Keep browser install independent of unused Chrome APT repository
        run: |
          python3 -B tools/tests/ci_browser_apt_test.py
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 tools/scripts/ci_browser_apt.py
      - name: Cache pinned Python downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('target/tests/e2e/requirements.txt', 'target/gateway/agent/requirements.txt') }}
      - name: Install candidate pinned synthetic test dependencies
        timeout-minutes: 15
        run: |
          python3 -m venv "$RUNNER_TEMP/candidate-python"
          "$RUNNER_TEMP/candidate-python/bin/python" -m pip install -r target/tests/e2e/requirements.txt -r target/gateway/agent/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/candidate-python/bin/python" -m playwright install --with-deps chromium
      - name: Candidate runner guards and exact sequence
        run: |
          "$RUNNER_TEMP/candidate-python/bin/python" -B tools/tests/candidate_ci_test.py
      # Exact collection: 89 invariants + 15 worklist + 10 retained flows + W2 folder/edit/save/relogin.
      - name: Final candidate invariants, worklist and cumulative workflows
        timeout-minutes: 26
        run: |
          "$RUNNER_TEMP/candidate-python/bin/python" -B tools/tests/candidate_ci.py --target "$GITHUB_WORKSPACE/target" --candidate-sha "$CANDIDATE_SHA"
      # The candidate runner requires a new evidence directory; nest bundle evidence after it exits.
      - name: Check candidate committed bundle without generating it
        if: always()
        timeout-minutes: 3
        working-directory: target
        run: |
          git fetch --no-tags --depth=1 origin 0261b1c834c4d5ff5c610185b17a40763985097b
          python3 scripts/record-run.py --run-dir tests/e2e/artifacts/candidate-ci/bundle-check --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/main-split.bundle.js --file worklist-v0/hpacs-lite/page-core.js --file worklist-v0/hpacs-lite/study-state.js --file worklist-v0/hpacs-lite/order-list-store.js --file worklist-v0/hpacs-lite/report-templates.js --file worklist-v0/hpacs-lite/report-dictation.js --file worklist-v0/hpacs-lite/report-templates-ui.js --file worklist-v0/hpacs-lite/worklist-columns-view.js --file worklist-v0/hpacs-lite/worklist-state.js --file worklist-v0/hpacs-lite/worklist-data.js --file worklist-v0/hpacs-lite/worklist-view.js --file worklist-v0/hpacs-lite/sr-reader.js --file worklist-v0/hpacs-lite/current-study.js --file worklist-v0/hpacs-lite/study-info-panel.js --file worklist-v0/hpacs-lite/related-studies.js --file worklist-v0/hpacs-lite/study-thumbnails.js --file worklist-v0/hpacs-lite/order-list.js --file worklist-v0/hpacs-lite/study-image-requests.js --file worklist-v0/hpacs-lite/study-corrections.js --file worklist-v0/hpacs-lite/related-report.js --file worklist-v0/hpacs-lite/report-editor.js --file worklist-v0/hpacs-lite/report-draft-sync.js --file worklist-v0/hpacs-lite/report-structure-pane.js --file worklist-v0/hpacs-lite/report-citation-pane.js --file worklist-v0/hpacs-lite/report-draft-save.js --file worklist-v0/hpacs-lite/report-commit.js --file worklist-v0/hpacs-lite/report-hold.js --file worklist-v0/hpacs-lite/work-exit.js --file worklist-v0/hpacs-lite/worklist-polling.js --file worklist-v0/hpacs-lite/report-history.js --file worklist-v0/hpacs-lite/report-toolbar.js --file worklist-v0/hpacs-lite/viewer-placement.js --file worklist-v0/hpacs-lite/viewer-launch.js --file worklist-v0/hpacs-lite/feature-mounts.js --file worklist-v0/hpacs-lite/clinical-context-panel.js --file worklist-v0/hpacs-lite/critical-result-mounts.js --file worklist-v0/hpacs-lite/study-questions.js --file worklist-v0/hpacs-lite/workspace-panels.js --file worklist-v0/hpacs-lite/worklist-controls.js --file worklist-v0/hpacs-lite/saved-filters.js --file worklist-v0/hpacs-lite/worklist-row-events.js --file worklist-v0/hpacs-lite/telerad-request.js --file worklist-v0/hpacs-lite/context-menu.js --file worklist-v0/hpacs-lite/related-controls.js --file worklist-v0/hpacs-lite/session-end.js --file worklist-v0/hpacs-lite/page-boot.js --file scripts/main-split-order.json --file scripts/build-main-split-bundle.py --file .gitattributes -- python3 -B scripts/build-main-split-bundle.py --check
      - name: Sanitized immutable candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ env.CANDIDATE_SHA }}
          path: target/tests/e2e/artifacts/candidate-ci/
          if-no-files-found: error
          retention-days: 7
