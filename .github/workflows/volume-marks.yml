name: Validate production image — volume-marks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Public PR code runs without production credentials or a persisted Git token.
permissions:
  contents: read

concurrency:
  group: validate-volume-marks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  volume-marks:
    # A sixth MPR suite group, not extra suites inside volume-mpr, volume-slab, volume-path, volume-batch or
    # volume-sync-preferences, whose caps stay as they are. The manual 3D annotation suite and its saved annotated
    # three-plane/batch output suite share this runner; the profile's per-suite caps (660+35)+(420+35) = 1150s
    # bound the live step. The pure annotation model stays registered in the volume-rendering job.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Marks profile isolation, bounded budget and artifact policy
        run: python3 scripts/record-run.py --run-dir tmp/marks-ci/measurement-ci --cwd . --file tests/measurement_ci.py --file tests/measurement_ci_test.py --file .github/workflows/validate.yml --file .github/workflows/output-integration.yml --file tests/e2e/test_critical_result.py --file tests/e2e/test_prior_selection.py --file .github/workflows/gateway-e2e.yml --file tests/e2e/test_related_filter.py --file tests/e2e/test_favorites.py --file tests/e2e/test_source_keys.py --file tests/e2e/test_study_access.py --file tests/e2e/test_study_access_refs.py --file tests/e2e/test_study_tags.py -- python3 -B tests/measurement_ci_test.py
      - name: Keep pinned browser dependencies independent of unused Chrome APT repository
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Cache pinned Python downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/e2e/requirements.txt') }}
      - name: Install synthetic DICOM and pinned browser test dependencies
        timeout-minutes: 15
        run: |
          python3 -m venv "$RUNNER_TEMP/marks-python"
          "$RUNNER_TEMP/marks-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/marks-python/bin/python" -m playwright install --with-deps chromium
      - name: Armed 3D annotation pick is not previewed by progressive refinement on the real panel
        timeout-minutes: 5
        run: python3 scripts/record-run.py --run-dir tmp/marks-ci/progressive-dom --cwd . --file worklist-v0/hpacs-lite/volume-marks.js --file worklist-v0/hpacs-lite/viewer-volume-marks.js --file worklist-v0/hpacs-lite/viewer-volume-progressive.js --file worklist-v0/hpacs-lite/viewer-volume-orientation.js --file tests/viewer_volume_marks_progressive_dom_test.py -- "$RUNNER_TEMP/marks-python/bin/python" -B tests/viewer_volume_marks_progressive_dom_test.py
      - name: Confirm exact declared manual 3D annotation and annotated output selection
        run: python3 scripts/record-run.py --run-dir tmp/marks-ci/execution-selection --cwd . --file tests/measurement_ci.py --file tests/execution_selection_test.py --file tests/e2e/test_volume_marks.py --file tests/e2e/test_volume_mpr_print.py --file worklist-v0/hpacs-lite/viewer-volume-marks.js --file worklist-v0/hpacs-lite/volume-marks.js --file worklist-v0/hpacs-lite/viewer-volume-progressive.js --file worklist-v0/hpacs-lite/viewer-volume-batch.js --file worklist-v0/hpacs-lite/viewer-volume-job.js --file worklist-v0/hpacs-lite/viewer-volume-job-print.js --file worklist-v0/hpacs-lite/viewer-jobs.js --file worklist-v0/hpacs-lite/viewer-volume-orientation.js --file config/ohif.js --file api/src/viewer-volume-marks.ts --file tests/e2e/test_prior_selection.py --file tests/e2e/test_related_filter.py --file worklist-v0/hpacs-lite/main.html --file tests/invariants_live.py --file tests/finding_api_test.py --file tests/e2e/test_critical_result.py --file worklist-v0/hpacs-lite/main-split.bundle.js --file scripts/main-split-order.json --file scripts/build-main-split-bundle.py --file .gitattributes --file worklist-v0/hpacs-lite/page-core.js --file worklist-v0/hpacs-lite/study-state.js --file worklist-v0/hpacs-lite/order-list-store.js --file worklist-v0/hpacs-lite/report-templates.js --file worklist-v0/hpacs-lite/report-dictation.js --file worklist-v0/hpacs-lite/report-templates-ui.js --file worklist-v0/hpacs-lite/worklist-columns-view.js --file worklist-v0/hpacs-lite/worklist-state.js --file worklist-v0/hpacs-lite/worklist-data.js --file worklist-v0/hpacs-lite/worklist-view.js --file worklist-v0/hpacs-lite/sr-reader.js --file worklist-v0/hpacs-lite/current-study.js --file worklist-v0/hpacs-lite/study-info-panel.js --file worklist-v0/hpacs-lite/related-studies.js --file worklist-v0/hpacs-lite/study-thumbnails.js --file worklist-v0/hpacs-lite/order-list.js --file worklist-v0/hpacs-lite/study-image-requests.js --file worklist-v0/hpacs-lite/study-corrections.js --file worklist-v0/hpacs-lite/related-report.js --file worklist-v0/hpacs-lite/report-editor.js --file worklist-v0/hpacs-lite/report-draft-sync.js --file worklist-v0/hpacs-lite/report-structure-pane.js --file worklist-v0/hpacs-lite/report-citation-pane.js --file worklist-v0/hpacs-lite/report-draft-save.js --file worklist-v0/hpacs-lite/report-commit.js --file worklist-v0/hpacs-lite/report-hold.js --file worklist-v0/hpacs-lite/work-exit.js --file worklist-v0/hpacs-lite/worklist-polling.js --file worklist-v0/hpacs-lite/report-history.js --file worklist-v0/hpacs-lite/report-toolbar.js --file worklist-v0/hpacs-lite/viewer-placement.js --file worklist-v0/hpacs-lite/viewer-launch.js --file worklist-v0/hpacs-lite/feature-mounts.js --file worklist-v0/hpacs-lite/clinical-context-panel.js --file worklist-v0/hpacs-lite/critical-result-mounts.js --file worklist-v0/hpacs-lite/study-questions.js --file worklist-v0/hpacs-lite/workspace-panels.js --file worklist-v0/hpacs-lite/worklist-controls.js --file worklist-v0/hpacs-lite/saved-filters.js --file worklist-v0/hpacs-lite/worklist-row-events.js --file worklist-v0/hpacs-lite/telerad-request.js --file worklist-v0/hpacs-lite/context-menu.js --file worklist-v0/hpacs-lite/related-controls.js --file worklist-v0/hpacs-lite/session-end.js --file worklist-v0/hpacs-lite/page-boot.js --file worklist-v0/hpacs-lite/worklist-folder-tree.js --file worklist-v0/hpacs-lite/worklist-folder-tree.css --file tests/page_source.py --file tests/page_source.cjs --file tests/main_split_harness.cjs --file tests/main_move_contract.cjs --file tests/dictation_refusal_oracle.py --file tests/live_admin_credential.py --file tests/live_test_gate.py -- "$RUNNER_TEMP/marks-python/bin/python" -B tests/execution_selection_test.py
      - name: Isolated declared manual 3D annotation and annotated output tests
        timeout-minutes: 28
        run: |
          "$RUNNER_TEMP/marks-python/bin/python" tests/measurement_ci.py --profile volume-marks
      - name: Sanitized synthetic manual 3D annotation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-volume-marks-results
          path: |
            tests/e2e/artifacts/volume-marks-ci/
            tmp/marks-ci/
          if-no-files-found: error
          retention-days: 7
