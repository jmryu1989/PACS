name: Nightly measurement regressions
permissions:
  contents: read
concurrency:
  group: measurements-nightly-${{ github.ref }}
  cancel-in-progress: false
'on':
  # D1797/D1808: public repository, so the hosted nightly costs nothing; 17:30 UTC = 02:30 KST.
  schedule:
  - cron: '30 17 * * *'
  workflow_dispatch: null
jobs:
  measurements:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: S7-U1a TypeScript compiler and Nest declarations for the route inventory
      if: ${{ !cancelled() }}
      timeout-minutes: 5
      run: |
        node --version
        npm ci --prefix api --ignore-scripts --no-audit --no-fund
    - name: Generate the Prisma client for source-level tests
      if: ${{ !cancelled() }}
      working-directory: api
      run: ./node_modules/.bin/prisma generate
    - name: Landed split Git blobs for historical byte proofs
      if: ${{ !cancelled() }}
      run: git fetch --no-tags --depth=1 origin c8e4f1b485ec05ccbb97589c74a573b3f48b70ce
