name: Worklist UX landings

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Public PR code runs without production credentials or a persisted Git token.
permissions:
  contents: read

concurrency:
  group: worklist-ux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worklist-ux-measurements:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # RELIST readers execute source behaviour; the locked compiler and generated client must precede them.
      - name: S7-U1a TypeScript compiler and Nest declarations for the route inventory
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          node --version
          npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Generate the Prisma client for source-level tests
        if: ${{ !cancelled() }}
        working-directory: api
        run: ./node_modules/.bin/prisma generate
      - name: Landed split Git blobs for historical byte proofs
        if: ${{ !cancelled() }}
        run: git fetch --no-tags --depth=1 origin c8e4f1b485ec05ccbb97589c74a573b3f48b70ce
      - name: W2 account shortcut CAS and unavailable-target retention
        if: ${{ !cancelled() }}
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/filter-shortcuts --cwd . --tree api/src --file api/prisma/schema.prisma --file api/prisma/migrations/20261011120000_filter_shortcuts/migration.sql --file api/package-lock.json --file tests/service_test_loader.cjs --file tests/filter_shortcuts_service_test.cjs -- node --test tests/filter_shortcuts_service_test.cjs
      - name: Keep pinned browser dependencies independent of unused Chrome APT repository
        if: ${{ !cancelled() }}
        run: |
          python3 tests/ci_browser_apt_test.py
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Cache pinned Python downloads
        if: ${{ !cancelled() }}
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/e2e/requirements.txt') }}
      - name: Install synthetic DICOM and pinned browser test dependencies
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          python3 -m venv "$RUNNER_TEMP/measurement-python"
          "$RUNNER_TEMP/measurement-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/measurement-python/bin/python" -m playwright install --with-deps chromium
      - name: S9-U0a-PRE fixed commits for the original page and the move baseline
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: git fetch --no-tags --depth=1 origin f1d540626aac03f46de23a9620d69f4c9da66037 0261b1c834c4d5ff5c610185b17a40763985097b 7bccdb614c6582b2a718c493cfb5cff6600629b9
      # A1: the spec's 45 runs flatten to the page's statements in order; dropped/duplicated/swapped statements, moved-byte,
      # order, classic-tag and missing-asset mutants are refused; every current moved asset is recorded below.
      - name: W2 served folder search, dates, counts and account shortcuts
        if: ${{ !cancelled() }}
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/worklist-folders --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/compound-filter.js --file worklist-v0/hpacs-lite/related-parts.js --file worklist-v0/hpacs-lite/worklist-body-parts.js --file worklist-v0/hpacs-lite/saved-filter-manager.js --file tests/worklist_body_parts_dom_test.py --file tests/module_session_harness.py --file worklist-v0/hpacs-lite/work-context.js --file worklist-v0/hpacs-lite/session-transport.js --file worklist-v0/hpacs-lite/main-split.bundle.js --file scripts/main-split-order.json --file scripts/build-main-split-bundle.py --file .gitattributes --file worklist-v0/hpacs-lite/page-core.js --file worklist-v0/hpacs-lite/study-state.js --file worklist-v0/hpacs-lite/order-list-store.js --file worklist-v0/hpacs-lite/report-templates.js --file worklist-v0/hpacs-lite/report-dictation.js --file worklist-v0/hpacs-lite/report-templates-ui.js --file worklist-v0/hpacs-lite/worklist-columns-view.js --file worklist-v0/hpacs-lite/worklist-state.js --file worklist-v0/hpacs-lite/worklist-data.js --file worklist-v0/hpacs-lite/worklist-view.js --file worklist-v0/hpacs-lite/sr-reader.js --file worklist-v0/hpacs-lite/current-study.js --file worklist-v0/hpacs-lite/study-info-panel.js --file worklist-v0/hpacs-lite/related-studies.js --file worklist-v0/hpacs-lite/study-thumbnails.js --file worklist-v0/hpacs-lite/order-list.js --file worklist-v0/hpacs-lite/study-image-requests.js --file worklist-v0/hpacs-lite/study-corrections.js --file worklist-v0/hpacs-lite/related-report.js --file worklist-v0/hpacs-lite/report-editor.js --file worklist-v0/hpacs-lite/report-draft-sync.js --file worklist-v0/hpacs-lite/report-structure-pane.js --file worklist-v0/hpacs-lite/report-citation-pane.js --file worklist-v0/hpacs-lite/report-draft-save.js --file worklist-v0/hpacs-lite/report-commit.js --file worklist-v0/hpacs-lite/report-hold.js --file worklist-v0/hpacs-lite/work-exit.js --file worklist-v0/hpacs-lite/worklist-polling.js --file worklist-v0/hpacs-lite/report-history.js --file worklist-v0/hpacs-lite/report-toolbar.js --file worklist-v0/hpacs-lite/viewer-placement.js --file worklist-v0/hpacs-lite/viewer-launch.js --file worklist-v0/hpacs-lite/feature-mounts.js --file worklist-v0/hpacs-lite/clinical-context-panel.js --file worklist-v0/hpacs-lite/critical-result-mounts.js --file worklist-v0/hpacs-lite/study-questions.js --file worklist-v0/hpacs-lite/workspace-panels.js --file worklist-v0/hpacs-lite/worklist-controls.js --file worklist-v0/hpacs-lite/saved-filters.js --file worklist-v0/hpacs-lite/worklist-row-events.js --file worklist-v0/hpacs-lite/telerad-request.js --file worklist-v0/hpacs-lite/context-menu.js --file worklist-v0/hpacs-lite/related-controls.js --file worklist-v0/hpacs-lite/session-end.js --file worklist-v0/hpacs-lite/page-boot.js --file worklist-v0/hpacs-lite/saved-filter-manager.css --file tests/page_source.py --file tests/page_source.cjs --file tests/main_move_spec.json --file worklist-v0/hpacs-lite/worklist-folder-tree.js --file worklist-v0/hpacs-lite/worklist-folder-tree.css --file tests/main_split_harness.cjs --file tests/main_move_contract.cjs --file tests/worklist_folders_dom_test.py --file tests/auth_logout_dom_test.py -- $RUNNER_TEMP/measurement-python/bin/python -B tests/worklist_folders_dom_test.py
      - name: Current source bundle event order and held-input behavior
        if: ${{ !cancelled() }}
        run: KIN_SPLIT_PARENT=7bccdb614c6582b2a718c493cfb5cff6600629b9 KIN_PRE_TRACE_DIR="$PWD/tmp/workspace-ui-ci/main-split-landing-raw" python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/main-split-landing --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/compound-filter.js --file worklist-v0/hpacs-lite/related-parts.js --file worklist-v0/hpacs-lite/worklist-body-parts.js --file worklist-v0/hpacs-lite/saved-filter-manager.js --file tests/worklist_body_parts_dom_test.py --file tests/module_session_harness.py --file worklist-v0/hpacs-lite/work-context.js --file worklist-v0/hpacs-lite/session-transport.js --file worklist-v0/hpacs-lite/main-split.bundle.js --file scripts/main-split-order.json --file scripts/build-main-split-bundle.py --file .gitattributes --file worklist-v0/hpacs-lite/page-core.js --file worklist-v0/hpacs-lite/study-state.js --file worklist-v0/hpacs-lite/order-list-store.js --file worklist-v0/hpacs-lite/report-templates.js --file worklist-v0/hpacs-lite/report-dictation.js --file worklist-v0/hpacs-lite/report-templates-ui.js --file worklist-v0/hpacs-lite/worklist-columns-view.js --file worklist-v0/hpacs-lite/worklist-state.js --file worklist-v0/hpacs-lite/worklist-data.js --file worklist-v0/hpacs-lite/worklist-view.js --file worklist-v0/hpacs-lite/sr-reader.js --file worklist-v0/hpacs-lite/current-study.js --file worklist-v0/hpacs-lite/study-info-panel.js --file worklist-v0/hpacs-lite/related-studies.js --file worklist-v0/hpacs-lite/study-thumbnails.js --file worklist-v0/hpacs-lite/order-list.js --file worklist-v0/hpacs-lite/study-image-requests.js --file worklist-v0/hpacs-lite/study-corrections.js --file worklist-v0/hpacs-lite/related-report.js --file worklist-v0/hpacs-lite/report-editor.js --file worklist-v0/hpacs-lite/report-draft-sync.js --file worklist-v0/hpacs-lite/report-structure-pane.js --file worklist-v0/hpacs-lite/report-citation-pane.js --file worklist-v0/hpacs-lite/report-draft-save.js --file worklist-v0/hpacs-lite/report-commit.js --file worklist-v0/hpacs-lite/report-hold.js --file worklist-v0/hpacs-lite/work-exit.js --file worklist-v0/hpacs-lite/worklist-polling.js --file worklist-v0/hpacs-lite/report-history.js --file worklist-v0/hpacs-lite/report-toolbar.js --file worklist-v0/hpacs-lite/viewer-placement.js --file worklist-v0/hpacs-lite/viewer-launch.js --file worklist-v0/hpacs-lite/feature-mounts.js --file worklist-v0/hpacs-lite/clinical-context-panel.js --file worklist-v0/hpacs-lite/critical-result-mounts.js --file worklist-v0/hpacs-lite/study-questions.js --file worklist-v0/hpacs-lite/workspace-panels.js --file worklist-v0/hpacs-lite/worklist-controls.js --file worklist-v0/hpacs-lite/saved-filters.js --file worklist-v0/hpacs-lite/worklist-row-events.js --file worklist-v0/hpacs-lite/telerad-request.js --file worklist-v0/hpacs-lite/context-menu.js --file worklist-v0/hpacs-lite/related-controls.js --file worklist-v0/hpacs-lite/session-end.js --file worklist-v0/hpacs-lite/page-boot.js --file worklist-v0/hpacs-lite/saved-filter-manager.css --file tests/page_source.py --file tests/page_source.cjs --file tests/main_move_spec.json --file worklist-v0/hpacs-lite/worklist-folder-tree.js --file worklist-v0/hpacs-lite/worklist-folder-tree.css --file tests/main_split_harness.cjs --file tests/main_move_contract.cjs --file tests/main_split_landing_dom_test.py --file tests/main_early_input_dom_test.py --file tests/main_split_harness.py --file tests/main_load_hosted.py --file tests/main_split_harness_fixture.json --file api/package-lock.json --file tests/auth_logout_dom_test.py --file tests/live_test_gate.py -- $RUNNER_TEMP/measurement-python/bin/python -B tests/main_split_landing_dom_test.py
      - name: Synthetic workspace DOM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-workspace-dom-results
          path: tmp/workspace-ui-ci/
          if-no-files-found: error
          retention-days: 7
  worklist-ux-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Worklist folder multi-selection and shortcut module contract
        run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/worklist-folder-tree --cwd . --file worklist-v0/hpacs-lite/worklist-folder-tree.js --file worklist-v0/hpacs-lite/worklist-folder-tree.css --file worklist-v0/hpacs-lite/compound-filter.js --file tests/worklist_folder_tree_test.cjs --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/main-split.bundle.js --file worklist-v0/hpacs-lite/worklist-data.js --file worklist-v0/hpacs-lite/worklist-state.js --file worklist-v0/hpacs-lite/worklist-view.js --file worklist-v0/hpacs-lite/worklist-columns-view.js --file worklist-v0/hpacs-lite/worklist-controls.js --file worklist-v0/hpacs-lite/saved-filters.js --file worklist-v0/hpacs-lite/saved-filter-manager.js --file worklist-v0/hpacs-lite/page-boot.js --file worklist-v0/hpacs-lite/session-end.js -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/worklist_folder_tree_test.cjs
      - name: Synthetic runtime record-run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-runtime-record-runs
          path: tmp/runtime-ci/
          if-no-files-found: error
          retention-days: 7
