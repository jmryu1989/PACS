name: Worklist UX landings

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Public PR code runs without production credentials or a persisted Git token.
permissions:
  contents: read

concurrency:
  group: worklist-ux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worklist-ux-measurements:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # RELIST readers execute source behaviour; the locked compiler and generated client must precede them.
      - name: S7-U1a TypeScript compiler and Nest declarations for the route inventory
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          node --version
          npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Generate the Prisma client for source-level tests
        if: ${{ !cancelled() }}
        working-directory: api
        run: ./node_modules/.bin/prisma generate
      - name: Landed split Git blobs for historical byte proofs
        if: ${{ !cancelled() }}
        run: git fetch --no-tags --depth=1 origin c8e4f1b485ec05ccbb97589c74a573b3f48b70ce
      - name: W4 shortcut v2 server contract
        if: ${{ !cancelled() }}
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/w4-shortcut-v2-server --cwd . --tree api/src --file api/prisma/schema.prisma --file api/package-lock.json --tree worklist-v0/hpacs-lite --tree tests -- node --test tests/workspace_shortcuts_v2_service_test.cjs
      - name: W2 account shortcut CAS and unavailable-target retention
        if: ${{ !cancelled() }}
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/filter-shortcuts --cwd . --tree api/src --file api/prisma/schema.prisma --file api/prisma/migrations/20261011120000_filter_shortcuts/migration.sql --file api/package-lock.json --file tests/service_test_loader.cjs --file tests/filter_shortcuts_service_test.cjs -- node --test tests/filter_shortcuts_service_test.cjs
      # W9-API (D1500): the viewing-set resolve over the real StudyAccess service/interceptor and a real Nest HTTP app on
      # 127.0.0.1; the mutants step breaks one server rule per variant in its own copy of api/src.
      - name: W9 viewing-set resolve and access-event contract
        if: ${{ !cancelled() }}
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/w9-viewing-set-service --cwd . --tree api/src --file api/prisma/schema.prisma --file api/package-lock.json --file tests/service_test_loader.cjs --file tests/multi_study_view_service_test.cjs -- node --test tests/multi_study_view_service_test.cjs
      - name: W9 viewing-set server mutation counterexamples
        if: ${{ !cancelled() }}
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/w9-viewing-set-mutants --cwd . --tree api/src --file api/prisma/schema.prisma --file api/package-lock.json --file tests/service_test_loader.cjs --file tests/multi_study_view_service_test.cjs --file tests/multi_study_view_mutants.py -- python3 -B tests/multi_study_view_mutants.py --out tmp/workspace-ui-ci/w9-viewing-set-mutants/records
      - name: Keep pinned browser dependencies independent of unused Chrome APT repository
        if: ${{ !cancelled() }}
        run: |
          python3 tests/ci_browser_apt_test.py
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Cache pinned Python downloads
        if: ${{ !cancelled() }}
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/e2e/requirements.txt') }}
      - name: Install synthetic DICOM and pinned browser test dependencies
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          python3 -m venv "$RUNNER_TEMP/measurement-python"
          "$RUNNER_TEMP/measurement-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/measurement-python/bin/python" -m playwright install --with-deps chromium
      - name: S9-U0a-PRE fixed commits for the original page and the move baseline
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: git fetch --no-tags --depth=1 origin f1d540626aac03f46de23a9620d69f4c9da66037 0261b1c834c4d5ff5c610185b17a40763985097b 7bccdb614c6582b2a718c493cfb5cff6600629b9
      # A1: the spec's 45 runs flatten to the page's statements in order; dropped/duplicated/swapped statements, moved-byte,
      # order, classic-tag and missing-asset mutants are refused; every current moved asset is recorded below.
      - name: W2 served folder search, dates, counts and account shortcuts
        if: ${{ !cancelled() }}
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/worklist-folders --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/report-editor-frame.js --file worklist-v0/hpacs-lite/compound-filter.js --file worklist-v0/hpacs-lite/related-parts.js --file worklist-v0/hpacs-lite/worklist-body-parts.js --file worklist-v0/hpacs-lite/saved-filter-manager.js --file tests/worklist_body_parts_dom_test.py --file tests/module_session_harness.py --file worklist-v0/hpacs-lite/work-context.js --file worklist-v0/hpacs-lite/session-transport.js --file worklist-v0/hpacs-lite/main-split.bundle.js --file scripts/main-split-order.json --file scripts/build-main-split-bundle.py --file .gitattributes --file worklist-v0/hpacs-lite/page-core.js --file worklist-v0/hpacs-lite/study-state.js --file worklist-v0/hpacs-lite/order-list-store.js --file worklist-v0/hpacs-lite/report-templates.js --file worklist-v0/hpacs-lite/report-dictation.js --file worklist-v0/hpacs-lite/report-templates-ui.js --file worklist-v0/hpacs-lite/worklist-columns-view.js --file worklist-v0/hpacs-lite/worklist-state.js --file worklist-v0/hpacs-lite/worklist-data.js --file worklist-v0/hpacs-lite/worklist-view.js --file worklist-v0/hpacs-lite/sr-reader.js --file worklist-v0/hpacs-lite/current-study.js --file worklist-v0/hpacs-lite/study-info-panel.js --file worklist-v0/hpacs-lite/related-studies.js --file worklist-v0/hpacs-lite/study-thumbnails.js --file worklist-v0/hpacs-lite/order-list.js --file worklist-v0/hpacs-lite/study-image-requests.js --file worklist-v0/hpacs-lite/study-corrections.js --file worklist-v0/hpacs-lite/related-report.js --file worklist-v0/hpacs-lite/report-editor.js --file worklist-v0/hpacs-lite/report-draft-sync.js --file worklist-v0/hpacs-lite/report-structure-pane.js --file worklist-v0/hpacs-lite/report-citation-pane.js --file worklist-v0/hpacs-lite/report-draft-save.js --file worklist-v0/hpacs-lite/report-commit.js --file worklist-v0/hpacs-lite/report-hold.js