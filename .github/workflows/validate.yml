    name: s7-u5-session-contracts (u5-session-api)
    needs: runtime
    if: ${{ fromJSON(needs.runtime.outputs.jobs)['s7-u5-session-contracts'] }}
  produce:
    name: restore-product / produce
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      receipt_sha256: ${{ steps.prepare.outputs.receipt_sha256 }}
      product_sha256: ${{ steps.prepare.outputs.product_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
    # Default ref (GITHUB_SHA): the transfer fixtures bind their receipts to GITHUB_SHA and refuse another HEAD.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Database transport helper regressions
      run: python3 -B tests/ops_database_transfer_test.py
    - name: Product schema refusals
      run: python3 -B tests/ops_product_transfer_test.py
    - name: Shared transport and Orthanc helper regressions
      run: |
        python3 -B tests/ops_combined_transfer_test.py
        python3 -B tests/ops_orthanc_transfer_test.py
    - name: Apply product migration and bind synthetic rows to frozen DICOM
      id: prepare
      run: python3 -B tests/ops_product_transfer_fixture.py produce "$RUNNER_TEMP/kin-product-transfer"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      id: upload
      with:
        name: synthetic-product-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/kin-product-transfer/postgres-image.tar
          ${{ runner.temp }}/kin-product-transfer/orthanc-image.tar
          ${{ runner.temp }}/kin-product-transfer/kin.dump
          ${{ runner.temp }}/kin-product-transfer/keycloak.dump
          ${{ runner.temp }}/kin-product-transfer/store.tar
          ${{ runner.temp }}/kin-product-transfer/receipt.json
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
        include-hidden-files: false
        overwrite: false
    needs: runtime
    if: ${{ fromJSON(needs.runtime.outputs.jobs)['restore-product'] }}
  consume:
    name: restore-product / consume
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ needs.produce.outputs.artifact_id }}
        path: ${{ runner.temp }}/kin-product-download
        merge-multiple: true
        digest-mismatch: error
    - name: Restore product schema and reject a real foreign synthetic dump
      env:
        RECEIPT_SHA256: ${{ needs.produce.outputs.receipt_sha256 }}
        PRODUCT_SHA256: ${{ needs.produce.outputs.product_sha256 }}
      run: python3 -B tests/ops_product_transfer_fixture.py consume "$RUNNER_TEMP/kin-product-download" --receipt-sha256 "$RECEIPT_SHA256" --product-sha256 "$PRODUCT_SHA256"
    - name: S7 an unreachable daemon is indeterminate, never absent
      if: always()
      run: python3 -B rehearsal/rehearsal_harness.py --scenario indeterminate-control --out "$RUNNER_TEMP/s7.json"
      working-directory: ${{ env.BUNDLE }}
    - name: S2 a baseline-created proxy is inert
      if: always()
      run: python3 -B rehearsal/rehearsal_harness.py --scenario guard-clean --out "$RUNNER_TEMP/s2.json"
      working-directory: ${{ env.BUNDLE }}
    - name: S1 the runner's real stop/run/up sequence against the target file
      if: always()
      run: python3 -B rehearsal/rehearsal_harness.py --scenario compose-network --out "$RUNNER_TEMP/s1.json"
      working-directory: ${{ env.BUNDLE }}
    - name: S8 the real stop/run/up against the observed production shape preserves the ingress
      if: always()
      run: python3 -B rehearsal/rehearsal_harness.py --scenario live-shape --out "$RUNNER_TEMP/s8.json"
      working-directory: ${{ env.BUNDLE }}
    - name: S6 the real run() path with apply_migration's argv shape fails with exactly exit 7
      if: always()
      run: python3 -B rehearsal/rehearsal_harness.py --scenario partial-failure --out "$RUNNER_TEMP/s6.json"
      working-directory: ${{ env.BUNDLE }}
    - name: S5 findings rollback against a throwaway synthetic database
      if: always()
      run: python3 -B rehearsal/rehearsal_harness.py --scenario findings-rollback --out "$RUNNER_TEMP/s5.json"
      working-directory: ${{ env.BUNDLE }}
    - name: S3 the guard function against a real daemon, both network variants
      if: always()
      run: python3 -B rehearsal/rehearsal_harness.py --scenario guard-function-against-daemon --out "$RUNNER_TEMP/s3.json"
      working-directory: ${{ env.BUNDLE }}
    - name: Collect retained recovery scenario receipts
      if: always()
      run: |
        mkdir -p "$RUNNER_TEMP/receipts" "$RUNNER_TEMP/receipts/state-records"
        cp "$RUNNER_TEMP"/s[1-8].json "$RUNNER_TEMP/receipts/" 2>/dev/null || true
        cp "$RUNNER_TEMP"/record-s*.json "$RUNNER_TEMP/receipts/state-records/" 2>/dev/null || true
        docker version --format '{{.Server.Version}}' > "$RUNNER_TEMP/receipts/docker-version.txt" || true
        docker compose version > "$RUNNER_TEMP/receipts/compose-version.txt" || true
        python3 --version > "$RUNNER_TEMP/receipts/python-version.txt" || true
        python3 - "$RUNNER_TEMP/receipts" <<'PY'
        import json, pathlib, sys
        # HB10: consume the retained recovery receipt names. Rollout STATE RECORDS live
        # beside them (state-records/) and must never be read as scenario receipts. A missing
        # file, unreadable JSON, an absent `passed` key or a non-boolean value all refuse by
        # name instead of raising.
        root = pathlib.Path(sys.argv[1])
        expected = ["s1", "s2", "s3", "s5", "s6", "s7", "s8"]
        missing, failed, malformed = [], [], []
        for stem in expected:
            path = root / (stem + ".json")
            if not path.is_file():
                missing.append(stem)
                continue
            try:
                body = json.loads(path.read_text(encoding="utf-8"))
            except Exception:
                malformed.append(stem)
                continue
            if not isinstance(body, dict) or "passed" not in body:
                malformed.append(stem)
            elif not isinstance(body["passed"], bool):
                malformed.append(stem)
            elif body["passed"] is not True:
                failed.append(stem)
        summary = {"expected": expected, "missing": missing, "failed": failed, "malformed": malformed,
                   "state_records_kept_separately": sorted(p.name for p in (root / "state-records").glob("*.json"))}
        print(json.dumps(summary))
        if missing or failed or malformed:
            raise SystemExit("rehearsal incomplete: " + json.dumps(summary))
        PY
    - name: EMR-B provision, installer migration, runtime and same-point backup restore
      if: always()
      run: |
        python3 -m venv "$RUNNER_TEMP/emr-b-python"
        "$RUNNER_TEMP/emr-b-python/bin/python" -m pip install PyYAML==6.0.2
        docker pull postgres:16-alpine
        docker pull orthancteam/orthanc:24.12.0
        python3 scripts/record-run.py --run-dir "$RUNNER_TEMP/receipts/emr-b-restore" --tree api/src/emr-runtime --tree api/src/emr-contract --tree api/prisma --file scripts/ops_backup.py --file scripts/ops_audit_integrity.py --file scripts/emr-compose.py --file api/Dockerfile --file api/start-production.sh --file tests/emr/b/live.py -- "$RUNNER_TEMP/emr-b-python/bin/python" -B scripts/run-tests.py --plan rehearsal-bundle/rehearsal/emr-b-restore-plan.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: stage2-rollout-rehearsal
        path: ${{ runner.temp }}/receipts
        retention-days: 7
    env:
      REHEARSAL_IMAGE: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
      REHEARSAL_POSTGRES: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
      BUNDLE: rehearsal-bundle
  s9-u0e-served:
    # S9-U0E (main #199): the generated config/ohif.js as Orthanc serves it on a normal worklist launch, in its
    # own job and runner. The exact-selection self-check runs once in runtime (ci-selfchecks).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
    - name: OHIF generated configuration matches ordered sources before the live run
      run: python3 scripts/build-ohif-config.py --check
    - name: Keep pinned browser dependencies independent of unused Chrome APT repository
      run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
    - name: Cache pinned Python downloads
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('tests/e2e/requirements.txt') }}
    - name: Install synthetic DICOM and pinned browser test dependencies
      timeout-minutes: 15
      run: |
        python3 -m venv "$RUNNER_TEMP/s9-u0e-python"
        "$RUNNER_TEMP/s9-u0e-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
        "$RUNNER_TEMP/s9-u0e-python/bin/python" -m playwright install --with-deps chromium
    - name: Isolated declared S9-U0E served configuration test
      timeout-minutes: 28
      run: |
        "$RUNNER_TEMP/s9-u0e-python/bin/python" tests/measurement_ci.py --profile s9-u0e-served
    - name: Sanitized synthetic S9-U0E served evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: synthetic-s9-u0e-served-results
        path: |
          tests/e2e/artifacts/s9-u0e-served-ci/
          tmp/s9-u0e/served/
          tmp/s9-u0e-served-ci/
        if-no-files-found: error
        retention-days: 7
    needs: runtime
    if: ${{ fromJSON(needs.runtime.outputs.jobs)['s9-u0e-served'] }}
  patient-identity-measurements:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
    - name: Keep pinned browser dependencies independent of unused Chrome APT repository
      run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
    - name: Cache pinned Python downloads
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('tests/e2e/requirements.txt') }}
    - name: Install synthetic DICOM and pinned browser test dependencies
      timeout-minutes: 15
      run: |
        python3 -m venv "$RUNNER_TEMP/precision-python"
        "$RUNNER_TEMP/precision-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
        "$RUNNER_TEMP/precision-python/bin/python" -m playwright install --with-deps chromium
    - name: 'Identity and manual accuracy: identity-fields'
      if: ${{ !cancelled() }}
      timeout-minutes: 28
      run: '"$RUNNER_TEMP/precision-python/bin/python" tests/measurement_ci.py --profile identity-fields'
    - name: 'Identity and manual accuracy: measurement-accuracy'
      if: ${{ !cancelled() }}
      timeout-minutes: 28
      run: '"$RUNNER_TEMP/precision-python/bin/python" tests/measurement_ci.py --profile measurement-accuracy'
    - name: Sanitized synthetic MPR batch evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: synthetic-patient-identity-measurements
        path: |
          tests/e2e/artifacts/identity-fields-ci/
          tests/e2e/artifacts/measurement-accuracy-ci/
        if-no-files-found: error
        retention-days: 7
    needs: runtime
    if: ${{ fromJSON(needs.runtime.outputs.jobs)['patient-identity-measurements'] }}
'on':
  push:
    branches:
    - main
    tags:
    - v*
  pull_request: null
  # D1797/D1808: hosted nightly of runtime + restore-product on main; 18:00 UTC = 03:00 KST.
  schedule:
  - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Optional commit for manual validation; defaults to dispatched ref
        required: false
        type: string
