name: A11-VOI-2 semantic mutation harness (never merge)

# Harness branch opus/a11-voi-persistence-mutants-20260915 only. This file replaces the product validate.yml HERE so that one
# manual dispatch runs only the registered mutants and never the product suite on an intentionally broken tree. Every variant
# job restores the exact candidate commit e8ac0b9 (its own validate.yml included) and proves that tree, installs exactly one
# registered patch and runs the ORIGINAL candidate step lines. A detected mutant leaves its job red at the mutant step; nothing
# here turns a failure green. Registry, patches and guards: mutation-harness/a11-voi-persistence/.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a11-voi-persistence-mutants-${{ github.ref }}
  cancel-in-progress: false

env:
  HARNESS: mutation-harness/a11-voi-persistence

jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Registry, patches, one run per variant, original step lines and harness-only diff
        run: python3 "$HARNESS/mutant.py" plan --scope

  pure-p2:
    # The original pure models step runs in volume-rendering (40-minute job, no step timeout).
    needs: registry
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        id: [MJ6-SWALLOW, MJ9-SWALLOW, MJ9-ADVANCE] # tier pure-p2
    env:
      VARIANT: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Stage the harness outside the product tree
        run: mkdir "$RUNNER_TEMP/mutant-harness" && cp -R "$HARNESS/." "$RUNNER_TEMP/mutant-harness/"
      - name: Guard - exact candidate tree
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" restore --tier pure-p2 --variant "$VARIANT"
      - name: Candidate baseline - volume display, batch, crosshair, marks, curved MPR, orientation, job capture and preference models
        run: python3 scripts/record-run.py --run-dir tmp/vr-ci/pure-volume-models-candidate --cwd . --file worklist-v0/hpacs-lite/volume-display.js --file tests/volume_display_test.cjs --file worklist-v0/hpacs-lite/volume-batch.js --file tests/volume_batch_test.cjs --file worklist-v0/hpacs-lite/volume-batch-scout.js --file tests/volume_batch_scout_test.cjs --file worklist-v0/hpacs-lite/volume-crosshair.js --file tests/volume_crosshair_test.cjs --file worklist-v0/hpacs-lite/volume-marks.js --file tests/volume_marks_test.cjs --file worklist-v0/hpacs-lite/volume-curved.js --file tests/volume_curved_test.cjs --file worklist-v0/hpacs-lite/volume-path.js --file tests/volume_path_test.cjs --file worklist-v0/hpacs-lite/volume-orientation.js --file tests/volume_orientation_test.cjs --file worklist-v0/hpacs-lite/volume-preferences.js --file tests/volume_preferences_test.cjs --file worklist-v0/hpacs-lite/viewer-tech-note.js --file tests/volume_average_shader_test.cjs --file worklist-v0/hpacs-lite/volume-mip.js --file tests/volume_mip_test.cjs --file worklist-v0/hpacs-lite/volume-voi.js --file tests/volume_voi_test.cjs --file worklist-v0/hpacs-lite/volume-mip-job.js --file tests/volume_mip_job_test.cjs --file worklist-v0/hpacs-lite/viewer-volume-job.js --file tests/viewer_volume_job_capture_test.cjs --file worklist-v0/hpacs-lite/viewer-jobs.js --file worklist-v0/hpacs-lite/viewer-volume-mip.js -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/volume_display_test.cjs tests/volume_batch_test.cjs tests/volume_batch_scout_test.cjs tests/volume_crosshair_test.cjs tests/volume_marks_test.cjs tests/volume_curved_test.cjs tests/volume_path_test.cjs tests/volume_orientation_test.cjs tests/volume_preferences_test.cjs tests/volume_average_shader_test.cjs tests/volume_mip_test.cjs tests/volume_voi_test.cjs tests/volume_mip_job_test.cjs tests/viewer_volume_job_capture_test.cjs
      - name: Install the one registered mutation
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" install --tier pure-p2 --variant "$VARIANT"
      - name: Mutant - volume display, batch, crosshair, marks, curved MPR, orientation, job capture and preference models
        run: python3 scripts/record-run.py --run-dir tmp/vr-ci/pure-volume-models --cwd . --file worklist-v0/hpacs-lite/volume-display.js --file tests/volume_display_test.cjs --file worklist-v0/hpacs-lite/volume-batch.js --file tests/volume_batch_test.cjs --file worklist-v0/hpacs-lite/volume-batch-scout.js --file tests/volume_batch_scout_test.cjs --file worklist-v0/hpacs-lite/volume-crosshair.js --file tests/volume_crosshair_test.cjs --file worklist-v0/hpacs-lite/volume-marks.js --file tests/volume_marks_test.cjs --file worklist-v0/hpacs-lite/volume-curved.js --file tests/volume_curved_test.cjs --file worklist-v0/hpacs-lite/volume-path.js --file tests/volume_path_test.cjs --file worklist-v0/hpacs-lite/volume-orientation.js --file tests/volume_orientation_test.cjs --file worklist-v0/hpacs-lite/volume-preferences.js --file tests/volume_preferences_test.cjs --file worklist-v0/hpacs-lite/viewer-tech-note.js --file tests/volume_average_shader_test.cjs --file worklist-v0/hpacs-lite/volume-mip.js --file tests/volume_mip_test.cjs --file worklist-v0/hpacs-lite/volume-voi.js --file tests/volume_voi_test.cjs --file worklist-v0/hpacs-lite/volume-mip-job.js --file tests/volume_mip_job_test.cjs --file worklist-v0/hpacs-lite/viewer-volume-job.js --file tests/viewer_volume_job_capture_test.cjs --file worklist-v0/hpacs-lite/viewer-jobs.js --file worklist-v0/hpacs-lite/viewer-volume-mip.js -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/volume_display_test.cjs tests/volume_batch_test.cjs tests/volume_batch_scout_test.cjs tests/volume_crosshair_test.cjs tests/volume_marks_test.cjs tests/volume_curved_test.cjs tests/volume_path_test.cjs tests/volume_orientation_test.cjs tests/volume_preferences_test.cjs tests/volume_average_shader_test.cjs tests/volume_mip_test.cjs tests/volume_voi_test.cjs tests/volume_mip_job_test.cjs tests/viewer_volume_job_capture_test.cjs
      - name: Guard - tracked tree after the run
        if: always()
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" verify --tier pure-p2 --variant "$VARIANT"
      - name: Mutant evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutant-${{ matrix.id }}
          path: |
            tmp/vr-ci/
            tmp/mutant-evidence/
          if-no-files-found: error
          retention-days: 7

  compiled-p1:
    # The original build and compiled P1 steps run in runtime (20-minute job, no step timeouts).
    needs: registry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        id: [MJ2-FOR, MJ2-INTERSECT, MJ3-SERVICE-SKIP] # tier compiled-p1
    env:
      VARIANT: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Stage the harness outside the product tree
        run: mkdir "$RUNNER_TEMP/mutant-harness" && cp -R "$HARNESS/." "$RUNNER_TEMP/mutant-harness/"
      - name: Guard - exact candidate tree
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" restore --tier compiled-p1 --variant "$VARIANT"
      - name: Candidate baseline - reproduce a private deployment checkout
        run: chmod -R go-rwx api
      - name: Candidate baseline - build the production target
        env:
          CODE_SHA: ${{ github.sha }}
        run: docker build --target production --build-arg "VCS_REF=$CODE_SHA" -t kin-api:ci api
      - name: Candidate baseline - compiled volume job command and volume mark boundary models
        run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/volume-api-models-candidate --cwd . --file tests/viewer_volume_job_test.cjs --file tests/viewer_volume_marks_test.cjs -- docker run --rm --network none --read-only -v "$PWD/tests:/tests:ro" --entrypoint node kin-api:ci --test /tests/viewer_volume_job_test.cjs /tests/viewer_volume_marks_test.cjs
      - name: Candidate image identity
        run: docker image inspect kin-api:ci --format '{{.Id}}' > "$RUNNER_TEMP/mutant-evidence/$VARIANT/image-candidate.txt"
      - name: Install the one registered mutation
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" install --tier compiled-p1 --variant "$VARIANT"
      - name: Mutant - reproduce a private deployment checkout
        run: chmod -R go-rwx api
      - name: Mutant - build the production target
        env:
          CODE_SHA: ${{ github.sha }}
        run: docker build --target production --build-arg "VCS_REF=$CODE_SHA" -t kin-api:ci api
      - name: Mutant image identity differs from the candidate image
        run: |
          docker image inspect kin-api:ci --format '{{.Id}}' > "$RUNNER_TEMP/mutant-evidence/$VARIANT/image-mutant.txt"
          ! cmp -s "$RUNNER_TEMP/mutant-evidence/$VARIANT/image-candidate.txt" "$RUNNER_TEMP/mutant-evidence/$VARIANT/image-mutant.txt"
      - name: Mutant - compiled volume job command and volume mark boundary models
        run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/volume-api-models --cwd . --file tests/viewer_volume_job_test.cjs --file tests/viewer_volume_marks_test.cjs -- docker run --rm --network none --read-only -v "$PWD/tests:/tests:ro" --entrypoint node kin-api:ci --test /tests/viewer_volume_job_test.cjs /tests/viewer_volume_marks_test.cjs
      - name: Guard - tracked tree after the run
        if: always()
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" verify --tier compiled-p1 --variant "$VARIANT"
      - name: Mutant evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutant-${{ matrix.id }}
          path: |
            tmp/runtime-ci/
            tmp/mutant-evidence/
          if-no-files-found: error
          retention-days: 7

  native-mip-job:
    # The original volume-mip-job job: 40-minute job, 10-minute dependency step, 28-minute live step; the restored candidate
    # tests/measurement_ci.py keeps the ci-mip-job cap. The mutation is installed before every original step.
    needs: registry
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        id: [MJ4-SILENT-OPEN, MJ4-VOI-NULL] # tier native-mip-job
    env:
      VARIANT: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Stage the harness outside the product tree
        run: mkdir "$RUNNER_TEMP/mutant-harness" && cp -R "$HARNESS/." "$RUNNER_TEMP/mutant-harness/"
      - name: Guard - exact candidate tree
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" restore --tier native-mip-job --variant "$VARIANT"
      - name: Install the one registered mutation
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" install --tier native-mip-job --variant "$VARIANT"
      - name: MIP Job profile isolation, bounded budget and artifact policy
        run: python3 scripts/record-run.py --run-dir tmp/mipjob-ci/measurement-ci --cwd . --file tests/measurement_ci.py --file tests/measurement_ci_test.py --file .github/workflows/validate.yml -- python3 -B tests/measurement_ci_test.py
      - name: Keep pinned browser dependencies independent of unused Chrome APT repository
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Install synthetic DICOM and pinned browser test dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/mipjob-python"
          "$RUNNER_TEMP/mipjob-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/mipjob-python/bin/python" -m playwright install --with-deps chromium
      - name: Confirm exact declared MIP Viewer Job selection
        run: python3 scripts/record-run.py --run-dir tmp/mipjob-ci/execution-selection --cwd . --file tests/measurement_ci.py --file tests/execution_selection_test.py --file tests/e2e/test_volume_mip.py --file tests/e2e/test_volume_mip_job.py --file tests/e2e/test_volume_projection.py --file worklist-v0/hpacs-lite/volume-mip.js --file worklist-v0/hpacs-lite/volume-voi.js --file worklist-v0/hpacs-lite/volume-mip-job.js --file worklist-v0/hpacs-lite/viewer-volume-mip.js --file worklist-v0/hpacs-lite/viewer-volume-orientation.js --file worklist-v0/hpacs-lite/viewer-volume-job.js --file worklist-v0/hpacs-lite/viewer-jobs.js -- "$RUNNER_TEMP/mipjob-python/bin/python" -B tests/execution_selection_test.py
      - name: Isolated declared MIP Viewer Job tests
        timeout-minutes: 28
        run: python3 scripts/record-run.py --run-dir tmp/mipjob-ci/live-profile --cwd . --file worklist-v0/hpacs-lite/viewer-volume-orientation.js --file worklist-v0/hpacs-lite/viewer-volume-mip.js --file tests/e2e/test_volume_mip_job.py --file tests/measurement_ci.py -- "$RUNNER_TEMP/mipjob-python/bin/python" tests/measurement_ci.py --profile volume-mip-job
      - name: Guard - tracked tree after the run
        if: always()
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" verify --tier native-mip-job --variant "$VARIANT"
      - name: Mutant evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutant-${{ matrix.id }}
          path: |
            tests/e2e/artifacts/volume-mip-job-ci/
            tmp/mipjob-ci/
            tmp/mutant-evidence/
          if-no-files-found: error
          retention-days: 7

  native-path:
    # The original volume-path job: 40-minute job, 10-minute dependency step, 28-minute live step; the restored candidate
    # tests/measurement_ci.py keeps the ci-path-native and ci-mpr-orientation caps. The path DOM step is omitted: it tests
    # volume-path.js and viewer-volume-path.js only and is not part of the profile selection.
    needs: registry
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        id: [OR1-RESTORE-ORDER] # tier native-path
    env:
      VARIANT: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Stage the harness outside the product tree
        run: mkdir "$RUNNER_TEMP/mutant-harness" && cp -R "$HARNESS/." "$RUNNER_TEMP/mutant-harness/"
      - name: Guard - exact candidate tree
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" restore --tier native-path --variant "$VARIANT"
      - name: Install the one registered mutation
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" install --tier native-path --variant "$VARIANT"
      - name: Path profile isolation, bounded budget and artifact policy
        run: python3 scripts/record-run.py --run-dir tmp/path-ci/measurement-ci --cwd . --file tests/measurement_ci.py --file tests/measurement_ci_test.py --file .github/workflows/validate.yml -- python3 -B tests/measurement_ci_test.py
      - name: Keep pinned browser dependencies independent of unused Chrome APT repository
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Install synthetic DICOM and pinned browser test dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/path-python"
          "$RUNNER_TEMP/path-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/path-python/bin/python" -m playwright install --with-deps chromium
      - name: Confirm exact declared path and orientation selection
        run: python3 scripts/record-run.py --run-dir tmp/path-ci/execution-selection --cwd . --file tests/measurement_ci.py --file tests/execution_selection_test.py --file tests/e2e/test_volume_path.py --file tests/e2e/test_volume_orientation.py -- "$RUNNER_TEMP/path-python/bin/python" -B tests/execution_selection_test.py
      - name: Isolated declared 3D path and orientation tests
        timeout-minutes: 28
        run: python3 scripts/record-run.py --run-dir tmp/path-ci/live-profile --cwd . --file worklist-v0/hpacs-lite/viewer-volume-job.js --file tests/e2e/test_volume_orientation.py --file tests/measurement_ci.py -- "$RUNNER_TEMP/path-python/bin/python" tests/measurement_ci.py --profile volume-path
      - name: Guard - tracked tree after the run
        if: always()
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" verify --tier native-path --variant "$VARIANT"
      - name: Mutant evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutant-${{ matrix.id }}
          path: |
            tests/e2e/artifacts/volume-path-ci/
            tmp/path-ci/
            tmp/mutant-evidence/
          if-no-files-found: error
          retention-days: 7
