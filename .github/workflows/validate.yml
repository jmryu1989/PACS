name: Validate production image

# NEVER MERGE. Isolated diagnosis stage1-marks-receipt-diagnosis-02 of release tag v0.6.55-part1-stage1-mip, Validate run
# 35064730170 attempt 1, which failed only volume-marks test_marks_19_receipt_after_layout_change_acknowledges_saved_source.
# On this branch validate.yml is one manually dispatched job. Its guard proves the checkout is the reviewed harness commit of
# this branch, a descendant of baseline main that differs from it in exactly three files, and restores the baseline
# validate.yml before any original step reads it. Every step after the guard is the baseline volume-marks job's own step,
# unchanged except the artifact name. The only test change is observation: tests/e2e/marks_receipt_observer.py and named
# marks in test 19, with its assertions, timeouts and request handling as on main.
on:
  workflow_dispatch:
    inputs:
      harness_sha:
        description: Reviewed full commit SHA of this diagnosis branch head
        required: true
      baseline_sha:
        description: Baseline main commit 1f8f1914fabd3b02c98283d3eaed8d7550af335c
        required: true

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  volume-marks-receipt-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: NEVER MERGE diagnosis guard and baseline workflow restore
        env:
          HARNESS_SHA: ${{ inputs.harness_sha }}
          BASELINE_SHA: ${{ inputs.baseline_sha }}
        run: |
          set -euo pipefail
          BASE=1f8f1914fabd3b02c98283d3eaed8d7550af335c
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/opus/stage1-marks-receipt-20260916
          test "$HARNESS_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$BASELINE_SHA" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git diff --name-only "$BASE" HEAD | LC_ALL=C sort | tr '\n' ' ')" = ".github/workflows/validate.yml tests/e2e/marks_receipt_observer.py tests/e2e/test_volume_marks.py "
          test "$(git rev-parse HEAD:tests/e2e/marks_receipt_observer.py)" = 2cbe41b75e37f90a658a5b421ce753cca2419591
          test "$(git rev-parse HEAD:tests/e2e/test_volume_marks.py)" = 62bd0bc6576388719177f834d1c552107ab20ef8
          test "$(sha256sum < tests/e2e/marks_receipt_observer.py | cut -d' ' -f1)" = c7d8ce30189041487186c6c3dc353c3573d79056c94895bab71d4cc94dd31da2
          test "$(sha256sum < tests/e2e/test_volume_marks.py | cut -d' ' -f1)" = 55c5047e2d0f3fe694895a772344273059d35f3ee4b141d5945851dd614c7913
          git checkout "$BASE" -- .github/workflows/validate.yml
          test "$(git hash-object .github/workflows/validate.yml)" = 9270f57a74f48f8abc31e1bb4e2675e42a249988
          test "$(git diff --name-only "$BASE" | LC_ALL=C sort | tr '\n' ' ')" = "tests/e2e/marks_receipt_observer.py tests/e2e/test_volume_marks.py "
          echo "diagnosis guard passed: harness $GITHUB_SHA on opus/stage1-marks-receipt-20260916, baseline $BASE restored as .github/workflows/validate.yml"
      - name: Marks profile isolation, bounded budget and artifact policy
        run: python3 scripts/record-run.py --run-dir tmp/marks-ci/measurement-ci --cwd . --file tests/measurement_ci.py --file tests/measurement_ci_test.py --file .github/workflows/validate.yml -- python3 -B tests/measurement_ci_test.py
      - name: Keep pinned browser dependencies independent of unused Chrome APT repository
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Install synthetic DICOM and pinned browser test dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/marks-python"
          "$RUNNER_TEMP/marks-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/marks-python/bin/python" -m playwright install --with-deps chromium
      - name: Armed 3D annotation pick is not previewed by progressive refinement on the real panel
        timeout-minutes: 5
        run: python3 scripts/record-run.py --run-dir tmp/marks-ci/progressive-dom --cwd . --file worklist-v0/hpacs-lite/volume-marks.js --file worklist-v0/hpacs-lite/viewer-volume-marks.js --file worklist-v0/hpacs-lite/viewer-volume-progressive.js --file worklist-v0/hpacs-lite/viewer-volume-orientation.js --file tests/viewer_volume_marks_progressive_dom_test.py -- "$RUNNER_TEMP/marks-python/bin/python" -B tests/viewer_volume_marks_progressive_dom_test.py
      - name: Confirm exact declared manual 3D annotation and annotated output selection
        run: python3 scripts/record-run.py --run-dir tmp/marks-ci/execution-selection --cwd . --file tests/measurement_ci.py --file tests/execution_selection_test.py --file tests/e2e/test_volume_marks.py --file tests/e2e/test_volume_mpr_print.py --file worklist-v0/hpacs-lite/viewer-volume-marks.js --file worklist-v0/hpacs-lite/volume-marks.js --file worklist-v0/hpacs-lite/viewer-volume-progressive.js --file worklist-v0/hpacs-lite/viewer-volume-batch.js --file worklist-v0/hpacs-lite/viewer-volume-job.js --file worklist-v0/hpacs-lite/viewer-volume-job-print.js --file worklist-v0/hpacs-lite/viewer-jobs.js --file worklist-v0/hpacs-lite/viewer-volume-orientation.js --file config/ohif.js --file api/src/viewer-volume-marks.ts -- "$RUNNER_TEMP/marks-python/bin/python" -B tests/execution_selection_test.py
      - name: Isolated declared manual 3D annotation and annotated output tests
        timeout-minutes: 28
        run: |
          "$RUNNER_TEMP/marks-python/bin/python" tests/measurement_ci.py --profile volume-marks
      - name: Sanitized synthetic manual 3D annotation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-volume-marks-receipt
          path: |
            tests/e2e/artifacts/volume-marks-ci/
            tmp/marks-ci/
          if-no-files-found: error
          retention-days: 7
