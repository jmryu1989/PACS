name: A11 VOI Slab mutation experiments

# One purpose: intentional negative experiments for A11-VOI-1. Each variant applies one committed mutation patch to the frozen
# candidate d6271d2 and runs its one authored VOI Slab case once, in the unchanged volume-mip-voi stack and budget. This is not
# a candidate gate and not a retry of any baseline run. Manual only; no credentials, no persisted Git token, no production.
# On this isolated experiment branch only, this file takes the registered Validate entry (validate.yml) so GitHub can dispatch
# it; the candidate's exact Validate bytes are pinned by blob in tests/voi_mutations/baseline/validate.yml and the harness
# restores that blob when it proves the checkout is the candidate plus harness paths.
on:
  workflow_dispatch:
    inputs:
      variants:
        description: Mutation set; each variant runs once
        required: true
        type: choice
        default: required-M1P-M2-M5P
        options:
          - required-M1P-M2-M5P
          - supplement-M3-M4

permissions:
  contents: read

# A second dispatch waits for the first; nothing is cancelled.
concurrency:
  group: voi-mutations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: mutation ${{ matrix.variant }}
    # The volume-mip-voi job's runner, job policy, pinned actions, dependency setup and live step limit, unchanged.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      # Independent experiments: one variant's result never cancels or hides another's.
      fail-fast: false
      max-parallel: 2
      matrix:
        variant: ${{ fromJSON(inputs.variants == 'required-M1P-M2-M5P' && '["M1P","M2","M5P"]' || inputs.variants == 'supplement-M3-M4' && '["M3","M4"]' || '[]') }}
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Refuse reruns, prove the frozen baseline and apply exactly one mutation patch
        run: python3 -B tests/voi_mutations/harness.py guard --variant "$VARIANT"
      - name: Keep pinned browser dependencies independent of unused Chrome APT repository
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Install synthetic DICOM and pinned browser test dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/mipvoi-python"
          "$RUNNER_TEMP/mipvoi-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/mipvoi-python/bin/python" -m playwright install --with-deps chromium
      - name: Freeze the exact single-case selection
        run: |
          "$RUNNER_TEMP/mipvoi-python/bin/python" -B tests/voi_mutations/harness.py select --variant "$VARIANT"
      - name: One native mutation attempt in the unchanged volume-mip-voi stack and budget
        timeout-minutes: 28
        run: |
          set +e
          "$RUNNER_TEMP/mipvoi-python/bin/python" tests/voi_mutations/harness.py native --variant "$VARIANT"
          code=$?
          printf '%s\n' "$code" > "tmp/voi-mutation-ci/$VARIANT/native-exit.txt"
          exit "$code"
      - name: Record facts and a conservative observation, never a verdict
        if: always()
        run: python3 -B tests/voi_mutations/harness.py classify --variant "$VARIANT"
      - name: Sanitized mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voi-mutation-${{ matrix.variant }}-attempt${{ github.run_attempt }}
          path: |
            tests/e2e/artifacts/volume-mip-voi-ci/
            tmp/voi-mutation-ci/
          if-no-files-found: error
          retention-days: 7
