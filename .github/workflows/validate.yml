name: A11-ORIENT-1 semantic mutation harness (NEVER MERGE)
on:
  workflow_dispatch:
    inputs:
      harness_sha:
        description: The pushed harness commit this dispatch must run
        required: true
        type: string
      candidate_sha:
        description: The product candidate the registry names
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: a11-orient-mutants-${{ github.ref }}
  cancel-in-progress: false
# This file replaces the ordinary Validate workflow on the harness branch only, so the branch carries no automatic trigger at
# all and a dispatch of validate.yml on this ref runs the harness instead of ordinary CI. The candidate's own validate.yml
# (blob 9270f57a74f48f8abc31e1bb4e2675e42a249988) is untouched and every trial restores it on disk. The other six workflow
# files are not edited: they trigger on push to main or tags and on pull_request, so pushing this branch triggers nothing and
# no pull request is ever opened from it. The candidate's own steps keep their environment: harness values are set on harness
# steps only.
jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Harness - verify every registered patch, both job copies and the harness-only diff
        env:
          EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 mutation-harness/a11-orient/mutant.py plan --scope --hosted

  native-mip-orient:
    # The one registered variant whose only completing oracle is the hosted NA1 version 15 restore. The candidate's own
    # volume-mip-orient job steps, selection, caps and budgets are unchanged; exactly one registered patch is installed after
    # the original selection checks. An expected failure stays red.
    needs: registry
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        id: [MO6] # tier native-mip-orient
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Harness - stage the harness outside the product checkout
        run: mkdir "$RUNNER_TEMP/mutant-harness" && cp -R mutation-harness/a11-orient/. "$RUNNER_TEMP/mutant-harness/"
      - name: Harness - guard the exact candidate tree and original workflow
        env:
          VARIANT: ${{ matrix.id }}
          EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" restore --tier native-mip-orient --variant "$VARIANT"
      - name: MIP orientation profile isolation, bounded budget and artifact policy
        run: python3 scripts/record-run.py --run-dir tmp/miporient-ci/measurement-ci --cwd . --file tests/measurement_ci.py --file tests/measurement_ci_test.py --file .github/workflows/validate.yml -- python3 -B tests/measurement_ci_test.py
      - name: Keep pinned browser dependencies independent of unused Chrome APT repository
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Install synthetic DICOM and pinned browser test dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/miporient-python"
          "$RUNNER_TEMP/miporient-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/miporient-python/bin/python" -m playwright install --with-deps chromium
      - name: Confirm exact declared MIP Viewer orientation selection
        run: python3 scripts/record-run.py --run-dir tmp/miporient-ci/execution-selection --cwd . --file tests/measurement_ci.py --file tests/execution_selection_test.py --file tests/e2e/test_volume_mip.py --file tests/e2e/test_volume_mip_job.py --file tests/e2e/test_volume_mip_batch.py --file tests/e2e/test_volume_mip_output.py --file tests/e2e/test_volume_mip_orient.py --file worklist-v0/hpacs-lite/volume-mip.js --file worklist-v0/hpacs-lite/volume-mip-job.js --file worklist-v0/hpacs-lite/volume-mip-batch.js --file worklist-v0/hpacs-lite/volume-mip-output.js --file worklist-v0/hpacs-lite/viewer-volume-mip.js --file worklist-v0/hpacs-lite/viewer-volume-mip-print.js --file worklist-v0/hpacs-lite/viewer-volume-job-print.js --file worklist-v0/hpacs-lite/viewer-job-print.js --file worklist-v0/hpacs-lite/viewer-volume-orientation.js --file worklist-v0/hpacs-lite/viewer-volume-job.js --file worklist-v0/hpacs-lite/viewer-jobs.js -- "$RUNNER_TEMP/miporient-python/bin/python" -B tests/execution_selection_test.py
      - name: Harness - install the one registered mutation after the original selection checks
        env:
          VARIANT: ${{ matrix.id }}
          EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" install --tier native-mip-orient --variant "$VARIANT"
      - name: Isolated declared MIP Viewer orientation tests
        timeout-minutes: 28
        run: |
          "$RUNNER_TEMP/miporient-python/bin/python" tests/measurement_ci.py --profile volume-mip-orient
      - name: Harness - guard the tracked tree after the trial and record the profile outcome
        if: always()
        env:
          VARIANT: ${{ matrix.id }}
          EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" verify --tier native-mip-orient --variant "$VARIANT"
      - name: Sanitized synthetic MIP Viewer orientation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutant-${{ matrix.id }}
          path: |
            tests/e2e/artifacts/volume-mip-orient-ci/
            tmp/miporient-ci/
            tmp/mutant-evidence/
          if-no-files-found: error
          retention-days: 7

  compiled-api:
    # The one registered variant whose only oracle is the compiled command test inside the built API image. Only the three
    # runtime lines that oracle needs are copied (chmod, docker build, the recorded compiled command); the rest of the runtime
    # job - the proxy build, the database image, the ops, production-image and host-adapter suites - is deliberately absent, so
    # this is not a whole normal CI run and no accepted test is re-run. CODE_SHA is pinned to the candidate because the tree
    # built here is the candidate's, not the harness commit's.
    needs: registry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        id: [MO3] # tier compiled-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Harness - stage the harness outside the product checkout
        run: mkdir "$RUNNER_TEMP/mutant-harness" && cp -R mutation-harness/a11-orient/. "$RUNNER_TEMP/mutant-harness/"
      - name: Harness - guard the exact candidate tree and original workflow
        env:
          VARIANT: ${{ matrix.id }}
          EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" restore --tier compiled-api --variant "$VARIANT"
      - name: Harness - install the one registered mutation before the image is built
        env:
          VARIANT: ${{ matrix.id }}
          EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" install --tier compiled-api --variant "$VARIANT"
      - name: Reproduce a private deployment checkout
        # Production creates files under umask 077. Runtime readability must come
        # from the image build rather than the checkout host's file permissions.
        run: chmod -R go-rwx api
      - name: Build the production target
        env:
          CODE_SHA: a0e0846e38738643649cb868cf246a6110ead795
        run: docker build --target production --build-arg "VCS_REF=$CODE_SHA" -t kin-api:ci api
      - name: Harness - record the mutant image identity
        run: |
          mkdir -p tmp/mutant-evidence
          docker image inspect kin-api:ci --format '{{.Id}}' > tmp/mutant-evidence/image-mutant.txt
      - name: Compiled volume job command and volume mark boundary models
        run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/volume-api-models --cwd . --file tests/viewer_volume_job_test.cjs --file tests/viewer_volume_marks_test.cjs -- docker run --rm --network none --read-only -v "$PWD/tests:/tests:ro" --entrypoint node kin-api:ci --test /tests/viewer_volume_job_test.cjs /tests/viewer_volume_marks_test.cjs
      - name: Harness - guard the tracked tree after the trial and record the compiled outcome
        if: always()
        env:
          VARIANT: ${{ matrix.id }}
          EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" verify --tier compiled-api --variant "$VARIANT"
      - name: Sanitized compiled mutant evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutant-${{ matrix.id }}
          path: |
            tmp/runtime-ci/
            tmp/mutant-evidence/
          if-no-files-found: error
          retention-days: 7
