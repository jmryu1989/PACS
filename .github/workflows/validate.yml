    - name: Verify the committed hash-pinned D744-2 rule table
      if: ${{ !cancelled() }}
      timeout-minutes: 5
      run: |
        python3 scripts/record-run.py --run-dir tmp/part1-mg-ci/rule-table --cwd . --file "$KIN_MG_RULE_CASES" --tree tests/part1/mg --file worklist-v0/hpacs-lite/mammography-model.js --file worklist-v0/hpacs-lite/viewer-mammography.js --file .github/workflows/validate.yml -- python3 -c "$(cat <<'PY'
        import hashlib, json, os
        from pathlib import Path
        spec = json.loads(Path("tests/part1/mg/cases.json").read_text(encoding="utf-8"))["suites"][0]["rule_table"]
        target = Path(os.environ["KIN_MG_RULE_CASES"])
        raw = target.read_bytes().replace(b"\r\n", b"\n")
