name: Validate production image
permissions:
  contents: read
concurrency:
  # The nightly restore run keeps its own group so it never replaces a pending main-push run.
  group: validate-${{ github.event_name == 'schedule' && 'nightly-' || '' }}${{ github.ref }}
  cancel-in-progress: false
jobs:
  emr-b:
    needs: runtime
    if: ${{ fromJSON(needs.runtime.outputs.jobs)['emr-b'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      KIN_EMR_PYTHON: python3
      KIN_TEST_API_IMAGE: kin-emrb-ci:${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
      - name: Existing compiler and Prisma client
        timeout-minutes: 8
        run: |
          node --version
          npm ci --prefix api --ignore-scripts --no-audit --no-fund
          (cd api && ./node_modules/.bin/prisma generate)
      - name: PG declaration and exact collection
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/declaration --tree emr/units --file scripts/emr-compose.py --tree tests/emr/b --tree api/prisma -- python3 -B scripts/emr-compose.py check
      - name: Retained law and public boundary contracts
        run: |
          python3 scripts/record-run.py --run-dir tmp/emr-b-ci/contract --tree api/src --file emr/units/b.json --file scripts/emr-compose.py --file tests/emr/b/contract_test.cjs -- node --test --test-concurrency=1 --test-reporter=tap tests/emr/b/contract_test.cjs
          python3 -B scripts/emr-compose.py check-run --kind node --cases-from contract --run-dir tmp/emr-b-ci/contract
      - name: Transaction options, connection reserve and background drain
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/lifecycle --tree api/src --tree tests/emr/b -- node --test --test-concurrency=1 tests/emr/b/transaction_options_test.cjs tests/emr/b/client_pool_test.cjs tests/emr/b/lock_test.cjs
      - name: Request facts capture, ingress and ownership
        timeout-minutes: 5
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/request-facts-pure --tree api/src --tree tests/emr/request -- node --test tests/emr/request/request_facts_test.cjs
      - name: Module A local-read projection, outcome and audit replay
        timeout-minutes: 5
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/module-a-pure --tree api/src --tree tests/emr/a -- node --test tests/emr/a/local_read_test.cjs
      - name: Production API image of this commit
        timeout-minutes: 15
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/image --tree api/src --tree api/prisma --file api/Dockerfile --file api/start-production.sh --file api/package-lock.json -- docker build --target production --build-arg "VCS_REF=${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}" -t "kin-emrb-ci:${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}" api
      - name: Pinned synthetic stack test dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/emr-b-python"
          "$RUNNER_TEMP/emr-b-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
      - name: Orthanc image for same-point native restore
        run: docker pull orthancteam/orthanc:24.12.0
      - name: Existing thirteen candidate selectors on the PG implementation
        timeout-minutes: 68
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/live --tree api/src --tree api/prisma --tree tests/emr/b --file scripts/ops_backup.py --file tests/measurement_ci.py -- "$RUNNER_TEMP/emr-b-python/bin/python" tests/measurement_ci.py --profile emr-b
      - name: Actual PG roles, clinical HTTP, consumers and recovery
        timeout-minutes: 30
        run: |
          for entry in 'PgLedgerRoleLive:roles' 'PgLedgerClinicalHttpLive:clinical-http' 'PgLedgerDraftRegressionLive:draft-regression' 'PgLedgerStartupLive:startup' 'PgLedgerImportCliLive:import-cli' 'PgLedgerFailureFilesLive:failure-files' 'PgLedgerRetentionAdapterLive:retention-adapter' 'PgLedgerRestoreSweepLive:restore-sweep' 'PgLedgerRequestWorkLive:request-work' 'PgLedgerAuthFailureLive:auth-failure' 'PgLedgerAuthEndLive:auth-end'; do
            cls="${entry%%:*}"
            unit="${entry#*:}"
            python3 scripts/record-run.py --run-dir "tmp/emr-b-ci/$unit" --tree api/src --tree tests/emr/b -- python3 scripts/run-tests.py --module tests/emr/b/pg_ledger_restore_test.py --class "$cls" --mode live --unit "ci-b2r-$unit" --timeout 300
          done
      - name: Existing auth compatibility on the real PG record port
        timeout-minutes: 65
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/auth-regression --tree api/src --file tests/auth_session_service_test.cjs --file tests/emr/b/pg_ledger_restore_test.py -- python3 scripts/run-tests.py --module tests/emr/b/pg_ledger_restore_test.py --class PgLedgerAuthRegressionLive --mode live --unit ci-b2r-auth-regression --timeout 3600
      - name: Request facts through registered HTTP and PostgreSQL
        timeout-minutes: 5
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/request-facts-live --tree api/src --tree tests/emr/request -- python3 scripts/run-tests.py --module tests/emr/request/request_facts_live.py --class RequestFactsLive --mode live --unit ci-request-facts --timeout 300
      - name: Module A local-read recording on the real PG record port
        timeout-minutes: 5
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/module-a-pg --tree api/src --tree tests/emr/a --file tests/emr/b/pg_ledger_restore_test.py -- python3 scripts/run-tests.py --module tests/emr/a/recording_boundary_test.py --class LocalReadRecordingBoundary --mode live --unit ci-module-a-pg --timeout 300
      - name: Module A W9 metadata through real HTTP and PG
        timeout-minutes: 5
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/module-a-w9 --tree api/src --tree tests/emr/a --file tests/emr/b/pg_ledger_restore_test.py -- python3 scripts/run-tests.py --module tests/emr/a/viewing_set_test.py --class ViewingSetHttpBoundary --mode live --unit ci-module-a-w9 --timeout 300
      - name: Original-download stages through HTTP into the real PG record port
        timeout-minutes: 5
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/download-producer --tree api/src --tree tests/emr/request --file tests/emr/b/pg_ledger_restore_test.py -- python3 scripts/run-tests.py --module tests/emr/request/download_producer_live.py --class DownloadProducerLive --mode live --unit ci-download-producer --timeout 300
      - name: EMR-B evidence (synthetic, sanitized)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emr-b-evidence
          path: |
            tests/e2e/artifacts/emr-b-ci/
            tmp/emr-b-ci/
            tmp/emr-b2-replace-20261023/
            tmp/module-a-01-2/
            tmp/download-producer-b2/
            tmp/request-auth/
          if-no-files-found: error
          retention-days: 7
  runtime:
    runs-on: ubuntu-24.04
    # 19m43s-19m52s on main and a 20-minute timeout already hit under queue load (#182).
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
    - name: Select affected modules
      id: paths
      run: python3 scripts/ci_select.py
    - name: Saved comparison print identity model
      run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/job-print-identity --cwd . --file worklist-v0/hpacs-lite/viewer-job-print.js --file worklist-v0/hpacs-lite/report-preview.js --file tests/viewer_job_print_identity_test.cjs --file tests/report_preview_label_test.cjs -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/viewer_job_print_identity_test.cjs tests/report_preview_label_test.cjs
    - name: TypeScript for the report harness fixture projection
      timeout-minutes: 5
      run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
    - name: CI registry and exact suite selection (once)
      if: ${{ fromJSON(steps.paths.outputs.jobs)['ci-selfchecks'] }}
      run: |
        python3 -m venv "$RUNNER_TEMP/ci-check-python"
        "$RUNNER_TEMP/ci-check-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2 requests==2.32.5
        "$RUNNER_TEMP/ci-check-python/bin/python" -B tests/measurement_ci_test.py
        "$RUNNER_TEMP/ci-check-python/bin/python" -B tests/execution_selection_test.py
        "$RUNNER_TEMP/ci-check-python/bin/python" -B tests/mgxa_acceptance_test.py
    - name: Report base-version origin, commit failure routing and refused-head model
      run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/report-rebase-model --cwd . --file worklist-v0/hpacs-lite/main.html --file tests/report_rebase_model_test.cjs --file tests/main_split_harness.cjs --file tests/main_split_harness_fixture.json --file tests/page_source.cjs --file tests/main_move_spec.json --file tests/main_move_contract.cjs --file api/package-lock.json --file worklist-v0/hpacs-lite/main-split.bundle.js --file scripts/main-split-order.json --file scripts/build-main-split-bundle.py --file .gitattributes --file worklist-v0/hpacs-lite/page-core.js --file worklist-v0/hpacs-lite/study-state.js --file worklist-v0/hpacs-lite/order-list-store.js --file worklist-v0/hpacs-lite/report-templates.js --file worklist-v0/hpacs-lite/report-dictation.js --file worklist-v0/hpacs-lite/report-templates-ui.js --file worklist-v0/hpacs-lite/worklist-columns-view.js --file worklist-v0/hpacs-lite/worklist-state.js --file worklist-v0/hpacs-lite/worklist-data.js --file worklist-v0/hpacs-lite/worklist-view.js --file worklist-v0/hpacs-lite/sr-reader.js --file worklist-v0/hpacs-lite/current-study.js --file worklist-v0/hpacs-lite/study-info-panel.js --file worklist-v0/hpacs-lite/related-studies.js --file worklist-v0/hpacs-lite/study-thumbnails.js --file worklist-v0/hpacs-lite/order-list.js --file worklist-v0/hpacs-lite/study-image-requests.js --file worklist-v0/hpacs-lite/study-corrections.js --file worklist-v0/hpacs-lite/related-report.js --file worklist-v0/hpacs-lite/report-editor.js --file worklist-v0/hpacs-lite/report-draft-sync.js --file worklist-v0/hpacs-lite/report-structure-pane.js --file worklist-v0/hpacs-lite/report-citation-pane.js --file worklist-v0/hpacs-lite/report-draft-save.js --file worklist-v0/hpacs-lite/report-commit.js --file worklist-v0/hpacs-lite/report-hold.js --file worklist-v0/hpacs-lite/work-exit.js --file worklist-v0/hpacs-lite/worklist-polling.js --file worklist-v0/hpacs-lite/report-history.js --file worklist-v0/hpacs-lite/report-toolbar.js --file worklist-v0/hpacs-lite/viewer-placement.js --file worklist-v0/hpacs-lite/viewer-launch.js --file worklist-v0/hpacs-lite/feature-mounts.js --file worklist-v0/hpacs-lite/clinical-context-panel.js --file worklist-v0/hpacs-lite/critical-result-mounts.js --file worklist-v0/hpacs-lite/study-questions.js --file worklist-v0/hpacs-lite/workspace-panels.js --file worklist-v0/hpacs-lite/worklist-controls.js --file worklist-v0/hpacs-lite/saved-filters.js --file worklist-v0/hpacs-lite/worklist-row-events.js --file worklist-v0/hpacs-lite/telerad-request.js --file worklist-v0/hpacs-lite/context-menu.js --file worklist-v0/hpacs-lite/related-controls.js --file worklist-v0/hpacs-lite/session-end.js --file worklist-v0/hpacs-lite/page-boot.js --file worklist-v0/hpacs-lite/worklist-folder-tree.js --file worklist-v0/hpacs-lite/worklist-folder-tree.css --file tests/page_source.py -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/report_rebase_model_test.cjs
    - name: S3-U2b client citation comparator, R5 template and per-study state against the shared vectors
      run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/report-citation-client --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/report-citation.js --file tests/report_citation_vectors.json --file tests/report_citation_client_test.cjs --file tests/worklist_arrivals_dom_test.py --file worklist-v0/hpacs-lite/main-split.bundle.js --file scripts/main-split-order.json --file scripts/build-main-split-bundle.py --file .gitattributes --file worklist-v0/hpacs-lite/page-core.js --file worklist-v0/hpacs-lite/study-state.js --file worklist-v0/hpacs-lite/order-list-store.js --file worklist-v0/hpacs-lite/report-templates.js --file worklist-v0/hpacs-lite/report-dictation.js --file worklist-v0/hpacs-lite/report-templates-ui.js --file worklist-v0/hpacs-lite/worklist-columns-view.js --file worklist-v0/hpacs-lite/worklist-state.js --file worklist-v0/hpacs-lite/worklist-data.js --file worklist-v0/hpacs-lite/worklist-view.js --file worklist-v0/hpacs-lite/sr-reader.js --file worklist-v0/hpacs-lite/current-study.js --file worklist-v0/hpacs-lite/study-info-panel.js --file worklist-v0/hpacs-lite/related-studies.js --file worklist-v0/hpacs-lite/study-thumbnails.js --file worklist-v0/hpacs-lite/order-list.js --file worklist-v0/hpacs-lite/study-image-requests.js --file worklist-v0/hpacs-lite/study-corrections.js --file worklist-v0/hpacs-lite/related-report.js --file worklist-v0/hpacs-lite/report-editor.js --file worklist-v0/hpacs-lite/report-draft-sync.js --file worklist-v0/hpacs-lite/report-structure-pane.js --file worklist-v0/hpacs-lite/report-citation-pane.js --file worklist-v0/hpacs-lite/report-draft-save.js --file worklist-v0/hpacs-lite/report-commit.js --file worklist-v0/hpacs-lite/report-hold.js --file worklist-v0/hpacs-lite/work-exit.js --file worklist-v0/hpacs-lite/worklist-polling.js --file worklist-v0/hpacs-lite/report-history.js --file worklist-v0/hpacs-lite/report-toolbar.js --file worklist-v0/hpacs-lite/viewer-placement.js --file worklist-v0/