name: Validate production image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Public PR code runs without production credentials or a persisted Git token.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measurements:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: D-MEASURE2 disposable runner refusal and artifact redaction
        run: python3 tests/measurement_ci_test.py
      - name: Keep pinned browser dependencies independent of unused Chrome APT repository
        run: |
          python3 tests/ci_browser_apt_test.py
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Install synthetic DICOM and pinned browser test dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/measurement-python"
          "$RUNNER_TEMP/measurement-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/measurement-python/bin/python" -m playwright install --with-deps chromium
      - name: D-MEASURE2 B1 real readback, held drafts, manual SR and source recovery
        timeout-minutes: 28
        run: |
          "$RUNNER_TEMP/measurement-python/bin/python" tests/measurement_ci.py
      - name: Sanitized synthetic measurement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-measurement-results
          path: tests/e2e/artifacts/measurement-ci/
          if-no-files-found: error
          retention-days: 7
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Backup safety regressions
        run: python3 tests/ops_backup_test.py
      - name: D-MEASURE2 session recovery and SR guard regressions (no containers)
        run: node --test tests/viewer_recovery_test.cjs
      - name: Automatic prior calendar and identity boundaries
        run: docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/worklist_prior_test.cjs
      - name: Compound search operators and malformed condition boundaries
        run: docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/compound_filter_test.cjs
      - name: Worklist column visibility and account storage model
        run: docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/worklist_columns_test.cjs
      - name: Account and browser workspace storage boundaries
        run: docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/workspace_layout_test.cjs tests/reading_panel_layout_test.cjs
      - name: Explicit recent viewer layout storage boundaries
        run: docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/viewer_layout_test.cjs
      - name: CT position synchronization geometry boundaries
        run: docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/ct_sync_test.cjs
      - name: Cine preparation frame and pixel budget boundaries
        run: docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/cine_budget_test.cjs
      - name: Selected classic CT preset command boundaries
        run: docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/ct_presets_test.cjs
      - name: SR source tree identity and bounded literal values
        run: docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/sr_tree_test.cjs
      - name: Pinned viewer precision and isolated stack method boundaries
        run: docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/viewer_precision_test.cjs
      - name: Deployment preflight refusal and shared lock
        run: python3 tests/ops_deploy_preflight_test.py
      - name: Deployment state machine and retained operations lock
        run: python3 -B tests/ops_deploy_runner_test.py
      - name: Protected deployment host files, UID boundary and synthetic HTTPS
        run: sudo python3 -B tests/ops_deploy_host_test.py
      - name: Offline export inventory and image integrity
        run: python3 tests/ops_export_inventory_test.py
      - name: Offline storage listing and read-only index reconciliation
        run: python3 -B tests/ops_storage_reconcile_test.py
      - name: Pinned SDK collector against synthetic TLS only
        run: |
          umask 077
          sdk_dir=$(mktemp -d "$RUNNER_TEMP/kin-sdk.XXXXXXXX")
          python3 -m venv "$sdk_dir"
          "$sdk_dir/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r scripts/requirements-storage-sdk.txt
          "$sdk_dir/bin/python" -B tests/ops_storage_collect_test.py
          KIN_REQUIRE_STORAGE_SDK=1 "$sdk_dir/bin/python" -B tests/ops_offsite_backup_test.py
      - name: Pinned age and local encrypted export preparation
        run: |
          umask 077
          age_dir=$(mktemp -d "$RUNNER_TEMP/kin-age.XXXXXXXX")
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 --max-time 60 \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o "$age_dir/age.tar.gz"
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $age_dir/age.tar.gz" | sha256sum --check --strict
          tar -xzf "$age_dir/age.tar.gz" -C "$age_dir" age/age age/age-keygen
          KIN_TEST_AGE="$age_dir/age/age" python3 -B tests/ops_export_crypto_test.py
      - name: Monitor failure and notification boundaries
        run: python3 tests/ops_monitor_test.py
      - name: SMTP outbox, TLS and duplicate suppression
        run: python3 tests/ops_email_monitor_test.py
      - name: Public proxy assets from private checkout
        run: |
          chmod -R go-rwx proxy
          docker build -t kin-proxy:ci proxy
          docker run --rm --network none --read-only --user nginx --entrypoint sh kin-proxy:ci -c 'test -r /usr/share/nginx/html/kin-brand/kin-favicon-32.png && test -r /usr/share/nginx/html/kin-brand/kin-emblem-j1.svg && test -r /etc/nginx/templates/default.conf.template'
      - name: Reproduce a private deployment checkout
        # Production creates files under umask 077. Runtime readability must come
        # from the image build rather than the checkout host's file permissions.
        run: chmod -R go-rwx api
      - name: Build the production target
        env:
          CODE_SHA: ${{ github.sha }}
        run: docker build --target production --build-arg "VCS_REF=$CODE_SHA" -t kin-api:ci api
      - name: Prepare disposable database image
        run: docker pull postgres:16-alpine
      - name: Compiled viewer input, Unicode and original-plane validation
        run: docker run --rm --network none --read-only -v "$PWD/tests:/tests:ro" --entrypoint node kin-api:ci --test /tests/viewer_input_test.cjs
      - name: D-MEASURE2 source failures, safe warnings and real read deadlines
        run: docker run --rm --network none --read-only -v "$PWD/tests:/tests:ro" --entrypoint node kin-api:ci --test /tests/viewer_source_test.cjs
      - name: Observe an isolated real restart loop
        run: python3 tests/ops_monitor_container_test.py
      - name: Production image migration, startup and refusal checks
        env:
          KIN_TEST_API_IMAGE: kin-api:ci
          KIN_EXPECTED_REVISION: ${{ github.sha }}
        run: python3 tests/production_image_test.py
      - name: Disposable host adapter API replacement and database preservation
        run: sudo env KIN_TEST_API_IMAGE=kin-api:ci python3 -B tests/ops_deploy_host_container_test.py
      - name: Record exact image identity
        env:
          CODE_SHA: ${{ github.sha }}
        run: |
          echo "Code SHA: $CODE_SHA" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect kin-api:ci --format 'Image ID: {{.Id}}' >> "$GITHUB_STEP_SUMMARY"
          echo 'CI checks runtime packaging and disposable-DB startup. The 69 live invariants, 14 browser tests and independent review remain separate release gates. No deployment is performed.' >> "$GITHUB_STEP_SUMMARY"
