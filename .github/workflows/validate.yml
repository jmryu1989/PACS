name: Validate production image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Public PR code runs without production credentials or a persisted Git token.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measurements:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: D-MEASURE2 disposable runner refusal and artifact redaction
        run: python3 tests/measurement_ci_test.py
      - name: Execution evidence raw and LF hash preservation
        run: python3 tests/record_run_test.py
      - name: Explicit test selection, process leases and bounded retries
        run: python3 tests/execution_guard_test.py
      - name: Keep pinned browser dependencies independent of unused Chrome APT repository
        run: |
          python3 tests/ci_browser_apt_test.py
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Install synthetic DICOM and pinned browser test dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/measurement-python"
          "$RUNNER_TEMP/measurement-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/measurement-python/bin/python" -m playwright install --with-deps chromium
      - name: Image field positions and modality profile DOM integration
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/identity-fields --cwd . --file worklist-v0/hpacs-lite/viewer-identity.js --file worklist-v0/hpacs-lite/reading-appearance.js --file tests/viewer_identity_fields_dom_test.py --file tests/viewer_identity_position_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_identity_fields_dom_test.py
      - name: Personal Hanging Protocol form and authenticated mount boundaries
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/hanging-protocols --cwd . --file config/ohif.js --file worklist-v0/hpacs-lite/hanging-protocol-model.js --file worklist-v0/hpacs-lite/viewer-hanging-protocol.js --file tests/viewer_hanging_protocol_dom_test.py --file tests/viewer_hanging_protocol_mount_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B -m unittest discover -s tests -p 'viewer_hanging_protocol*dom_test.py'
      - name: Individual image thumbnails identity and bounded page lifecycle
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/image-thumbnails --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/worklist-image-preview.js --file worklist-v0/hpacs-lite/worklist-image-thumbnails.js --file tests/worklist_image_thumbnails_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/worklist_image_thumbnails_dom_test.py
      - name: Narrow worklist row and image control hit targets
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/narrow-image-layout --cwd . --file worklist-v0/hpacs-lite/main.html --file tests/worklist_narrow_layout_dom_test.py --file tests/worklist_image_thumbnails_dom_test.py --file worklist-v0/hpacs-lite/worklist-selection.js -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/worklist_narrow_layout_dom_test.py
      - name: Existing study arrivals and preserved reading inputs
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/study-arrivals --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/study-arrivals.js --file tests/worklist_arrivals_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/worklist_arrivals_dom_test.py
      - name: Selected CT display controls and session loader boundaries
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/display-scope --cwd . --file config/ohif.js --file worklist-v0/hpacs-lite/viewer-display-scope.js --file tests/viewer_display_scope_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_display_scope_dom_test.py
      - name: Images Only fullscreen lifecycle and source preservation
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/images-only --cwd . --file config/ohif.js --file worklist-v0/hpacs-lite/viewer-images-only.js --file tests/viewer_images_only_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_images_only_dom_test.py
      - name: Images Only config loader mode and session boundaries
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/images-only-loader --cwd . --file config/ohif.js --file tests/viewer_images_only_loader_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_images_only_loader_dom_test.py
      - name: Image text visibility and source preservation
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/image-text --cwd . --file worklist-v0/hpacs-lite/viewer-images-only.js --file worklist-v0/hpacs-lite/viewer-image-text.js --file tests/viewer_image_text_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_image_text_dom_test.py
      - name: Image text config loader lifecycle
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/image-text-loader --cwd . --file config/ohif.js --file tests/viewer_image_text_loader_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_image_text_loader_dom_test.py
      - name: Source PDF owner identity and popup lifecycle boundaries
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/source-pdf --cwd . --file config/ohif.js --file worklist-v0/hpacs-lite/viewer-dicom-pdf.js --file tests/viewer_dicom_pdf_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_dicom_pdf_dom_test.py
      - name: Three-D cursor pick, marker origin and rollback ownership DOM integration
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/three-d-cursor-dom --cwd . --file worklist-v0/hpacs-lite/three-d-cursor-model.js --file worklist-v0/hpacs-lite/viewer-three-d-cursor.js --file tests/viewer_three_d_cursor_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_three_d_cursor_dom_test.py
      - name: Saved comparison print page identity and pagination
        timeout-minutes: 4
        run: |
          KIN_EVIDENCE_DIR="$PWD/tmp/workspace-ui-ci/job-print-pages/evidence" python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/job-print-pages --cwd . --file worklist-v0/hpacs-lite/viewer-job-print.js --file tests/viewer_job_print_pages_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_job_print_pages_test.py
      - name: Workspace window transition and identity DOM regressions
        timeout-minutes: 3
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/window-manager --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/viewer-windows.js --file tests/viewer_window_manager_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_window_manager_dom_test.py
      - name: Worklist DICOM body-part search and saved-search DOM integration
        timeout-minutes: 3
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/body-parts --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/compound-filter.js --file worklist-v0/hpacs-lite/related-parts.js --file worklist-v0/hpacs-lite/worklist-body-parts.js --file worklist-v0/hpacs-lite/saved-filter-manager.js --file tests/worklist_body_parts_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/worklist_body_parts_dom_test.py
      - name: Current and prior identity position and legacy display preferences
        timeout-minutes: 3
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/identity-position --cwd . --file worklist-v0/hpacs-lite/viewer-identity.js --file worklist-v0/hpacs-lite/reading-appearance.js --file worklist-v0/hpacs-lite/reading-appearance-account.js --file worklist-v0/hpacs-lite/volume-preferences.js --file tests/viewer_identity_position_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_identity_position_dom_test.py
      - name: D-MEASURE2 B1 real readback, held drafts, manual SR and source recovery
        timeout-minutes: 28
        run: |
          "$RUNNER_TEMP/measurement-python/bin/python" tests/execution_selection_test.py
          "$RUNNER_TEMP/measurement-python/bin/python" tests/measurement_ci.py --profile measurements
      - name: Sanitized synthetic measurement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-measurement-results
          path: tests/e2e/artifacts/measurement-ci/
          if-no-files-found: error
          retention-days: 7
      - name: Synthetic workspace DOM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-workspace-dom-results
          path: tmp/workspace-ui-ci/
          if-no-files-found: error
          retention-days: 7
  volume-rendering:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: CI profile safeguards and artifact policy
        run: python3 scripts/record-run.py --run-dir tmp/vr-ci/measurement-ci --cwd . --file tests/measurement_ci.py --file tests/measurement_ci_test.py -- python3 -B tests/measurement_ci_test.py
      - name: Volume rendering, sculpt, and personal preset boundaries
        run: python3 scripts/record-run.py --run-dir tmp/vr-ci/pure-vr --cwd . --file worklist-v0/hpacs-lite/volume-rendering.js --file tests/volume_rendering_test.cjs --file tests/volume_rendering_presets_test.cjs --file worklist-v0/hpacs-lite/volume-sculpt.js --file tests/volume_sculpt_test.cjs -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/volume_rendering_test.cjs tests/volume_rendering_presets_test.cjs tests/volume_sculpt_test.cjs
      - name: Volume display, batch, crosshair, marks, orientation and preference models
        run: python3 scripts/record-run.py --run-dir tmp/vr-ci/pure-volume-models --cwd . --file worklist-v0/hpacs-lite/volume-display.js --file tests/volume_display_test.cjs --file worklist-v0/hpacs-lite/volume-batch.js --file tests/volume_batch_test.cjs --file worklist-v0/hpacs-lite/volume-batch-scout.js --file tests/volume_batch_scout_test.cjs --file worklist-v0/hpacs-lite/volume-crosshair.js --file tests/volume_crosshair_test.cjs --file worklist-v0/hpacs-lite/volume-marks.js --file tests/volume_marks_test.cjs --file worklist-v0/hpacs-lite/volume-orientation.js --file tests/volume_orientation_test.cjs --file worklist-v0/hpacs-lite/volume-preferences.js --file tests/volume_preferences_test.cjs --file worklist-v0/hpacs-lite/viewer-tech-note.js --file tests/volume_average_shader_test.cjs -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/volume_display_test.cjs tests/volume_batch_test.cjs tests/volume_batch_scout_test.cjs tests/volume_crosshair_test.cjs tests/volume_marks_test.cjs tests/volume_orientation_test.cjs tests/volume_preferences_test.cjs tests/volume_average_shader_test.cjs
      - name: Keep pinned browser dependencies independent of unused Chrome APT repository
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Install synthetic DICOM and pinned browser test dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/vr-python"
          "$RUNNER_TEMP/vr-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/vr-python/bin/python" -m playwright install --with-deps chromium
      - name: VR source binding survives transient MPR layout readiness
        run: python3 scripts/record-run.py --run-dir tmp/vr-ci/binding-dom --cwd . --file worklist-v0/hpacs-lite/viewer-volume-orientation.js --file worklist-v0/hpacs-lite/viewer-volume-rendering.js --file tests/viewer_vr_binding_dom_test.py -- "$RUNNER_TEMP/vr-python/bin/python" -B tests/viewer_vr_binding_dom_test.py
      - name: Confirm exact declared VR-only selection
        run: python3 scripts/record-run.py --run-dir tmp/vr-ci/execution-selection --cwd . --file tests/measurement_ci.py --file tests/execution_selection_test.py -- "$RUNNER_TEMP/vr-python/bin/python" -B tests/execution_selection_test.py
      - name: Volume batch recipe rounding precision
        timeout-minutes: 3
        run: python3 scripts/record-run.py --run-dir tmp/vr-ci/recipe-precision --cwd . --file tests/volume_recipe_precision_test.py --file tests/e2e/test_volume_batch_save.py -- "$RUNNER_TEMP/vr-python/bin/python" -B tests/volume_recipe_precision_test.py
      - name: Isolated declared volume rendering tests
        timeout-minutes: 28
        run: |
          "$RUNNER_TEMP/vr-python/bin/python" tests/measurement_ci.py --profile volume-rendering
      - name: Sanitized synthetic volume rendering evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-volume-rendering-results
          path: |
            tests/e2e/artifacts/volume-rendering-ci/
            tmp/vr-ci/
          if-no-files-found: error
          retention-days: 7
  volume-mpr:
    # A separate job, not extra suites inside volume-rendering: the two MPR e2e
    # modules must not consume that job's budget. The same 40-minute job policy and
    # 28-minute live step as the existing e2e jobs; measurement_ci.py's own
    # 25-minute deadline and the profile's 600s per-suite cap bound the run.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: MPR profile isolation, bounded budget and artifact policy
        run: python3 scripts/record-run.py --run-dir tmp/mpr-ci/measurement-ci --cwd . --file tests/measurement_ci.py --file tests/measurement_ci_test.py --file .github/workflows/validate.yml -- python3 -B tests/measurement_ci_test.py
      - name: Keep pinned browser dependencies independent of unused Chrome APT repository
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Install synthetic DICOM and pinned browser test dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/mpr-python"
          "$RUNNER_TEMP/mpr-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/mpr-python/bin/python" -m playwright install --with-deps chromium
      - name: Confirm exact declared crosshair and display selection
        run: python3 scripts/record-run.py --run-dir tmp/mpr-ci/execution-selection --cwd . --file tests/measurement_ci.py --file tests/execution_selection_test.py --file tests/e2e/test_volume_crosshair.py --file tests/e2e/test_volume_display.py -- "$RUNNER_TEMP/mpr-python/bin/python" -B tests/execution_selection_test.py
      - name: Isolated declared MPR crosshair and display tests
        timeout-minutes: 28
        run: |
          "$RUNNER_TEMP/mpr-python/bin/python" tests/measurement_ci.py --profile volume-mpr
      - name: Sanitized synthetic MPR crosshair and display evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-volume-mpr-results
          path: |
            tests/e2e/artifacts/volume-mpr-ci/
            tmp/mpr-ci/
          if-no-files-found: error
          retention-days: 7
  hanging-protocols:
    # A separate job, not extra suites inside measurements: the four hanging-protocol
    # suites must not consume that job's budget, and each profile needs its own fresh
    # runner with an empty Docker daemon. The same 40-minute job policy and 28-minute
    # live step as the existing e2e jobs. The profile's own per-suite budgets
    # (420/240/120/300 plus four 35s margins = 1220s) fit measurement_ci.py's
    # 25-minute deadline, so the trailing hanging-protocol flows keep their slice
    # even if the shared invariants and worklist suites run to their caps.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Hanging protocol profile isolation, bounded budget and artifact policy
        run: python3 scripts/record-run.py --run-dir tmp/hp-ci/measurement-ci --cwd . --file tests/measurement_ci.py --file tests/measurement_ci_test.py --file .github/workflows/validate.yml -- python3 -B tests/measurement_ci_test.py
      - name: Keep pinned browser dependencies independent of unused Chrome APT repository
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Install synthetic DICOM and pinned browser test dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/hp-python"
          "$RUNNER_TEMP/hp-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/hp-python/bin/python" -m playwright install --with-deps chromium
      - name: Confirm exact declared invariants, worklist and hanging protocol selection
        run: python3 scripts/record-run.py --run-dir tmp/hp-ci/execution-selection --cwd . --file tests/measurement_ci.py --file tests/execution_selection_test.py --file tests/invariants_live.py --file tests/e2e/test_worklist.py --file tests/hanging_protocol_api_live.py --file tests/e2e/test_hanging_protocol.py -- "$RUNNER_TEMP/hp-python/bin/python" -B tests/execution_selection_test.py
      - name: Isolated declared invariants, worklist and hanging protocol tests
        timeout-minutes: 28
        run: |
          "$RUNNER_TEMP/hp-python/bin/python" tests/measurement_ci.py --profile hanging-protocols
      - name: Sanitized synthetic hanging protocol evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-hanging-protocols-results
          path: |
            tests/e2e/artifacts/hanging-protocols-ci/
            tests/e2e/artifacts/HP-*.png
            tmp/hp-ci/
          if-no-files-found: error
          retention-days: 7
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Saved comparison print identity model
        run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/job-print-identity --cwd . --file worklist-v0/hpacs-lite/viewer-job-print.js --file tests/viewer_job_print_identity_test.cjs -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/viewer_job_print_identity_test.cjs
      - name: Editor link model
        run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/editor-link --cwd . --file worklist-v0/hpacs-lite/viewer-editor-link.js --file tests/viewer_editor_link_test.cjs -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/viewer_editor_link_test.cjs
      - name: Three-D cursor geometry model
        run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/three-d-cursor-model --cwd . --file worklist-v0/hpacs-lite/three-d-cursor-model.js --file tests/three_d_cursor_model_test.cjs -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/three_d_cursor_model_test.cjs
      - name: Three-D cursor loader flag and pane candidate model
        run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/three-d-cursor-loader --cwd . --file config/ohif.js --file tests/three_d_cursor_wiring_test.cjs -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/three_d_cursor_wiring_test.cjs
      - name: Existing study instance and series arrival model
        run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/study-arrivals --cwd . --file worklist-v0/hpacs-lite/study-arrivals.js --file tests/study_arrivals_test.cjs -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/study_arrivals_test.cjs
      - name: CT display target selection and atomic rollback model
        run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/display-scope --cwd . --file worklist-v0/hpacs-lite/viewer-display-scope.js --file tests/viewer_display_scope_test.cjs -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/viewer_display_scope_test.cjs
      - name: Images Only fullscreen owner and source lifecycle model
        run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/images-only --cwd . --file worklist-v0/hpacs-lite/viewer-images-only.js --file tests/viewer_images_only_test.cjs -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/viewer_images_only_test.cjs
      - name: Image text visibility source lifecycle model
        run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/image-text --cwd . --file worklist-v0/hpacs-lite/viewer-image-text.js --file tests/viewer_image_text_test.cjs -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/viewer_image_text_test.cjs
      - name: Native PDF source key and mode lifecycle model
        run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/source-pdf-key --cwd . --file config/ohif.js --file tests/viewer_dicom_pdf_key_test.cjs -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --test tests/viewer_dicom_pdf_key_test.cjs
      - name: Personal Hanging Protocol shared schema and owner model
        run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/hanging-protocols --cwd . --file api/src/hanging-protocol.ts --file worklist-v0/hpacs-lite/hanging-protocol-model.js --file tests/hanging_protocol_contract_cases.json --file tests/hanging_protocol_model_test.cjs --file tests/hanging_protocol_validator_test.cjs -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src node:22-alpine node --experimental-strip-types --test tests/hanging_protocol_model_test.cjs tests/hanging_protocol_validator_test.cjs
      - name: Backup safety regressions
        run: python3 tests/ops_backup_test.py
      - name: D-MEASURE2 session recovery and SR guard regressions (no containers)
        run: node --test tests/viewer_recovery_test.cjs tests/viewer_note_connection_test.cjs
