name: A11-BATCH-1 semantic mutation harness (NEVER MERGE)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a11-batch-mutants-${{ github.ref }}
  cancel-in-progress: false
env:
  HARNESS: mutation-harness/a11-batch
jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify every registered patch and the harness-only diff
        run: python3 "$HARNESS/mutant.py" plan --scope

  compiled-p1:
    # The original build and compiled P1 steps run in runtime (20-minute job, no step timeouts).
    needs: registry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        id: [MB7] # tier compiled-p1
    env:
      VARIANT: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Stage the harness outside the product tree
        run: mkdir "$RUNNER_TEMP/mutant-harness" && cp -R "$HARNESS/." "$RUNNER_TEMP/mutant-harness/"
      - name: Guard - exact candidate tree
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" restore --tier compiled-p1 --variant "$VARIANT"
      - name: Candidate baseline - reproduce a private deployment checkout
        run: chmod -R go-rwx api
      - name: Candidate baseline - build the production target
        env:
          CODE_SHA: a1126a10a33835a53c38a91dcfa0a1b2f098c177
        run: docker build --target production --build-arg "VCS_REF=$CODE_SHA" -t kin-api:ci api
      - name: Candidate baseline - compiled volume job command and volume mark boundary models
        run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/volume-api-models-candidate --cwd . --file tests/viewer_volume_job_test.cjs --file tests/viewer_volume_marks_test.cjs -- docker run --rm --network none --read-only -v "$PWD/tests:/tests:ro" --entrypoint node kin-api:ci --test /tests/viewer_volume_job_test.cjs /tests/viewer_volume_marks_test.cjs
      - name: Candidate image identity
        run: docker image inspect kin-api:ci --format '{{.Id}}' > "$RUNNER_TEMP/mutant-evidence/$VARIANT/image-candidate.txt"
      - name: Install the one registered mutation
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" install --tier compiled-p1 --variant "$VARIANT"
      - name: Mutant - reproduce a private deployment checkout
        run: chmod -R go-rwx api
      - name: Mutant - build the production target
        env:
          CODE_SHA: a1126a10a33835a53c38a91dcfa0a1b2f098c177
        run: docker build --target production --build-arg "VCS_REF=$CODE_SHA" -t kin-api:ci api
      - name: Mutant image identity differs from the candidate image
        run: |
          docker image inspect kin-api:ci --format '{{.Id}}' > "$RUNNER_TEMP/mutant-evidence/$VARIANT/image-mutant.txt"
          ! cmp -s "$RUNNER_TEMP/mutant-evidence/$VARIANT/image-candidate.txt" "$RUNNER_TEMP/mutant-evidence/$VARIANT/image-mutant.txt"
      - name: Mutant - compiled volume job command and volume mark boundary models
        run: python3 scripts/record-run.py --run-dir tmp/runtime-ci/volume-api-models --cwd . --file tests/viewer_volume_job_test.cjs --file tests/viewer_volume_marks_test.cjs -- docker run --rm --network none --read-only -v "$PWD/tests:/tests:ro" --entrypoint node kin-api:ci --test /tests/viewer_volume_job_test.cjs /tests/viewer_volume_marks_test.cjs
      - name: Guard - tracked tree after the run
        if: always()
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" verify --tier compiled-p1 --variant "$VARIANT"
      - name: Mutant evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutant-${{ matrix.id }}
          path: |
            tmp/runtime-ci/
            tmp/mutant-evidence/
          if-no-files-found: error
          retention-days: 7

  native-mip-batch:
    needs: registry
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        id: [MB1, MB4, MB13] # tier native-mip-batch
    env:
      VARIANT: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Stage harness outside the product checkout
        run: mkdir "$RUNNER_TEMP/mutant-harness" && cp -R "$HARNESS/." "$RUNNER_TEMP/mutant-harness/"
      - name: Guard exact candidate tree and original workflow
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" restore --tier native-mip-batch --variant "$VARIANT"
      - name: MIP Batch profile isolation, bounded budget and artifact policy
        run: python3 scripts/record-run.py --run-dir tmp/mipbatch-ci/measurement-ci --cwd . --file tests/measurement_ci.py --file tests/measurement_ci_test.py --file .github/workflows/validate.yml -- python3 -B tests/measurement_ci_test.py
      - name: Keep pinned browser dependencies independent of unused Chrome APT repository
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Install synthetic DICOM and pinned browser test dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/mipbatch-python"
          "$RUNNER_TEMP/mipbatch-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/mipbatch-python/bin/python" -m playwright install --with-deps chromium
      - name: Confirm exact declared MIP Viewer Batch selection
        run: python3 scripts/record-run.py --run-dir tmp/mipbatch-ci/execution-selection --cwd . --file tests/measurement_ci.py --file tests/execution_selection_test.py --file tests/e2e/test_volume_mip.py --file tests/e2e/test_volume_mip_job.py --file tests/e2e/test_volume_mip_batch.py --file tests/e2e/test_volume_projection.py --file tests/e2e/test_volume_path.py --file worklist-v0/hpacs-lite/volume-mip.js --file worklist-v0/hpacs-lite/volume-voi.js --file worklist-v0/hpacs-lite/volume-mip-job.js --file worklist-v0/hpacs-lite/volume-mip-batch.js --file worklist-v0/hpacs-lite/viewer-volume-mip.js --file worklist-v0/hpacs-lite/viewer-volume-orientation.js --file worklist-v0/hpacs-lite/viewer-volume-job.js --file worklist-v0/hpacs-lite/viewer-jobs.js -- "$RUNNER_TEMP/mipbatch-python/bin/python" -B tests/execution_selection_test.py
      - name: Install one registered mutation after original selection checks
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" install --tier native-mip-batch --variant "$VARIANT"
      - name: Isolated declared MIP Viewer Batch tests
        timeout-minutes: 28
        run: |
          "$RUNNER_TEMP/mipbatch-python/bin/python" tests/measurement_ci.py --profile volume-mip-batch
      - name: Guard tracked tree after mutant trial
        if: always()
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" verify --tier native-mip-batch --variant "$VARIANT"
      - name: Sanitized synthetic MIP Viewer Batch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutant-${{ matrix.id }}
          path: |
            tests/e2e/artifacts/volume-mip-batch-ci/
            tmp/mipbatch-ci/
            tmp/mutant-evidence/
          if-no-files-found: error
          retention-days: 7
