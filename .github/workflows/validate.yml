        import collections, json, os, re
        from pathlib import Path
        unit = os.environ["PART1_UNIT"]
        declaration = json.loads(Path("tests/part1/" + unit + "/cases.json").read_text(encoding="utf-8"))
        body = declaration["suites"][0] if unit == "mg" else declaration["suites"]["model"]
        expected = [c["name"] for c in body["cases"]]
        if unit == "mg":
            table = json.loads(Path(os.environ["KIN_MG_RULE_CASES"]).read_text(encoding="utf-8"))
            expected += ["D744 rule table is the pinned one"] + [c["testId"] for c in table["cases"]]
            assert len(expected) == body["expected"]
        tap = Path("tmp/part1-" + unit + "-ci/model.tap").read_text(encoding="utf-8")
        results = re.findall(r"^(ok|not ok) [0-9]+ - (.*)$", tap, re.M)
        actual = [name for status, name in results]
        assert collections.Counter(actual) == collections.Counter(expected), {"declared": expected, "collected": actual}
        assert all(status == "ok" for status, _ in results), results
        assert re.search(r"^# (?:skip|skipped) 0$", tap, re.M), "no skipped cases allowed"
        assert re.search(r"^# todo 0$", tap, re.M), "no TODO cases allowed"
        print(json.dumps({"declared": len(expected), "collected": len(actual), "passed": len(actual), "names": actual}, indent=2))
