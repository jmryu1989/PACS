name: Validate production image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Public PR code runs without production credentials or a persisted Git token.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measurements:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: D-MEASURE2 disposable runner refusal and artifact redaction
        run: python3 tests/measurement_ci_test.py
      - name: Execution evidence raw and LF hash preservation
        run: python3 tests/record_run_test.py
      - name: Explicit test selection, process leases and bounded retries
        run: python3 tests/execution_guard_test.py
      - name: S3-U2a shared citation vectors against an independent rule
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/citation-vectors --cwd . --file tests/report_citation_vectors.json --file tests/report_citation_vectors_test.py -- python3 -B tests/report_citation_vectors_test.py
      - name: S3-U2a additive citation migration, canonical bounds and leak boundary
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/citation-migration --cwd . --file api/prisma/migrations/20260920120000_report_citations/migration.sql --file api/prisma/schema.prisma --file api/src/pacs.service.ts --file api/src/report-citation.ts --file tests/report_citation_migration_test.py -- python3 -B tests/report_citation_migration_test.py
      - name: S3-structured-report shared render vectors against an independent rule and the empty product catalog
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/structure-vectors --cwd . --file api/src/report-structure.ts --file worklist-v0/hpacs-lite/report-structure.js --file tests/report_structure_vectors.json --file tests/report_structure_vectors_test.py -- python3 -B tests/report_structure_vectors_test.py
      - name: S3-structured-report additive migration, NULL-writing rules and leak boundary
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/structure-migration --cwd . --file api/prisma/migrations/20260921120000_report_structure/migration.sql --file api/prisma/schema.prisma --file api/src/pacs.service.ts --file api/src/report-structure.ts --file tests/report_structure_migration_test.py -- python3 -B tests/report_structure_migration_test.py
      # S4-U1b: the shared observation vectors against an independent model, the server/page/main
      # source pins and the pre-S4 main.html anchor inventory; then the S4-U1a count vectors, which
      # no job selected before; then every Stage 3 mutant script's own anchor check (no browser).
      - name: S4-U1b observation vectors, receipt labels, source pins, S4-U1a counts and Stage 3 main.html anchors
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/study-observation --cwd . --file tests/study_observation_vectors.json --file tests/study_observation_test.py --file worklist-v0/hpacs-lite/study-arrivals.js --file worklist-v0/hpacs-lite/study-pages.js --file worklist-v0/hpacs-lite/main.html --file api/src/pacs.service.ts --file tests/worklist_arrivals_dom_test.py -- python3 -B tests/study_observation_test.py
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/study-arrivals-counts --cwd . --file api/src/pacs.service.ts --file worklist-v0/hpacs-lite/study-arrivals.js --file tests/study_arrivals_test.cjs --file tests/study_arrivals_counts_test.py -- python3 -B tests/study_arrivals_counts_test.py
          for script in report_cursor_insert_mutants report_structure_mutants report_preview_citation_mutants report_version_citation_mutants viewer_job_print_citation_mutants; do
            python3 scripts/record-run.py --run-dir "tmp/workspace-ui-ci/s4-anchors-$script" --cwd . --file worklist-v0/hpacs-lite/main.html --file "tests/$script.py" -- python3 -B "tests/$script.py" --anchors-only
          done
      # S4-U2: the order reconciliation vectors against an independent model, the named wrong rules each
      # vector exists to kill, and the server/client/migration source pins (stdlib, no browser).
      - name: S4-U2 order reconciliation vectors, wrong-rule adequacy and source pins
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/order-reconciliation-source --cwd . --file tests/order_reconciliation_vectors.json --file tests/order_reconciliation_source_test.py --file api/src/order-reconciliation.ts --file api/src/pacs.service.ts --file api/src/orthanc.service.ts --file api/prisma/schema.prisma --file api/prisma/migrations/20260924120000_order_accession/migration.sql --file worklist-v0/hpacs-lite/order-reconciliation.js --file worklist-v0/hpacs-lite/study-pages.js --file worklist-v0/hpacs-lite/main.html --file tests/worklist_arrivals_dom_test.py -- python3 -B tests/order_reconciliation_source_test.py
      # S4-U5: the study identity vector file (well-formedness only; the compiled TS rule is judged against it in the
      # runtime job), the server/client/live/workflow source pins and the forbidden-word table (stdlib, no browser).
      - name: S4-U5 study identity vectors well-formedness, source pins and forbidden wording
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/study-identity-source --cwd . --file tests/study_identity_vectors.json --file tests/study_identity_source_test.py --file api/src/study-identity.ts --file api/src/pacs.service.ts --file api/src/pacs.controller.ts --file api/src/order-reconciliation.ts --file worklist-v0/hpacs-lite/study-identity.js --file worklist-v0/hpacs-lite/order-reconciliation.js --file worklist-v0/hpacs-lite/main.html --file tests/invariants_live.py --file .github/workflows/validate.yml -- python3 -B tests/study_identity_source_test.py
      # S4-U3: the receipt vectors against an independent model and the named wrong rules each vector exists
      # to kill, the agent's GatewayError literals against its errorCode table and the server enum (read by
      # AST, the agent is not imported), and the route/migration/restore/count pins (stdlib, no database).
      - name: S4-U3 gateway receipt vectors, wrong-rule adequacy, agent error mapping and source pins
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/gateway-receipt-source --cwd . --file tests/gateway_receipt_vectors.json --file tests/gateway_receipt_source_test.py --file gateway/agent/agent.py --file gateway/agent/test_agent.py --file api/src/gateway-receipt.ts --file api/src/pacs.service.ts --file api/src/pacs.controller.ts --file api/prisma/schema.prisma --file api/prisma/migrations/20260924130000_gateway_receipt/migration.sql --file worklist-v0/hpacs-lite/main.html --file tests/invariants_live.py -- python3 -B tests/gateway_receipt_source_test.py
      # S4-U4: the Now Retry vectors against an independent model and the named wrong rules each vector exists
      # to kill, the agent retry path read by AST (single-writer pin, exact compare-and-set, fixed cadence), and
      # the route/SQL/migration/restore/count/client pins (stdlib, no database, no browser).
      - name: S4-U4 gateway retry vectors, wrong-rule adequacy, agent single-writer pins and source pins
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/gateway-retry-source --cwd . --file tests/gateway_retry_vectors.json --file tests/gateway_retry_source_test.py --file gateway/agent/agent.py --file gateway/agent/test_agent.py --file api/src/gateway-retry.ts --file api/src/pacs.service.ts --file api/src/pacs.controller.ts --file api/prisma/schema.prisma --file api/prisma/migrations/20260924140000_gateway_retry_request/migration.sql --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/study-arrivals.js --file tests/invariants_live.py --file tests/ops_product_transfer_fixture.py -- python3 -B tests/gateway_retry_source_test.py
      # S4-EG1 (D-7): the offline judge against one clean and one violating vector per assertion ID, and the harness,
      # gateway-e2e finally path and dispatch workflow pins read as source (stdlib; no Docker, stack or live profile here).
      - name: S4-EG1 gateway pipeline judge adequacy and harness pins
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/gateway-pipeline-contract --cwd . --file tests/gateway_pipeline_vectors.json --file tests/gateway_pipeline_judge.py --file tests/gateway_pipeline_contract_test.py --file tests/gateway_pipeline_live.py --file tests/measurement_ci.py --file .github/workflows/gateway-e2e.yml -- python3 -B tests/gateway_pipeline_contract_test.py
      # S5-U1a: the clinician-only token/route fixtures against an independent model of the guard, every controller
      # route classified (public, allowlisted or denied) and compared with invariants_live ROUTES, and the role-list
      # pins across guard, member console, Keycloak client and realm (stdlib). The S5-U1a live module runs only
      # through scripts/run-tests.py on a hosted synthetic stack and is not a step of this job.
      - name: S5-U1a clinician-only default denial fixtures, route classification and role-list source pins
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/clinician-policy --cwd . --file tests/clinician_policy_fixtures.json --file tests/clinician_policy_test.py --file api/src/clinician-policy.ts --file api/src/auth.guard.ts --file api/src/admin.service.ts --file api/src/keycloak.service.ts --file keycloak/kin-realm.json --file tests/invariants_live.py -- python3 -B tests/clinician_policy_test.py
      # S5-U1b: the clinician read projections against the read_contract field sets (deep key walk, no stack). This job
      # builds no kin-api:ci, so KIN_CLINICIAN_POLICY_MODULE points the test at the TS source instead of its default
      # /app/dist/clinician-policy; node:22 strips the types (>= 22.18) and the test serves '@nestjs/common' from the
      # fixture. The S5-U1b live module runs only through scripts/run-tests.py on a hosted synthetic stack.
      - name: S5-U1b clinician read serializer vectors against the TS source
        run: python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/clinician-read-serializer --cwd . --file tests/clinician_policy_fixtures.json --file tests/clinician_read_serializer_test.cjs --file api/src/clinician-policy.ts -- docker run --rm --network none --read-only -v "$PWD:/src:ro" -w /src -e KIN_CLINICIAN_POLICY_MODULE=api/src/clinician-policy.ts node:22-alpine node --test tests/clinician_read_serializer_test.cjs
      - name: Keep pinned browser dependencies independent of unused Chrome APT repository
        run: |
          python3 tests/ci_browser_apt_test.py
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Install synthetic DICOM and pinned browser test dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/measurement-python"
          "$RUNNER_TEMP/measurement-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/measurement-python/bin/python" -m playwright install --with-deps chromium
      - name: Image field positions and modality profile DOM integration
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/identity-fields --cwd . --file worklist-v0/hpacs-lite/viewer-identity.js --file worklist-v0/hpacs-lite/reading-appearance.js --file tests/viewer_identity_fields_dom_test.py --file tests/viewer_identity_position_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_identity_fields_dom_test.py
      - name: Personal Hanging Protocol form and authenticated mount boundaries
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/hanging-protocols --cwd . --file config/ohif.js --file worklist-v0/hpacs-lite/hanging-protocol-model.js --file worklist-v0/hpacs-lite/viewer-hanging-protocol.js --file tests/viewer_hanging_protocol_dom_test.py --file tests/viewer_hanging_protocol_mount_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B -m unittest discover -s tests -p 'viewer_hanging_protocol*dom_test.py'
      - name: Individual image thumbnails identity and bounded page lifecycle
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/image-thumbnails --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/worklist-image-preview.js --file worklist-v0/hpacs-lite/worklist-image-thumbnails.js --file tests/worklist_image_thumbnails_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/worklist_image_thumbnails_dom_test.py
      - name: Narrow worklist row and image control hit targets
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/narrow-image-layout --cwd . --file worklist-v0/hpacs-lite/main.html --file tests/worklist_narrow_layout_dom_test.py --file tests/worklist_image_thumbnails_dom_test.py --file worklist-v0/hpacs-lite/worklist-selection.js -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/worklist_narrow_layout_dom_test.py
      - name: S5-UI1 worklist header keeps Log out on screen and keyboard reachable
        timeout-minutes: 3
        run: |
          KIN_EVIDENCE_DIR="$PWD/tmp/workspace-ui-ci/worklist-header/shots" python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/worklist-header --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/reading-workspace.css --file tests/worklist_header_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/worklist_header_dom_test.py
      - name: Existing study arrivals and preserved reading inputs
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/study-arrivals --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/study-arrivals.js --file tests/worklist_arrivals_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/worklist_arrivals_dom_test.py
      - name: S4-U2 order reconciliation display through the real poll, failure keep and offline seed exclusion
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/order-reconciliation-dom --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/study-arrivals.js --file worklist-v0/hpacs-lite/order-reconciliation.js --file tests/worklist_arrivals_dom_test.py --file tests/order_reconciliation_vectors.json --file tests/order_reconciliation_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/order_reconciliation_dom_test.py
      - name: S4-U5 DICOM Identity panel through the real poll and the correction paths, with the b6a317c controls
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/study-identity-dom --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/study-arrivals.js --file worklist-v0/hpacs-lite/study-identity.js --file tests/worklist_arrivals_dom_test.py --file tests/study_identity_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/study_identity_dom_test.py
      - name: Stale addendum refusal, approved-report pane and non-destructive rebase
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/report-rebase --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/report-citation.js --file tests/report_rebase_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/report_rebase_dom_test.py
      - name: S3-U2b citation insertion ordering, late answers, modal busy and convergence
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/report-citation-dom --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/report-citation.js --file tests/report_citation_vectors.json --file tests/report_citation_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/report_citation_dom_test.py
      - name: S3-U6 cursor insertion position, retention, guards and identity DOM integration
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/report-cursor-insert-dom --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/report-citation.js --file tests/report_cursor_insert_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/report_cursor_insert_dom_test.py
      - name: S3-U6 cursor insertion browser mutants killed through the shipped-file overrides
        timeout-minutes: 5
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/report-cursor-insert-mutants --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/report-citation.js --file tests/report_cursor_insert_dom_test.py --file tests/report_cursor_insert_mutants.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/report_cursor_insert_mutants.py --out tmp/workspace-ui-ci/report-cursor-insert-mutants/mutants.json
      - name: S3-R14 recogniser-shaped text input parity, occupancy and structured refusals DOM
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/report-dictation-input-dom --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/report-structure.js --file worklist-v0/hpacs-lite/report-citation.js --file worklist-v0/hpacs-lite/dictation-session.js --file worklist-v0/hpacs-lite/dictation-capture.js --file worklist-v0/hpacs-lite/dictation.js --file tests/report_dictation_input_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/report_dictation_input_dom_test.py
      - name: S3-ASR-U4 Dictate control, review pane, stale refusals and explicit Insert DOM (synthetic media and transport)
        timeout-minutes: 4
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/report-dictation-host-dom --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/dictation.js --file worklist-v0/hpacs-lite/dictation-session.js --file worklist-v0/hpacs-lite/dictation-capture.js --file worklist-v0/hpacs-lite/report-citation.js --file worklist-v0/hpacs-lite/report-structure.js --file tests/report_dictation_host_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/report_dictation_host_dom_test.py
      - name: S3-structured-report entry lifecycle, replace, guards, stale plan and empty catalog DOM
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/report-structure-dom --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/report-structure.js --file worklist-v0/hpacs-lite/report-citation.js --file tests/report_structure_vectors.json --file tests/report_structure_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/report_structure_dom_test.py
      - name: S3-structured-report client mutants killed through the shipped-file overrides
        timeout-minutes: 5
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/report-structure-mutants --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/report-structure.js --file tests/report_structure_dom_test.py --file tests/report_structure_mutants.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/report_structure_mutants.py --out tmp/workspace-ui-ci/report-structure-mutants/mutants.json
      - name: S3-U4 printed citation section lifecycle, terminal states and print re-read
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/report-preview-citation-dom --cwd . --file worklist-v0/hpacs-lite/main.html --file worklist-v0/hpacs-lite/report-preview.js --file worklist-v0/hpacs-lite/report-citation.js --file tests/report_preview_citation_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/report_preview_citation_dom_test.py
      - name: S3-U4 printed citation browser mutants killed through the shipped-file override
        timeout-minutes: 5
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/report-preview-citation-mutants --cwd . --file worklist-v0/hpacs-lite/report-preview.js --file worklist-v0/hpacs-lite/report-citation.js --file worklist-v0/hpacs-lite/main.html --file tests/report_preview_citation_dom_test.py --file tests/report_preview_citation_mutants.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/report_preview_citation_mutants.py --out tmp/workspace-ui-ci/report-preview-citation-mutants/mutants.json
      - name: Selected CT display controls and session loader boundaries
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/display-scope --cwd . --file config/ohif.js --file worklist-v0/hpacs-lite/viewer-display-scope.js --file tests/viewer_display_scope_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_display_scope_dom_test.py
      - name: Cell merge double-click ownership, panel and loader boundaries
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/cell-merge --cwd . --file config/ohif.js --file worklist-v0/hpacs-lite/viewer-cell-merge.js --file tests/viewer_cell_merge_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_cell_merge_dom_test.py
      - name: Images Only fullscreen lifecycle and source preservation
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/images-only --cwd . --file config/ohif.js --file worklist-v0/hpacs-lite/viewer-images-only.js --file tests/viewer_images_only_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_images_only_dom_test.py
      - name: Images Only config loader mode and session boundaries
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/images-only-loader --cwd . --file config/ohif.js --file tests/viewer_images_only_loader_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_images_only_loader_dom_test.py
      - name: Image text visibility and source preservation
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/image-text --cwd . --file worklist-v0/hpacs-lite/viewer-images-only.js --file worklist-v0/hpacs-lite/viewer-image-text.js --file tests/viewer_image_text_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_image_text_dom_test.py
      - name: Image text config loader lifecycle
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/image-text-loader --cwd . --file config/ohif.js --file tests/viewer_image_text_loader_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_image_text_loader_dom_test.py
      - name: Source PDF owner identity and popup lifecycle boundaries
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/source-pdf --cwd . --file config/ohif.js --file worklist-v0/hpacs-lite/viewer-dicom-pdf.js --file tests/viewer_dicom_pdf_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_dicom_pdf_dom_test.py
      - name: Three-D cursor pick, marker origin and rollback ownership DOM integration
        timeout-minutes: 3
        run: |
          python3 scripts/record-run.py --run-dir tmp/workspace-ui-ci/three-d-cursor-dom --cwd . --file worklist-v0/hpacs-lite/three-d-cursor-model.js --file worklist-v0/hpacs-lite/viewer-three-d-cursor.js --file tests/viewer_three_d_cursor_dom_test.py -- "$RUNNER_TEMP/measurement-python/bin/python" -B tests/viewer_three_d_cursor_dom_test.py
      - name: Saved comparison print page identity and pagination
        timeout-minutes: 4
        run: |
