name: A11-OUTPUT-1 semantic mutation harness (NEVER MERGE)
on:
  workflow_dispatch:
    inputs:
      harness_sha:
        description: The pushed harness commit this dispatch must run
        required: true
        type: string
      candidate_sha:
        description: The product candidate the registry names
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: a11-output-mutants-${{ github.ref }}
  cancel-in-progress: false
# The candidate's own volume-mip-output steps keep their environment: harness values are set on harness steps only.
jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Harness - verify every registered patch, the native job copy and the harness-only diff
        env:
          EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 mutation-harness/a11-output/mutant.py plan --scope --hosted

  native-mip-output:
    # Each native variant runs the candidate's volume-mip-output job steps, selection, caps and budgets unchanged, with exactly
    # one registered source patch installed after the original selection checks. An expected failure stays red.
    needs: registry
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        id: [MO1, MO2, MO4, MO5, MO6, MO6b, MO7, MO9, MO10] # tier native-mip-output
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Harness - stage the harness outside the product checkout
        run: mkdir "$RUNNER_TEMP/mutant-harness" && cp -R mutation-harness/a11-output/. "$RUNNER_TEMP/mutant-harness/"
      - name: Harness - guard the exact candidate tree and original workflow
        env:
          VARIANT: ${{ matrix.id }}
          EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" restore --tier native-mip-output --variant "$VARIANT"
      - name: MIP output profile isolation, bounded budget and artifact policy
        run: python3 scripts/record-run.py --run-dir tmp/mipout-ci/measurement-ci --cwd . --file tests/measurement_ci.py --file tests/measurement_ci_test.py --file .github/workflows/validate.yml -- python3 -B tests/measurement_ci_test.py
      - name: Keep pinned browser dependencies independent of unused Chrome APT repository
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Install synthetic DICOM and pinned browser test dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/mipout-python"
          "$RUNNER_TEMP/mipout-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
          "$RUNNER_TEMP/mipout-python/bin/python" -m playwright install --with-deps chromium
      - name: Confirm exact declared MIP Viewer output selection
        run: python3 scripts/record-run.py --run-dir tmp/mipout-ci/execution-selection --cwd . --file tests/measurement_ci.py --file tests/execution_selection_test.py --file tests/e2e/test_volume_mip.py --file tests/e2e/test_volume_mip_job.py --file tests/e2e/test_volume_mip_batch.py --file tests/e2e/test_volume_mip_output.py --file tests/e2e/test_volume_projection.py --file tests/e2e/test_volume_path.py --file worklist-v0/hpacs-lite/volume-mip.js --file worklist-v0/hpacs-lite/volume-voi.js --file worklist-v0/hpacs-lite/volume-mip-job.js --file worklist-v0/hpacs-lite/volume-mip-batch.js --file worklist-v0/hpacs-lite/volume-mip-output.js --file worklist-v0/hpacs-lite/viewer-volume-mip.js --file worklist-v0/hpacs-lite/viewer-volume-mip-print.js --file worklist-v0/hpacs-lite/viewer-volume-job-print.js --file worklist-v0/hpacs-lite/viewer-job-print.js --file worklist-v0/hpacs-lite/viewer-tech-note.js --file worklist-v0/hpacs-lite/viewer-volume-orientation.js --file worklist-v0/hpacs-lite/viewer-volume-job.js --file worklist-v0/hpacs-lite/viewer-jobs.js -- "$RUNNER_TEMP/mipout-python/bin/python" -B tests/execution_selection_test.py
      - name: Harness - install the one registered mutation after the original selection checks
        env:
          VARIANT: ${{ matrix.id }}
          EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" install --tier native-mip-output --variant "$VARIANT"
      - name: Isolated declared MIP Viewer output tests
        timeout-minutes: 28
        run: |
          "$RUNNER_TEMP/mipout-python/bin/python" tests/measurement_ci.py --profile volume-mip-output
      - name: Harness - guard the tracked tree after the trial and record the profile outcome
        if: always()
        env:
          VARIANT: ${{ matrix.id }}
          EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 "$RUNNER_TEMP/mutant-harness/mutant.py" verify --tier native-mip-output --variant "$VARIANT"
      - name: Sanitized synthetic MIP Viewer output evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutant-${{ matrix.id }}
          path: |
            tests/e2e/artifacts/volume-mip-output-ci/
            tmp/mipout-ci/
            tmp/mutant-evidence/
          if-no-files-found: error
          retention-days: 7
