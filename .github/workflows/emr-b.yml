name: EMR-B access ledger

# EMR-B1 (emr/units/b.json; unit order section 10). On every pull request and main push, and by hand for a candidate
# commit, the same checkout runs: the declaration against files, migrations, catalog, compose, profile and candidate
# selection; the ledger contracts C01-C10 and C13-C23; the production API image of this commit; the emr-b live profile (L01-L08, L03b/L03c and L17-L19 in
# their own disposable PostgreSQL and API containers, beside the synthetic stack on an empty hosted daemon); then the
# thirty-nine declared mutants in a separate copy. Synthetic data and generated credentials only; no hospital or production
# system is reached. validate.yml keeps its own jobs and adds only the declaration and contract check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emr-b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emr-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # same-run A/B loads the pinned round-3 source blob
      - name: TypeScript and Prisma client for the contract file (no lifecycle scripts)
        timeout-minutes: 8
        run: |
          node --version
          npm ci --prefix api --ignore-scripts --no-audit --no-fund
          (cd api && ./node_modules/.bin/prisma generate)
      - name: EMR-B1 declaration against files, migrations, ledger catalog, compose, profile and candidate selection
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/declaration --cwd . --file emr/units/b.json --file scripts/emr-compose.py --file docker-compose.yml --file docker-compose.prod.yml --file tests/measurement_ci.py --file tests/candidate_ci.py --file tests/emr/b/live.py --file tests/production_image_test.py --file tests/ops_product_transfer_fixture.py --file api/prisma/migrations/20261008120000_emr_b/migration.sql --file api/prisma/migrations/20261010120000_emr_seal_attempts/migration.sql -- python3 -B scripts/emr-compose.py check
      - name: EMR-B1 access ledger contracts C01-C10 and C13-C23, exactly the declared cases each passed once
        run: |
          python3 scripts/record-run.py --run-dir tmp/emr-b-ci/contract --cwd . --tree api/src --file api/tsconfig.json --file api/package-lock.json --file emr/units/b.json --file scripts/emr-compose.py --file tests/emr/b/contract_test.cjs --file tests/emr/b/seal_checker.cjs -- env KIN_EMR_PYTHON=python3 node --test --test-reporter=tap tests/emr/b/contract_test.cjs
          python3 -B scripts/emr-compose.py check-run --kind node --cases-from contract --run-dir tmp/emr-b-ci/contract
      - name: D931 explicit transaction budgets from one constants module
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/transaction-options --cwd . --tree api/src/emr-runtime --file tests/emr/b/transaction_options_test.cjs -- node --test tests/emr/b/transaction_options_test.cjs
      - name: D941 dedicated pool, plan guard controls and one-sided statistics
        run: |
          python3 scripts/record-run.py --run-dir tmp/emr-b-ci/pool-plan --cwd . --tree api/src/emr-runtime --file api/src/prisma.service.ts --tree tests/emr/b -- node --test tests/emr/b/client_pool_test.cjs
          python3 scripts/record-run.py --run-dir tmp/emr-b-ci/statistics --cwd . --tree tests/emr/b -- python3 tests/emr/b/noninferiority_test.py
          python3 scripts/record-run.py --run-dir tmp/emr-b-ci/live-mutant-reporting --cwd . --tree tests/emr/b -- python3 tests/emr/b/live_mutants.py --self-test
      - name: D927 seal CI depth-4 profile (120 second process budget; full graph recorded separately)
        timeout-minutes: 4
        run: |
          python3 scripts/record-run.py --run-dir tmp/emr-b-ci/seal-checker --cwd . --tree api/src/emr-runtime --tree api/src/emr-contract --file api/package-lock.json --file tests/emr/b/seal_checker.cjs -- python3 -c "import subprocess,sys; sys.exit(subprocess.run(sys.argv[1:],timeout=120).returncode)" node tests/emr/b/seal_checker.cjs . api/node_modules/typescript tmp/emr-b-ci/seal-checker/checker.json ci
      - name: Mutant verdicts distinguish behavioural failures from harness errors
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/mutant-verdict --cwd . --tree tests/emr/b -- python3 -B tests/emr/b/mutants.py --self-test
      - name: Production API image of this commit
        timeout-minutes: 15
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/image --cwd . --tree api/src --tree api/prisma --file api/Dockerfile --file api/start-production.sh --file api/package.json --file api/package-lock.json -- docker build --target production --build-arg "VCS_REF=${{ github.sha }}" -t "kin-emrb-ci:${{ github.sha }}" api
      - name: D931 API-only fenced owner, job-first start, job exit and peer preservation
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/lock --cwd . --file api/src/emr-runtime/file-lock.ts --file api/src/emr-runtime/coordinator.ts --file api/src/emr-runtime/state-client.ts --file api/src/emr-runtime/state-client-worker.ts --file tests/emr/b/lock_test.cjs -- docker run --rm --network none --mount "type=bind,source=$PWD/tests/emr/b,target=/emr-b,readonly" "kin-emrb-ci:${{ github.sha }}" node /emr-b/lock_test.cjs
      - name: D878 developer smoke only (fixed-delay SQL model; live D941 is acceptance)
        timeout-minutes: 15
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/performance --cwd . --tree api/src --tree tests/emr/b -- python3 tests/emr/b/performance.py --out tmp/emr-b-ci/performance/data --image "kin-emrb-ci:${{ github.sha }}"
      - name: D878 one negative control per performance property
        timeout-minutes: 30
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/performance-mutants --cwd . --tree api/src --tree tests/emr/b -- python3 tests/emr/b/performance_mutants.py --out tmp/emr-b-ci/performance-mutants/data --control tmp/emr-b-ci/performance/data/summary.json --image "kin-emrb-ci:${{ github.sha }}"
      - name: Pinned synthetic stack test dependencies (no browser)
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/emr-b-python"
          "$RUNNER_TEMP/emr-b-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
      - name: Orthanc image for disposable same-point backup rehearsal
        run: docker pull orthancteam/orthanc:24.12.0
      - name: EMR-B1 live ledger cases L01-L08, L03b/L03c and L17-L19 on an empty hosted daemon
        timeout-minutes: 68
        env:
          KIN_TEST_API_IMAGE: kin-emrb-ci:${{ github.sha }}
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/live --cwd . --file tests/emr/b/live.py --file tests/emr/b/throughput.cjs --file tests/emr/b/contract_test.cjs --file tests/emr/b/seal_checker.cjs --file scripts/emr-compose.py --file tests/measurement_ci.py --file scripts/run-tests.py --file tests/live_test_gate.py --file docker-compose.yml --file api/prisma/migrations/20261008120000_emr_b/migration.sql --file api/prisma/migrations/20261010120000_emr_seal_attempts/migration.sql -- "$RUNNER_TEMP/emr-b-python/bin/python" tests/measurement_ci.py --profile emr-b
      - name: EMR-B1 mutants M01-M08, M11, M12, M14-M42 in a separate copy of this commit
        if: ${{ !cancelled() }}
        timeout-minutes: 80
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/mutants-run --cwd . --tree api/src --file api/prisma/migrations/20261008120000_emr_b/migration.sql --file api/prisma/migrations/20261010120000_emr_seal_attempts/migration.sql --file emr/units/b.json --file scripts/emr-compose.py --file scripts/run-tests.py --file tests/live_test_gate.py --file tests/emr/b/mutants.py --file tests/emr/b/live.py --file tests/emr/b/throughput.cjs --file tests/emr/b/contract_test.cjs --file tests/emr/b/seal_checker.cjs -- python3 -B tests/emr/b/mutants.py --out tmp/emr-b-ci/mutants
      - name: EMR-B evidence (synthetic, sanitized)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emr-b-evidence
          path: |
            tests/e2e/artifacts/emr-b-ci/
            tmp/emr-b-ci/
          if-no-files-found: error
          retention-days: 7
