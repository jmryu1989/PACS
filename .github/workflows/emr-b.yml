name: EMR-B access ledger

# EMR-B1 (emr/units/b.json; unit order section 10). On every pull request and main push, and by hand for a candidate
# commit, the same checkout runs: the declaration against files, migrations, catalog, compose, profile and candidate
# selection; the ledger contracts C01-C10 and C13-C23; the production API image of this commit; the emr-b live profile (L01-L08, L03b/L03c and L17-L19 in
# their own disposable PostgreSQL and API containers, beside the synthetic stack on an empty hosted daemon); then the
# thirty-nine declared mutants in a separate copy. Synthetic data and generated credentials only; no hospital or production
# system is reached. validate.yml keeps its own jobs and adds only the declaration and contract check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emr-b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emr-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # same-run A/B loads the pinned round-3 source blob
      - name: TypeScript and Prisma client for the contract file (no lifecycle scripts)
        timeout-minutes: 8
        run: |
          node --version
          npm ci --prefix api --ignore-scripts --no-audit --no-fund
          (cd api && ./node_modules/.bin/prisma generate)
      - name: EMR-B1 declaration against files, migrations, ledger catalog, compose, profile and candidate selection
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/declaration --cwd . --file emr/units/b.json --file scripts/emr-compose.py --file docker-compose.yml --file docker-compose.prod.yml --file tests/measurement_ci.py --file tests/candidate_ci.py --file tests/emr/b/live.py --file tests/production_image_test.py --file tests/ops_product_transfer_fixture.py --file api/prisma/migrations/20261008120000_emr_b/migration.sql --file api/prisma/migrations/20261010120000_emr_seal_attempts/migration.sql --file api/prisma/migrations/20261010150000_emr_read_jit_off/migration.sql --file api/prisma/migrations/20261011120000_filter_shortcuts/migration.sql -- python3 -B scripts/emr-compose.py check
      - name: EMR-B1 access ledger contracts C01-C10 and C13-C23, exactly the declared cases each passed once
        run: |
          python3 scripts/record-run.py --run-dir tmp/emr-b-ci/contract --cwd . --tree api/src --file api/tsconfig.json --file api/package-lock.json --file emr/units/b.json --file scripts/emr-compose.py --file tests/emr/b/contract_test.cjs --file tests/emr/b/seal_checker.cjs -- env KIN_EMR_PYTHON=python3 node --test --test-reporter=tap tests/emr/b/contract_test.cjs
          python3 -B scripts/emr-compose.py check-run --kind node --cases-from contract --run-dir tmp/emr-b-ci/contract
      - name: D931 explicit transaction budgets from one constants module
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/transaction-options --cwd . --tree api/src/emr-runtime --file tests/emr/b/transaction_options_test.cjs -- node --test tests/emr/b/transaction_options_test.cjs
      - name: EMR-B2c closed wire and asynchronous client over Unix sockets (C-S04 client subset)
        timeout-minutes: 3
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/state-wire --cwd . --tree api/src/emr-runtime --file api/src/emr-contract/validation.ts --file api/package-lock.json --file emr/units/b.json --file tests/emr/b/state_protocol_test.cjs -- node --max-old-space-size=3072 --test --test-concurrency=1 tests/emr/b/state_protocol_test.cjs
      - name: EMR-B2c service capability, scopes and protected storage components
        timeout-minutes: 15
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/state-service --cwd . --tree api/src/emr-runtime --tree api/src/emr-contract --file api/package-lock.json --file emr/units/b.json --file tests/emr/b/state_service_test.cjs -- node --max-old-space-size=3072 --test --test-concurrency=1 tests/emr/b/state_service_test.cjs
      - name: KIN-EMR-STATE-V4 codec/index (V4-T01 roundtrip, V4-T02 index/collision/range, V4-T03 every-use integrity)
        timeout-minutes: 10
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/checkpoint-v4 --cwd . --file api/src/emr-runtime/checkpoint-v4.ts --file api/package-lock.json --file tests/emr/b/checkpoint_v4_test.cjs -- node --max-old-space-size=3072 --test --test-concurrency=1 tests/emr/b/checkpoint_v4_test.cjs
      - name: EMR-B2c service components over the v4 owner view (EMR_STATE_FORMAT=4; v3-layout cells reported skipped; V4-T06 witness restart, V4-T07 witness refusals)
        timeout-minutes: 15
        env:
          EMR_STATE_FORMAT: "4"
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/state-service-v4 --cwd . --tree api/src/emr-runtime --tree api/src/emr-contract --file api/package-lock.json --file emr/units/b.json --file tests/emr/b/state_service_test.cjs -- node --max-old-space-size=3072 --test --test-concurrency=1 tests/emr/b/state_service_test.cjs
      - name: EMR-B2c API-side components (record projection, remote scope lifetime, proofs, background work, raw HTTP admission, Nest lifecycle), exactly the declared cases each passed once
        timeout-minutes: 10
        run: |
          EMR_B2C_API_CASES="$(python3 -c "import json; print(','.join(json.load(open('emr/units/b.json'))['b2c']['local_api_cases']))")"
          export EMR_B2C_API_CASES
          python3 scripts/record-run.py --run-dir tmp/emr-b-ci/api-components --cwd . --tree api/src --file api/package-lock.json --file emr/units/b.json --file scripts/emr-compose.py --file tests/emr/b/contract_test.cjs -- node --max-old-space-size=3072 --test --test-concurrency=1 --test-reporter=tap --test-name-pattern "^C-A0" tests/emr/b/contract_test.cjs
          python3 -B scripts/emr-compose.py check-run --kind node --cases-from b2c-api --run-dir tmp/emr-b-ci/api-components
      - name: D1641 terminal identity component mutants and rename-alias-format oracle control
        timeout-minutes: 45
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/terminal-mutants-run --cwd . --tree api/src/emr-runtime --tree api/src/emr-contract --file api/package-lock.json --file emr/units/b.json --file tests/emr/b/state_service_test.cjs --file tests/emr/b/mutants.py -- python3 -B tests/emr/b/mutants.py --terminal --worktree --out tmp/emr-b-ci/terminal-mutants
      - name: D1650 attempt identity component mutants and oracle controls
        timeout-minutes: 15
        run: |
          python3 scripts/record-run.py --run-dir tmp/emr-b-ci/identity-mutants-run --cwd . --tree api/src/emr-runtime --tree api/src/emr-contract --file api/package-lock.json --file emr/units/b.json --file tests/emr/b/state_service_test.cjs --file tests/emr/b/mutants.py -- python3 -B tests/emr/b/mutants.py --identity --worktree --out tmp/emr-b-ci/identity-mutants
      - name: EMR-B2c API-side behavioural mutants (C-M04/M07/M08/M09/M10/M13/M14/M15/M16) and the record-port rename-alias-format oracle control, each killed by its named (c) API case
        timeout-minutes: 30
        run: |
          python3 scripts/record-run.py --run-dir tmp/emr-b-ci/api-mutants-run --cwd . --tree api/src --file api/package-lock.json --file emr/units/b.json --file tests/emr/b/contract_test.cjs --file tests/emr/b/startup_fixture.cjs --file tests/emr/b/mutants.py -- python3 -B tests/emr/b/mutants.py --api --worktree --out tmp/emr-b-ci/api-mutants
      - name: D961 pool, JIT guard and estimator controls (NI is commander-only)
        run: |
          python3 scripts/record-run.py --run-dir tmp/emr-b-ci/pool-plan --cwd . --tree api/src/emr-runtime --file api/src/prisma.service.ts --tree tests/emr/b -- node --test tests/emr/b/client_pool_test.cjs
          python3 scripts/record-run.py --run-dir tmp/emr-b-ci/statistics --cwd . --tree tests/emr/b -- python3 tests/emr/b/noninferiority_test.py
          python3 scripts/record-run.py --run-dir tmp/emr-b-ci/power --cwd . --tree tests/emr/b -- python3 tests/emr/b/noninferiority.py
          python3 scripts/record-run.py --run-dir tmp/emr-b-ci/quiet-host --cwd . --tree tests/emr/b -- python3 tests/emr/b/quiet_host_test.py
          python3 scripts/record-run.py --run-dir tmp/emr-b-ci/hosted-diagnostics --cwd . --file tests/emr/b/hosted_diagnostics.py --file tests/emr/b/hosted_diagnostics_test.py --file tests/emr/b/live_acceptance.py --file tests/emr/b/noninferiority.py --file tests/emr/b/quiet_host.py -- python3 tests/emr/b/hosted_diagnostics_test.py
          python3 scripts/record-run.py --run-dir tmp/emr-b-ci/live-mutant-reporting --cwd . --tree tests/emr/b -- python3 tests/emr/b/live_mutants.py --self-test
      - name: D927 seal CI depth-4 profile (120 second process budget; full graph recorded separately)
        timeout-minutes: 4
        run: |
          python3 scripts/record-run.py --run-dir tmp/emr-b-ci/seal-checker --cwd . --tree api/src/emr-runtime --tree api/src/emr-contract --file api/package-lock.json --file tests/emr/b/seal_checker.cjs -- python3 -c "import subprocess,sys; sys.exit(subprocess.run(sys.argv[1:],timeout=120).returncode)" node tests/emr/b/seal_checker.cjs . api/node_modules/typescript tmp/emr-b-ci/seal-checker/checker.json ci
      - name: Mutant verdicts distinguish behavioural failures from harness errors
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/mutant-verdict --cwd . --tree tests/emr/b -- python3 -B tests/emr/b/mutants.py --self-test
      - name: Production API image of this commit
        timeout-minutes: 15
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/image --cwd . --tree api/src --tree api/prisma --file api/Dockerfile --file api/start-production.sh --file api/package.json --file api/package-lock.json -- docker build --target production --build-arg "VCS_REF=${{ github.sha }}" -t "kin-emrb-ci:${{ github.sha }}" api
      - name: EMR-B2c L-10b image cell - real state-serve-v3 (UID 1000, state and IPC volumes, reader credential) over a disposable provisioned PG; UID 1001 clients with the read-only API IPC volume only; API-only restart keeps the service epoch, a service restart starts a new epoch over the same chain; misdeployed client refused
        timeout-minutes: 20
        env:
          KIN_TEST_API_IMAGE: kin-emrb-ci:${{ github.sha }}
          KIN_TEST_RESOURCE_PREFIX: kin-emrbc-ci-
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/probe-image --cwd . --tree api/src/emr-runtime --file api/Dockerfile --file api/start-production.sh --file scripts/ops_emr_probe.py --file tests/ops_emr_probe_test.py -- python3 -B tests/ops_emr_probe_test.py
      - name: EMR-B2c L-10c/d image cell - v3 private restore of a real service capture on labelled private resources under the launch-scoped copy mapping; IPC verifier, second owner refused, complete close, source bytes unchanged, foreign pair refused before any command
        timeout-minutes: 20
        env:
          KIN_TEST_API_IMAGE: kin-emrb-ci:${{ github.sha }}
          KIN_TEST_RESOURCE_PREFIX: kin-emrbc-ci-
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/restore-image --cwd . --tree api/src/emr-runtime --file api/Dockerfile --file api/start-production.sh --file scripts/ops_backup.py --file tests/ops_backup_restore_test.py -- python3 -B tests/ops_backup_restore_test.py
      - name: EMR-B2c C-P01..C-P11 image cell - the real API (UID 1001 client) and the real state service (UID 1000, the service fixture entry over launchStateService) over a disposable PG; independent restarts, second owner, recovery interruption, atomic business+two streams, P07/P08/P09/P10/P11/P12 cutpoints, receipt delivery, service storage faults
        timeout-minutes: 60
        env:
          KIN_TEST_API_IMAGE: kin-emrb-ci:${{ github.sha }}
          KIN_TEST_RESOURCE_PREFIX: kin-emrbc-ci-
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/pg-cutpoints --cwd . --tree api/src/emr-runtime --file api/Dockerfile --file api/start-production.sh --file tests/emr/b/startup_fixture.cjs --file tests/emr/b/startup_pg_test.cjs --file tests/production_image_test.py -- python3 -B -m unittest -v tests.production_image_test.StateServiceCutpointTests
      - name: A03 reconstructed legacy images (fixed sources a86ecf1 = IMG-B1 source, b9690cc = IMG-S5 source; labelled reconstructed, never the historic digest)
        timeout-minutes: 30
        run: |
          set -eu
          for sha in a86ecf1655c8c587012cef5fd16e233e121ae7dc b9690cc9790d5360829cee861462aac14f5ab0c7; do
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --depth=1 origin "$sha"
            rm -rf "tmp/emr-b-ci/legacy-src-$sha" && mkdir -p "tmp/emr-b-ci/legacy-src-$sha"
            git archive --format=tar "$sha" api | tar -x -C "tmp/emr-b-ci/legacy-src-$sha"
            docker build --target production --build-arg "VCS_REF=$sha" -t "kin-legacy-recon:${sha:0:12}" "tmp/emr-b-ci/legacy-src-$sha/api"
          done
      - name: A03 old-reader cells (D1656-T01/T02/T05) - the former owner image over a private clone of a v3 pair refuses before any mutation; legacy start script has no service entry; the former owner in the client shape gets no state
        timeout-minutes: 30
        env:
          KIN_TEST_API_IMAGE: kin-emrb-ci:${{ github.sha }}
          KIN_TEST_LEGACY_B1_IMAGE: kin-legacy-recon:a86ecf1655c8
          KIN_TEST_LEGACY_PRE_EMR_IMAGE: kin-legacy-recon:b9690cc9790d
          KIN_TEST_RESOURCE_PREFIX: kin-emrbc-ci-
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/legacy-cells --cwd . --tree api/src/emr-runtime --file api/Dockerfile --file api/start-production.sh --file tests/production_image_test.py -- python3 -B -m unittest -v tests.production_image_test.LegacyImageTests
      - name: D931 lifetime fence (EMR-B2c) - one owner per state directory, second owner refused, death releases to the successor, peer CAS, crash cutpoints, flock cost
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/lock --cwd . --file api/src/emr-runtime/file-lock.ts --file api/src/emr-runtime/coordinator.ts --file api/src/emr-runtime/state-client.ts --file api/src/emr-runtime/state-client-worker.ts --file tests/emr/b/lock_test.cjs -- docker run --rm --network none --mount "type=bind,source=$PWD/tests/emr/b,target=/emr-b,readonly" "kin-emrb-ci:${{ github.sha }}" node /emr-b/lock_test.cjs
      - name: D878 developer smoke only (fixed-delay SQL model; live D961 acceptance is commander-only)
        timeout-minutes: 15
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/performance --cwd . --tree api/src --tree tests/emr/b -- python3 tests/emr/b/performance.py --out tmp/emr-b-ci/performance/data --image "kin-emrb-ci:${{ github.sha }}"
      - name: D878 one negative control per performance property
        timeout-minutes: 30
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/performance-mutants --cwd . --tree api/src --tree tests/emr/b -- python3 tests/emr/b/performance_mutants.py --out tmp/emr-b-ci/performance-mutants/data --control tmp/emr-b-ci/performance/data/summary.json --image "kin-emrb-ci:${{ github.sha }}"
      - name: Pinned synthetic stack test dependencies (no browser)
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/emr-b-python"
          "$RUNNER_TEMP/emr-b-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4 pynetdicom==2.0.2
      - name: Orthanc image for disposable same-point backup rehearsal
        run: docker pull orthancteam/orthanc:24.12.0
      - name: EMR-B1 live ledger cases L01-L08, L03b/L03c and L17-L19 on an empty hosted daemon
        timeout-minutes: 68
        env:
          KIN_TEST_API_IMAGE: kin-emrb-ci:${{ github.sha }}
          KIN_EMR_BENCHMARK_MODE: ci-gross
          KIN_EMR_LIVE_EVIDENCE: tmp/emr-b-ci/live-statistics
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/live --cwd . --file tests/emr/b/live.py --file tests/emr/b/live_acceptance.py --file tests/emr/b/hosted_diagnostics.py --file tests/emr/b/noninferiority.py --file tests/emr/b/quiet_host.py --file tests/emr/b/live_benchmark.cjs --file tests/emr/b/verification_plan.cjs --file tests/emr/b/throughput.cjs --file tests/emr/b/contract_test.cjs --file tests/emr/b/seal_checker.cjs --file scripts/emr-compose.py --file tests/measurement_ci.py --file scripts/run-tests.py --file tests/live_test_gate.py --file docker-compose.yml --file api/prisma/migrations/20261008120000_emr_b/migration.sql --file api/prisma/migrations/20261010120000_emr_seal_attempts/migration.sql --file api/prisma/migrations/20261010150000_emr_read_jit_off/migration.sql --file api/prisma/migrations/20261011120000_filter_shortcuts/migration.sql -- "$RUNNER_TEMP/emr-b-python/bin/python" tests/measurement_ci.py --profile emr-b
      - name: D1006 statistics and D1038 record-only A/A qualification (A/B verdict unchanged; no hosted NI verdict)
        if: always()
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/statistics-record --cwd . --tree tests/emr/b -- python3 tests/emr/b/live_acceptance.py --summarize tmp/emr-b-ci/live-statistics
      - name: EMR-B1 mutants M01-M08, M11, M12, M14-M42 in a separate copy of this commit
        if: ${{ !cancelled() }}
        timeout-minutes: 80
        run: python3 scripts/record-run.py --run-dir tmp/emr-b-ci/mutants-run --cwd . --tree api/src --file api/prisma/migrations/20261008120000_emr_b/migration.sql --file api/prisma/migrations/20261010120000_emr_seal_attempts/migration.sql --file api/prisma/migrations/20261010150000_emr_read_jit_off/migration.sql --file emr/units/b.json --file scripts/emr-compose.py --file scripts/run-tests.py --file tests/live_test_gate.py --file tests/emr/b/mutants.py --file tests/emr/b/live.py --file tests/emr/b/live_acceptance.py --file tests/emr/b/hosted_diagnostics.py --file tests/emr/b/noninferiority.py --file tests/emr/b/quiet_host.py --file tests/emr/b/live_benchmark.cjs --file tests/emr/b/verification_plan.cjs --file tests/emr/b/throughput.cjs --file tests/emr/b/contract_test.cjs --file tests/emr/b/seal_checker.cjs --file api/prisma/migrations/20261011120000_filter_shortcuts/migration.sql -- python3 -B tests/emr/b/mutants.py --out tmp/emr-b-ci/mutants
      - name: EMR-B evidence (synthetic, sanitized)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emr-b-evidence
          path: |
            tests/e2e/artifacts/emr-b-ci/
            tmp/emr-b-ci/
          if-no-files-found: error
          retention-days: 7
