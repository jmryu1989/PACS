name: Part 1 XA module contracts

# R1 only. R2 adds the live job here; shared profiles and G3 stay unchanged.
# Sample bytes are never uploaded as artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: part1-xa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  part1-xa:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PART1_UNIT: xa
      TARGET_SHA: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Initialize runner-local paths
        shell: python
        run: |
          import os
          root = os.environ["RUNNER_TEMP"]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"PLAYWRIGHT_BROWSERS_PATH={root}/part1-xa-browsers\n")
              env.write(f"KIN_XA_SAMPLE_ROOT={root}/part1-xa-samples\n")
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Checked-out source is the event SHA
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          python3 scripts/record-run.py --run-dir tmp/part1-xa-ci/sha --cwd . --tree tests/part1/xa --file worklist-v0/hpacs-lite/xa-playback-model.js --file worklist-v0/hpacs-lite/viewer-xa-playback.js --file .github/workflows/part1-xa.yml -- python3 -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == os.environ['TARGET_SHA']"
      - name: Create the isolated Python environment
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          python3 scripts/record-run.py --run-dir tmp/part1-xa-ci/venv --cwd . --tree tests/part1/xa --file worklist-v0/hpacs-lite/xa-playback-model.js --file worklist-v0/hpacs-lite/viewer-xa-playback.js --file .github/workflows/part1-xa.yml --file tests/e2e/requirements.txt -- python3 -m venv "$RUNNER_TEMP/part1-xa-python"
      - name: Install the versions used by the unit tests
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          python3 scripts/record-run.py --run-dir tmp/part1-xa-ci/dependencies --cwd . --tree tests/part1/xa --file worklist-v0/hpacs-lite/xa-playback-model.js --file worklist-v0/hpacs-lite/viewer-xa-playback.js --file .github/workflows/part1-xa.yml --file tests/e2e/requirements.txt -- "$RUNNER_TEMP/part1-xa-python/bin/python" -m pip install -r tests/e2e/requirements.txt numpy==2.0.2 pydicom==2.4.4
      - name: Prepare the hosted browser package repositories
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          python3 scripts/record-run.py --run-dir tmp/part1-xa-ci/browser-apt --cwd . --tree tests/part1/xa --file worklist-v0/hpacs-lite/xa-playback-model.js --file worklist-v0/hpacs-lite/viewer-xa-playback.js --file .github/workflows/part1-xa.yml --file scripts/ci_browser_apt.py -- sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci_browser_apt.py
      - name: Install full Chromium with its Linux libraries
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          python3 scripts/record-run.py --run-dir tmp/part1-xa-ci/browser --cwd . --tree tests/part1/xa --file worklist-v0/hpacs-lite/xa-playback-model.js --file worklist-v0/hpacs-lite/viewer-xa-playback.js --file .github/workflows/part1-xa.yml -- "$RUNNER_TEMP/part1-xa-python/bin/python" -m playwright install --with-deps chromium
      - name: Sample download recovery contracts
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          python3 scripts/record-run.py --run-dir tmp/part1-xa-ci/sample-contracts --file tests/part1/archive_download.py --file tests/part1/archive_download_test.py --cwd . --tree tests/part1/xa --file .github/workflows/part1-xa.yml -- python3 -B tests/part1/xa/ci_test.py
      - name: Declare public sample cache hash list
        id: sample-plan
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          python3 scripts/record-run.py --run-dir tmp/part1-xa-ci/sample-plan --file tests/part1/archive_download.py --file tests/part1/archive_download_test.py --cwd . --tree tests/part1/xa --file .github/workflows/part1-xa.yml -- python3 -B tests/part1/xa/ci.py plan
      - name: Cache permitted public samples
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.sample-plan.outputs.cache-paths }}
          key: ${{ runner.os }}-${{ steps.sample-plan.outputs.cache-key }}
      - name: Fetch public DICOM series and verify every pinned file hash
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          python3 scripts/record-run.py --run-dir tmp/part1-xa-ci/samples --file tests/part1/archive_download.py --file tests/part1/archive_download_test.py --cwd . --tree tests/part1/xa --file worklist-v0/hpacs-lite/xa-playback-model.js --file worklist-v0/hpacs-lite/viewer-xa-playback.js --file .github/workflows/part1-xa.yml -- python3 -B tests/part1/xa/ci.py fetch
      - name: Model behaviour cases
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          python3 scripts/record-run.py --run-dir tmp/part1-xa-ci/model --cwd . --tree tests/part1/xa --file worklist-v0/hpacs-lite/xa-playback-model.js --file worklist-v0/hpacs-lite/viewer-xa-playback.js --file .github/workflows/part1-xa.yml -- node --test --test-reporter=tap --test-reporter-destination=tmp/part1-xa-ci/model.tap --test-reporter=spec --test-reporter-destination=stdout tests/part1/xa/model_test.cjs
      - name: Model declared cases equal the cases that passed
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          python3 scripts/record-run.py --run-dir tmp/part1-xa-ci/model-selection --cwd . --tree tests/part1/xa --file worklist-v0/hpacs-lite/xa-playback-model.js --file worklist-v0/hpacs-lite/viewer-xa-playback.js --file .github/workflows/part1-xa.yml --file tmp/part1-xa-ci/model.tap -- python3 -c "$(cat <<'PY'
          import collections, json, os, re
          from pathlib import Path
          unit = os.environ["PART1_UNIT"]
          declaration = json.loads(Path("tests/part1/" + unit + "/cases.json").read_text(encoding="utf-8"))
          body = declaration["suites"][0] if unit == "mg" else declaration["suites"]["model"]
          expected = [c["name"] for c in body["cases"]]
          if unit == "mg":
              table = json.loads(Path(os.environ["KIN_MG_RULE_CASES"]).read_text(encoding="utf-8"))
              expected += ["D744 rule table is the pinned one"] + [c["testId"] for c in table["cases"]]
              assert len(expected) == body["expected"]
          tap = Path("tmp/part1-" + unit + "-ci/model.tap").read_text(encoding="utf-8")
          results = re.findall(r"^(ok|not ok) [0-9]+ - (.*)$", tap, re.M)
          actual = [name for status, name in results]
          assert collections.Counter(actual) == collections.Counter(expected), {"declared": expected, "collected": actual}
          assert all(status == "ok" for status, _ in results), results
          assert re.search(r"^# (?:skip|skipped) 0$", tap, re.M), "no skipped cases allowed"
          assert re.search(r"^# todo 0$", tap, re.M), "no TODO cases allowed"
          print(json.dumps({"declared": len(expected), "collected": len(actual), "passed": len(actual), "names": actual}, indent=2))
          PY
          )"
      - name: DICOM contract cases with exact collection and no silent skips
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          python3 scripts/record-run.py --run-dir tmp/part1-xa-ci/dicom --cwd . --tree tests/part1/xa --file worklist-v0/hpacs-lite/xa-playback-model.js --file worklist-v0/hpacs-lite/viewer-xa-playback.js --file .github/workflows/part1-xa.yml -- "$RUNNER_TEMP/part1-xa-python/bin/python" -c "$(cat <<'PY'
          import importlib.util, json, os, sys, unittest
          from pathlib import Path
          unit, name = os.environ["PART1_UNIT"], sys.argv[1]
          declaration = json.loads(Path("tests/part1/" + unit + "/cases.json").read_text(encoding="utf-8"))
          if unit == "mg":
              body = next(s for s in declaration["suites"] if s["id"] == name)
              filename, klass = body["file"], body["class"]
              expected = [c["name"] for c in body["cases"]]
          else:
              body = declaration["suites"][name]
              filename = body["path"]
              klass = "XaDicomContractTest" if name == "dicom" else "XaPlaybackDomTest"
              expected = [c["method"] for c in body["cases"]]
          spec = importlib.util.spec_from_file_location("part1_" + unit + "_" + name, filename)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          def flatten(suite):
              for test in suite:
                  if isinstance(test, unittest.TestSuite):
                      yield from flatten(test)
                  else:
                      yield test
          collected = list(flatten(suite))
          actual = [(t.__class__.__name__, t._testMethodName) for t in collected]
          want = [(klass, method) for method in expected]
          if len(actual) != len(want) or sorted(actual) != sorted(want):
              raise SystemExit("declared != collected: " + repr({"declared": want, "collected": actual}))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          report = {"declared": len(want), "collected": actual, "run": result.testsRun,
                    "not_run": [{"case": test.id(), "reason": reason} for test, reason in result.skipped],
                    "errors": [test.id() for test, _ in result.errors], "failures": [test.id() for test, _ in result.failures]}
          print(json.dumps(report, indent=2))
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("### " + unit.upper() + " " + name + "\n\n")
                  summary.write("Declared/collected: %d/%d; errors: %d; failures: %d; not run: %d.\n" %
                                (len(want), len(actual), len(result.errors), len(result.failures), len(result.skipped)))
                  for entry in report["not_run"]:
                      summary.write("- NOT RUN `" + entry["case"] + "`: " + entry["reason"] + "\n")
          if result.skipped:
              print("::error::Required cases NOT RUN; see exact case names and reasons in this step record.")
          sys.exit(0 if result.wasSuccessful() and not result.skipped and result.testsRun == len(want) else 1)
          PY
          )" dicom
      - name: Full Chromium DOM cases with exact collection and no silent skips
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          python3 scripts/record-run.py --run-dir tmp/part1-xa-ci/dom --cwd . --tree tests/part1/xa --file worklist-v0/hpacs-lite/xa-playback-model.js --file worklist-v0/hpacs-lite/viewer-xa-playback.js --file .github/workflows/part1-xa.yml -- "$RUNNER_TEMP/part1-xa-python/bin/python" -c "$(cat <<'PY'
          import importlib.util, json, os, sys, unittest
          from pathlib import Path
          unit, name = os.environ["PART1_UNIT"], sys.argv[1]
          declaration = json.loads(Path("tests/part1/" + unit + "/cases.json").read_text(encoding="utf-8"))
          if unit == "mg":
              body = next(s for s in declaration["suites"] if s["id"] == name)
              filename, klass = body["file"], body["class"]
              expected = [c["name"] for c in body["cases"]]
          else:
              body = declaration["suites"][name]
              filename = body["path"]
              klass = "XaDicomContractTest" if name == "dicom" else "XaPlaybackDomTest"
              expected = [c["method"] for c in body["cases"]]
          spec = importlib.util.spec_from_file_location("part1_" + unit + "_" + name, filename)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          def flatten(suite):
              for test in suite:
                  if isinstance(test, unittest.TestSuite):
                      yield from flatten(test)
                  else:
                      yield test
          collected = list(flatten(suite))
          actual = [(t.__class__.__name__, t._testMethodName) for t in collected]
          want = [(klass, method) for method in expected]
          if len(actual) != len(want) or sorted(actual) != sorted(want):
              raise SystemExit("declared != collected: " + repr({"declared": want, "collected": actual}))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          report = {"declared": len(want), "collected": actual, "run": result.testsRun,
                    "not_run": [{"case": test.id(), "reason": reason} for test, reason in result.skipped],
                    "errors": [test.id() for test, _ in result.errors], "failures": [test.id() for test, _ in result.failures]}
          print(json.dumps(report, indent=2))
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("### " + unit.upper() + " " + name + "\n\n")
                  summary.write("Declared/collected: %d/%d; errors: %d; failures: %d; not run: %d.\n" %
                                (len(want), len(actual), len(result.errors), len(result.failures), len(result.skipped)))
                  for entry in report["not_run"]:
                      summary.write("- NOT RUN `" + entry["case"] + "`: " + entry["reason"] + "\n")
          if result.skipped:
              print("::error::Required cases NOT RUN; see exact case names and reasons in this step record.")
          sys.exit(0 if result.wasSuccessful() and not result.skipped and result.testsRun == len(want) else 1)
          PY
          )" dom
      - name: Mutants against an exact unmutated baseline
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          python3 scripts/record-run.py --run-dir tmp/part1-xa-ci/mutants --cwd . --tree tests/part1/xa --file worklist-v0/hpacs-lite/xa-playback-model.js --file worklist-v0/hpacs-lite/viewer-xa-playback.js --file .github/workflows/part1-xa.yml -- "$RUNNER_TEMP/part1-xa-python/bin/python" -B tests/part1/xa/mutants.py --out tmp/part1-xa-ci/mutants-result/summary.json
      - name: R1 evidence including failures and not-run reasons
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: part1-xa-results
          path: tmp/part1-xa-ci/
          if-no-files-found: error
          retention-days: 7
