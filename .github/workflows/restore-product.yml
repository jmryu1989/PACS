name: Synthetic product schema restore across jobs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-product-${{ github.ref }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      receipt_sha256: ${{ steps.prepare.outputs.receipt_sha256 }}
      product_sha256: ${{ steps.prepare.outputs.product_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Product schema refusals
        run: python3 -B tests/ops_product_transfer_test.py
      - name: Shared transport and Orthanc helper regressions
        run: |
          python3 -B tests/ops_combined_transfer_test.py
          python3 -B tests/ops_orthanc_transfer_test.py
      - name: Apply product migration and bind synthetic rows to frozen DICOM
        id: prepare
        run: python3 -B tests/ops_product_transfer_fixture.py produce "$RUNNER_TEMP/kin-product-transfer"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: synthetic-product-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kin-product-transfer/postgres-image.tar
            ${{ runner.temp }}/kin-product-transfer/orthanc-image.tar
            ${{ runner.temp }}/kin-product-transfer/kin.dump
            ${{ runner.temp }}/kin-product-transfer/keycloak.dump
            ${{ runner.temp }}/kin-product-transfer/store.tar
            ${{ runner.temp }}/kin-product-transfer/receipt.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false
          overwrite: false
  consume:
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.produce.outputs.artifact_id }}
          path: ${{ runner.temp }}/kin-product-download
          merge-multiple: true
          digest-mismatch: error
      - name: Restore product schema and reject a real foreign synthetic dump
        env:
          RECEIPT_SHA256: ${{ needs.produce.outputs.receipt_sha256 }}
          PRODUCT_SHA256: ${{ needs.produce.outputs.product_sha256 }}
        run: python3 -B tests/ops_product_transfer_fixture.py consume "$RUNNER_TEMP/kin-product-download" --receipt-sha256 "$RECEIPT_SHA256" --product-sha256 "$PRODUCT_SHA256"
