x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    networks:
      default: {}
      workflow: {}
    environment:
      DEPLOYMENT_MODE: production
      PUBLIC_PORT: "443"
      SERVER_NAME: pacs.koreaimagingnetwork.com
    ports: !override
      - "80:80"
      - "443:443"
    # 개발 인증서 볼륨을 운영에 남기면 Let's Encrypt 누락을 자체 서명으로 가릴 수 있다.
    volumes: !override
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/kin-workflow/nginx:/etc/nginx/workflow:ro
    logging: *bounded-logging

  orthanc:
    ports: !override
      - "127.0.0.1:8042:8042"
    logging: *bounded-logging

  db:
    ports: !reset []
    logging: *bounded-logging

  emr-provision:
    logging: *bounded-logging

  # EMR-B1: 운영 이관도 같은 운영 이미지의 일회성 프로세스(설치 자격)로만 한다. 호스트 파일은 덮지 않는다.
  api-migrate:
    build:
      target: production
      args:
        VCS_REF: ${KIN_REVISION:-unknown}
    volumes: !reset []
    logging: *bounded-logging

  keycloak:
    command: start --import-realm
    environment:
      KC_HOSTNAME: https://pacs.koreaimagingnetwork.com/auth
    ports: !override
      - "127.0.0.1:8080:8080"
    logging: *bounded-logging

  api:
    build:
      target: production
      args:
        VCS_REF: ${KIN_REVISION:-unknown}
    environment:
      DEPLOYMENT_MODE: production
      KC_ISSUER: https://pacs.koreaimagingnetwork.com/auth/realms/kin
    ports: !reset []
    # 이미지 안에 빌드된 JS·Prisma 스키마만 쓴다. 운영에서 호스트 파일을 덮으면
    # 배포한 이미지와 실제 실행 코드가 달라져 재현 가능한 롤백이 사라진다.
    # 남는 마운트는 EMR-B1 보호 상태 볼륨(원장 seal·실패 저널) 하나뿐이며 호스트 경로가 아니다.
    volumes: !override
      - emr-state:/var/lib/kin-emr
    logging: *bounded-logging

# Only the HTTPS proxy joins this auxiliary network from the PACS stack.
# The separately managed workflow receiver has no route to clinical containers.
networks:
  workflow:
    name: kin-workflow
    internal: true
