x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    networks:
      default: {}
      workflow: {}
    environment:
      DEPLOYMENT_MODE: production
      PUBLIC_PORT: "443"
      SERVER_NAME: pacs.halolabs.co.kr
    ports: !override
      - "80:80"
      - "443:443"
    # 개발 인증서 볼륨을 운영에 남기면 Let's Encrypt 누락을 자체 서명으로 가릴 수 있다.
    volumes: !override
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/kin-workflow/nginx:/etc/nginx/workflow:ro
    logging: *bounded-logging

  orthanc:
    ports: !override
      - "127.0.0.1:8042:8042"
    logging: *bounded-logging

  db:
    ports: !reset []
    logging: *bounded-logging

  emr-provision:
    logging: *bounded-logging

  # EMR-B1: 운영 이관도 같은 운영 이미지의 일회성 프로세스(설치 자격)로만 한다. 호스트 파일은 덮지 않는다.
  api-migrate:
    build:
      target: production
      args:
        VCS_REF: ${KIN_REVISION:-unknown}
    volumes: !reset []
    logging: *bounded-logging

  keycloak:
    # 이 command가 기본 docker-compose.yml의 것을 통째로 덮어쓴다. 세션 캐시 OFF 옵션을 여기서 빠뜨리면 운영에만 끝낸 세션의
    # 캐시 부활 경로(keycloak#51127)가 남는다 — 기본 파일과 같은 옵션을 둔다(이유·확인: keycloak/README.md).
    command: start --import-realm --spi-user-sessions--infinispan--use-caches=false
    environment:
      KC_HOSTNAME: https://pacs.halolabs.co.kr/auth
    ports: !override
      - "127.0.0.1:8080:8080"
    logging: *bounded-logging

  api:
    build:
      target: production
      args:
        VCS_REF: ${KIN_REVISION:-unknown}
    environment:
      DEPLOYMENT_MODE: production
      KC_ISSUER: https://pacs.halolabs.co.kr/auth/realms/kin
      # The BFF's callback and post-logout addresses come from this origin. Pinned here with KC_ISSUER and KC_HOSTNAME so
      # a host .env still naming the previous host cannot send the login back to it.
      PUBLIC_ORIGIN: https://pacs.halolabs.co.kr
      # The retention ledgers' second copy, written with every append; the gate restores a lost ledger file from it.
      KIN_LEDGER_MIRROR_DIR: /var/lib/kin-ledger-mirror
      # The Prisma library engine sets these two on its first TLS connector (openssl-probe) while the server's main thread
      # may read the environment; adding a missing name grows glibc's environ array under that read (exp-node-sigsegv:
      # PID 1 SIGSEGV). Present from the start, the engine's setenv only updates them in place. The values are the image's
      # OpenSSL default and the engine's own choice there (tests/production_image_test.py checks both against the image).
      SSL_CERT_FILE: /usr/lib/ssl/cert.pem
      SSL_CERT_DIR: /usr/lib/ssl/certs
    ports: !reset []
    # 이미지 안에 빌드된 JS·Prisma 스키마만 쓴다. 운영에서 호스트 파일을 덮으면
    # 배포한 이미지와 실제 실행 코드가 달라져 재현 가능한 롤백이 사라진다.
    # 쓰기 마운트는 EMR-B1 보호 상태 볼륨(원장 seal·실패 저널)과 CD-09-P 초안 파기 원장 볼륨·그 사본 볼륨뿐이고, 그 밖에는 읽기 전용 이름 볼륨만 둔다. 호스트 경로는 없다.
    volumes: !override
      - emr-state:/var/lib/kin-emr
      - purpose-ledger:/var/lib/kin-purpose   # CD-09-P draft destruction ledger, outside every backup (docker-compose.yml api)
      - ledger-mirror:/var/lib/kin-ledger-mirror   # its mirror (KIN_LEDGER_MIRROR_DIR), on this host, outside every backup
      - orthanc-db:/var/lib/orthanc/db:ro   # MG-LOADING: the API's read-only frame range reads (docker-compose.yml api)
    logging: *bounded-logging

# Only the HTTPS proxy joins this auxiliary network from the PACS stack.
# The separately managed workflow receiver has no route to clinical containers.
networks:
  workflow:
    name: kin-workflow
    internal: true
