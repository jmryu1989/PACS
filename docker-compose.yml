# Korea Imaging Network — 미니 PACS + 백엔드
# 실행:  docker compose up -d --build
#
# ── 정식 입구는 리버스 프록시 하나다 ──
# 포트가 8443이 아니라 9443인 이유: 윈도우(Hyper-V/WSL2)가 8440~8939를 동적 포트
# 예약 범위로 잡아버려서 도커가 8443을 바인딩하지 못한다. 컨테이너는 Up인데 PORTS에
# 화살표가 안 붙고 접속만 거부되는, 알아채기 어려운 증상으로 나온다.
# 9443은 예약 범위 밖이고, netsh로 우리 앞에 예약해 두면 다시 뺏기지 않는다.
#   https://localhost:9443/                     HPACS-lite (자체 서명 인증서 — 첫 접속에 경고 1회)
#   https://localhost:9443/ohif/                OHIF 뷰어
#   https://localhost:9443/api/health           KIN API
#   https://localhost:9443/auth/                Keycloak
#   http://localhost:8081/                      → https로 리다이렉트
#
# 아래 포트들은 **운영·디버깅용**으로만 열어둔다. 앱은 이 주소로 쓰지 않는다 —
# 출처가 둘이면 토큰의 iss도 쿠키도 둘로 갈린다.
#   http://localhost:8042   Orthanc 관리 UI
#   http://localhost:3000   API 직접 호출
#   http://localhost:5432   PostgreSQL
services:
  # ── 리버스 프록시: 모든 것을 한 출처로 ──
  # 왜: CORS 제거, 토큰을 HttpOnly 쿠키로 옮길 길, Orthanc 자격증명을 브라우저에서 제거,
  #     그리고 프로덕션(6단계)의 모양을 지금 만들어 두기. 자세한 건 proxy/Dockerfile.
  proxy:
    build: ./proxy
    container_name: kin-proxy
    restart: unless-stopped
    environment:
      PUBLIC_PORT: ${PUBLIC_PORT:-9443}
      ORTHANC_USER: admin
      ORTHANC_PASS: ${ORTHANC_PASS:?ORTHANC_PASS를 .env에 설정하세요}
      # 공식 20-envsubst 스크립트가 nginx의 $host 같은 변수를 건드리지 못하게 한다.
      NGINX_ENVSUBST_FILTER: '^(PUBLIC_PORT|PUBLIC_PORT_SUFFIX|SERVER_NAME|TLS_CERTIFICATE|TLS_CERTIFICATE_KEY)'
    ports:
      - "${PUBLIC_PORT:-9443}:443"
      - "8081:80"
    depends_on:
      - orthanc
      - api
      - keycloak
    volumes:
      - proxy-certs:/etc/nginx/certs   # 자체 서명 인증서는 여기 남는다(저장소에 커밋하지 않는다)

  orthanc:
    image: orthancteam/orthanc:24.12.0
    container_name: kin-orthanc
    restart: unless-stopped
    environment:
      OHIF_PLUGIN_ENABLED: "true"   # 이미지에 내장된 OHIF 뷰어 플러그인 활성화
      # orthanc.json에 계정을 남기면 운영 비밀번호와 프록시 헤더가 쉽게 어긋난다.
      # 이미지가 JSON을 읽은 뒤 같은 설정 경로를 이 값으로 덮게 해 한 출처만 둔다.
      ORTHANC__REGISTERED_USERS: '{"admin":"${ORTHANC_PASS:?ORTHANC_PASS를 .env에 설정하세요}"}'
    ports:
      - "8042:8042"   # HTTP: 웹 UI, REST API, DICOMweb, OHIF
      - "4242:4242"   # DICOM 프로토콜 (C-STORE/C-FIND 실습용)
    volumes:
      - ./config/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./config/ohif.js:/etc/orthanc/ohif.js:ro
      - ./worklist-v0:/worklist:ro
      - orthanc-db:/var/lib/orthanc/db

  # ── 3단계: 판독 상태·판독문·오더를 담는 진짜 데이터베이스 ──
  db:
    image: postgres:16-alpine
    container_name: kin-db
    restart: unless-stopped
    # EMR-B1: 접속원장(emr_access)은 별도 볼륨의 전용 tablespace에 둔다. CREATE TABLESPACE가 쓰려면 그 디렉터리가
    # postgres 소유여야 하므로 root로 시작하는 이 단계에서 준비하고, 이미지의 원래 entrypoint로 서버를 연다.
    entrypoint: ["sh", "-c", "install -d -o postgres -g postgres -m 700 /var/lib/postgresql/emr-access/ts && exec docker-entrypoint.sh postgres"]
    environment:
      POSTGRES_USER: kin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
      POSTGRES_DB: kin
    ports:
      - "5432:5432"   # DBeaver 등으로 직접 들여다보기 위해 열어둔다
    volumes:
      - pg-db:/var/lib/postgresql/data
      - emr-access:/var/lib/postgresql/emr-access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kin"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── EMR-B1 설치 단계: 역할·비밀·전용 tablespace (설치 자격, migration transaction 밖) ──
  # 같은 SQL을 `python scripts/emr-compose.py sql provision`이 출력하고 `check`가 이 본문과 대조한다. 비밀은 환경에서만
  # 받는다(.env의 KIN_EMR_RUNTIME_PASSWORD, URL에 그대로 쓰는 24자 이상의 [A-Za-z0-9._~-]). 매번 같은 결과로 다시 적용된다.
  emr-provision:
    image: postgres:16-alpine
    container_name: kin-emr-provision
    restart: "no"
    environment:
      PGHOST: db
      PGUSER: kin
      PGDATABASE: kin
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
      KIN_EMR_RUNTIME_PASSWORD: ${KIN_EMR_RUNTIME_PASSWORD:?KIN_EMR_RUNTIME_PASSWORD를 .env에 설정하세요}
    entrypoint: ["sh", "-ec"]
    command:
      - |
        psql -X <<'KIN_EMR_SQL'
        -- EMR-B provisioning, run with the installer credential outside any migration transaction (CREATE TABLESPACE cannot
        -- run inside one). Idempotent: every run re-asserts the roles, their attributes, the secrets given in the environment
        -- and the dedicated placement, and fails on any elevated attribute or membership. Secrets are never printed.
        \set QUIET on
        \set ON_ERROR_STOP on
        \if :{?tablespace_location}
        \else
        \set tablespace_location /var/lib/postgresql/emr-access/ts
        \endif
        SELECT format('CREATE ROLE %I NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT', r)
          FROM unnest(ARRAY['kin_emr_owner', 'kin_runtime', 'kin_emr_reader', 'kin_emr_retention']) AS r
          WHERE NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = r) \gexec
        SELECT format('ALTER ROLE %I NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT', r)
          FROM unnest(ARRAY['kin_emr_owner', 'kin_runtime', 'kin_emr_reader', 'kin_emr_retention']) AS r \gexec
        ALTER ROLE kin_emr_owner NOLOGIN;
        \getenv runtime_password KIN_EMR_RUNTIME_PASSWORD
        \if :{?runtime_password}
        \else
        \warn 'KIN_EMR_RUNTIME_PASSWORD is required'
        SELECT kin_emr_runtime_password_required;
        \endif
        SELECT CASE WHEN length(:'runtime_password') >= 24 AND :'runtime_password' ~ '\A[A-Za-z0-9._~-]+\Z'
          THEN format('ALTER ROLE kin_runtime LOGIN PASSWORD %L', :'runtime_password') ELSE 'SELECT kin_runtime_password_unusable' END \gexec
        \getenv reader_password KIN_EMR_READER_PASSWORD
        \if :{?reader_password}
        SELECT CASE WHEN length(:'reader_password') >= 24 AND :'reader_password' ~ '\A[A-Za-z0-9._~-]+\Z'
          THEN format('ALTER ROLE kin_emr_reader LOGIN PASSWORD %L', :'reader_password') ELSE 'SELECT kin_emr_reader_password_unusable' END \gexec
        \else
        ALTER ROLE kin_emr_reader NOLOGIN;
        \endif
        \getenv retention_password KIN_EMR_RETENTION_PASSWORD
        \if :{?retention_password}
        SELECT CASE WHEN length(:'retention_password') >= 24 AND :'retention_password' ~ '\A[A-Za-z0-9._~-]+\Z'
          THEN format('ALTER ROLE kin_emr_retention LOGIN PASSWORD %L', :'retention_password') ELSE 'SELECT kin_emr_retention_password_unusable' END \gexec
        \else
        ALTER ROLE kin_emr_retention NOLOGIN;
        \endif
        SELECT format('CREATE TABLESPACE kin_emr_access OWNER kin_emr_owner LOCATION %L', :'tablespace_location')
          WHERE NOT EXISTS (SELECT 1 FROM pg_catalog.pg_tablespace WHERE spcname = 'kin_emr_access') \gexec
        ALTER TABLESPACE kin_emr_access OWNER TO kin_emr_owner;
        SELECT CASE WHEN pg_catalog.pg_tablespace_location(oid) = :'tablespace_location' THEN 'SELECT 1 AS kin_emr_tablespace_checked'
          ELSE 'SELECT kin_emr_tablespace_location_differs' END FROM pg_catalog.pg_tablespace WHERE spcname = 'kin_emr_access' \gexec
        -- A database migrated before the tablespace existed: move the ledger (tables carry their TOAST; indexes move apart).
        SELECT format('ALTER TABLE emr_access.%I SET TABLESPACE kin_emr_access', c.relname)
          FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'emr_access' AND c.relkind = 'r'
            AND c.reltablespace IS DISTINCT FROM (SELECT t.oid FROM pg_catalog.pg_tablespace t WHERE t.spcname = 'kin_emr_access') \gexec
        SELECT format('ALTER INDEX emr_access.%I SET TABLESPACE kin_emr_access', c.relname)
          FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'emr_access' AND c.relkind = 'i'
            AND c.reltablespace IS DISTINCT FROM (SELECT t.oid FROM pg_catalog.pg_tablespace t WHERE t.spcname = 'kin_emr_access') \gexec
        SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname IN ('kin_emr_owner', 'kin_runtime', 'kin_emr_reader', 'kin_emr_retention')
            AND (rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls))
          OR EXISTS (SELECT 1 FROM pg_catalog.pg_auth_members m JOIN pg_catalog.pg_roles g ON g.oid = m.roleid
            JOIN pg_catalog.pg_roles u ON u.oid = m.member WHERE g.rolname IN ('kin_emr_owner', 'kin_runtime', 'kin_emr_reader', 'kin_emr_retention') OR u.rolname IN ('kin_emr_owner', 'kin_runtime', 'kin_emr_reader', 'kin_emr_retention'))
          OR EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'kin_emr_owner' AND rolcanlogin)
          OR pg_catalog.has_parameter_privilege('kin_runtime', 'session_replication_role', 'SET')
          THEN 'SELECT kin_emr_role_check_failed' ELSE 'SELECT 1 AS kin_emr_roles_checked' END \gexec
        KIN_EMR_SQL
    depends_on:
      db:
        condition: service_healthy

  # ── EMR-B1 이관: 설치 자격은 이 일회성 프로세스에만 있다. API 서버는 이 자격을 받지 않는다 ──
  api-migrate:
    build:
      context: ./api
      target: development
    container_name: kin-api-migrate
    restart: "no"
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://kin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}@db:5432/kin
    depends_on:
      emr-provision:
        condition: service_completed_successfully
    volumes:
      - ./api/prisma:/app/prisma:ro

  # ── 인증: Keycloak (OIDC) ──
  # 렐름·클라이언트·개발용 계정은 keycloak/kin-realm.json 에서 자동으로 들어온다.
  # 이 파일은 처음 한 번만 import된다 (자세한 건 keycloak/README.md).
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: kin-keycloak
    restart: unless-stopped
    # 사용자/클라이언트 세션의 내장 캐시를 끈다(persistent user sessions는 그대로 켜 둔다). 26.7.3에서는 캐시가 비었을 때
    # DB에서 읽은 옛 세션을 다시 캐시에 넣는 사이 종료가 끼면, 끝낸 세션이 캐시에서 되살아나 확인된 Log out 뒤에도 앞 의사의
    # 인증을 돌려줄 수 있다(keycloak#51127). 캐시 없이 DB만 읽으면 그 부활 경로가 없다. 이유·확인 방법: keycloak/README.md.
    # 운영 command는 docker-compose.prod.yml이 덮어쓰므로 그쪽에도 같은 옵션을 둔다.
    command: start-dev --import-realm --spi-user-sessions--infinispan--use-caches=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD를 .env에 설정하세요}
      # 렐름·계정·회전된 자격증명은 PostgreSQL에 남긴다. JSON import는 빈 DB에서만 실행된다.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: kin
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
      # 렐름 JSON의 비밀값은 저장소가 아니라 .env에서 주입한다.
      KC_KIN_API_SECRET: ${KC_CLIENT_SECRET:?KC_CLIENT_SECRET을 .env에 설정하세요}
      KC_WEB_SECRET: ${KC_WEB_SECRET:?KC_WEB_SECRET을 .env에 설정하세요}
      # 이 주소가 토큰의 iss에 박힌다. 고정해 두지 않으면 요청 호스트에 따라 흔들린다.
      # 이제 브라우저는 프록시를 통해 들어오므로, 브라우저가 보는 주소를 적는다.
      KC_HOSTNAME: ${PUBLIC_ORIGIN:-https://localhost:9443}/auth
      # Keycloak을 /auth 밑에 둔다. 프록시가 경로를 고쳐 쓰지 않아도 되고,
      # Keycloak이 스스로 만드는 링크·리다이렉트도 처음부터 맞는다.
      KC_HTTP_RELATIVE_PATH: /auth
      # X-Forwarded-* 를 신뢰한다. 없으면 Keycloak은 자기가 http로 열린 줄 안다.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/kin-realm.json:/opt/keycloak/data/import/kin-realm.json:ro
      - ./keycloak/themes/kin-login:/opt/keycloak/themes/kin-login:ro
      - ./keycloak/themes/kin-email:/opt/keycloak/themes/kin-email:ro
    depends_on:
      db:
        condition: service_healthy
    # 헬스체크도 두지 않는다. 이 이미지에는 curl/wget이 없고 셸 트릭은 환경을 탄다.
    # API는 JWKS를 부팅이 아니라 **첫 요청 때** 가져오므로 Keycloak이 늦게 떠도 괜찮다.

  api:
    build:
      context: ./api
      target: development
    container_name: kin-api
    restart: unless-stopped
    environment:
      # EMR-B1: 서버는 최소권한 runtime 역할로만 접속한다(업무 DML과 검증된 원장 append 실행만; 소유·superuser·이관 자격 없음).
      DATABASE_URL: postgresql://kin_runtime:${KIN_EMR_RUNTIME_PASSWORD:?KIN_EMR_RUNTIME_PASSWORD를 .env에 설정하세요}@db:5432/kin
      # 원장 seal·보호 실패 저널: DB 밖의 이 서버 전용 볼륨(DB 역할은 쓸 수 없다).
      KIN_EMR_STATE_DIR: /var/lib/kin-emr
      # 인증. iss는 브라우저가 보는 주소, JWKS는 도커 네트워크 안 주소 — 서로 다르다.
      AUTH_REQUIRED: "true"
      # iss는 **브라우저가 본 주소**다 — 토큰에 그렇게 박혀 오기 때문.
      # JWKS·Admin은 도커 네트워크 안 주소이고, 둘 다 /auth 접두어가 붙는다
      # (KC_HTTP_RELATIVE_PATH를 넣었으므로 내부 경로도 바뀐다).
      KC_ISSUER: ${PUBLIC_ORIGIN:-https://localhost:9443}/auth/realms/kin
      KC_JWKS_URL: http://keycloak:8080/auth/realms/kin/protocol/openid-connect/certs
      KC_AUDIENCE: kin-api
      # 서비스 계정 — "우리 기관 판독의가 누구인가"를 Keycloak에 묻기 위한 것(Preliminary 지정용).
      # 사용자의 토큰을 빌려 쓰지 않는다. 판독의에게 사용자 조회 권한을 줄 이유가 없다.
      # 운영에서는 이 시크릿을 compose가 아니라 시크릿 매니저에서 온다 (6단계).
      KC_ADMIN_URL: http://keycloak:8080/auth
      KC_REALM: kin
      KC_CLIENT_ID: kin-api
      KC_CLIENT_SECRET: ${KC_CLIENT_SECRET:?KC_CLIENT_SECRET을 .env에 설정하세요}
      KC_WEB_SECRET: ${KC_WEB_SECRET:?KC_WEB_SECRET을 .env에 설정하세요}
      KIN_COOKIE_SECRET: ${KIN_COOKIE_SECRET:?KIN_COOKIE_SECRET을 .env에 설정하세요}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:9443}
      # API가 브라우저 대신 Orthanc의 QIDO-RS를 부른다 (기관 필터를 서버에 두기 위해).
      # 도커 네트워크 안 주소이므로 localhost가 아니라 서비스 이름이다.
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USER: admin
      ORTHANC_PASS: ${ORTHANC_PASS:?ORTHANC_PASS를 .env에 설정하세요}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy   # DB는 준비될 때까지 기다린다 (Prisma가 바로 붙는다)
      api-migrate:
        condition: service_completed_successfully   # 검토된 migration과 설치 단계가 끝난 DB에서만 시작한다
      keycloak:
        condition: service_started   # Keycloak은 기다리지 않는다 (첫 요청 때 필요)
      orthanc:
        condition: service_started   # Orthanc도 첫 요청 때 필요하다 (부팅 때가 아니라)
    volumes:
      # 소스만 마운트 → 코드 고치면 컨테이너 안에서 자동 재시작(watch).
      # node_modules는 마운트하지 않는다 (윈도우 파일과 리눅스 바이너리가 섞이면 깨진다)
      - ./api/src:/app/src
      - ./api/prisma:/app/prisma
      - emr-state:/var/lib/kin-emr

volumes:
  orthanc-db:
  pg-db:
  proxy-certs:
  emr-access:   # EMR-B1 원장 tablespace (DB 데이터 볼륨과 별도)
  emr-state:    # EMR-B1 원장 seal·실패 저널 (API 전용, DB 밖)
