<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제품 화면 — 민훈 스튜디오</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="studio.css">
</head>
<body class="product-page">
<iframe id="product" class="full-product" title="제품 화면 (합성 자료)" src="about:blank"></iframe>
<div id="pending" class="banner" hidden>
  <span>새 버전이 준비됐어요. 입력 중이라 자동으로 바꾸지 않았습니다.</span>
  <button id="apply-now" type="button">지금 보기</button>
</div>
<div class="studio-widget" id="widget">
  <span id="link" class="dot" title="스튜디오 대화 창과 연결 확인 중"></span>
  <button id="pick" type="button" title="고르기 (Alt+G): 바꿀 곳을 클릭해 대화 창에 보냅니다. 클릭해도 화면의 버튼은 눌리지 않습니다.">고르기</button>
</div>
<script src="shared.js"></script>
<script src="mirror.js"></script>
<script src="pick.js"></script>
<script src="product.js"></script>
</body>
</html>
